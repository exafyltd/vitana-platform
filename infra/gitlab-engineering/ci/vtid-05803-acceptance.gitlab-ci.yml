# VTID-05803 Aurora staging acceptance (operation file of vitana/vitana-platform; declared in infra/gitlab-engineering/operations.json).
# The settings sync (scripts/eng/gitlab-settings.mjs) copies this file to vitana/ci-config; edit it here, never in GitLab.
# Runner source: scripts/aws/staging-acceptance/k5.py (embedded below as xz+base64; scripts/ci/staging-db/staging-acceptance.test.mjs
# proves the payload equals the source and its sha256). Regenerate the payload with python3 scripts/aws/staging-acceptance/embed.py (--check: exit 3 on drift).
# VTID-05803 acceptance (Kiro 5): READ-ONLY discovery of the existing staging migrate execution path.
# Runs ONLY on main, ONLY in an api/web pipeline with VTID05803_ACCEPTANCE=discover. It starts no task, registers nothing,
# changes no service, writes nothing to S3 or to a database, and reads no secret value (ARNs and names only).
# AWS access: GitLab OIDC -> existing role $AWS_STAGING_ROLE_ARN (vitana-gitlab-deploy-role), as vtid-05803-artifact-transfer.
# RunTask permission probes cannot start a task: one names a revision that does not exist (:999999); the other names the
# real latest revision with a no-op command and a subnet that does not exist, which ECS rejects before placement.
vtid-05803-acceptance-discover:
  stage: verify
  needs: []
  tags: [vitana-eng-v1]
  image: public.ecr.aws/docker/library/alpine:3.20
  interruptible: false
  retry: 0
  timeout: 15m
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://sts.amazonaws.com
  variables:
    AWS_REGION: eu-central-1
    AWS_DEFAULT_REGION: eu-central-1
    AWS_ROLE_ARN: $AWS_STAGING_ROLE_ARN
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/oidc-token
    CLUSTER: Vitana-ECS-Cluster
    FAMILY: vitana-aurora-staging-migrate
    NET_FROM_SERVICE: vitana-postgrest-aurora-proxy
    DBCLUSTER: vitana-aurora-staging
    BUCKET: vitana-code-index
    PFX: vtid-05803/staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(api|web)$/ && $VTID05803_ACCEPTANCE == "discover"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [discover/]
  script:
    - |
      set -uo pipefail
      apk add --no-cache aws-cli jq >/dev/null
      printf '%s' "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
      mkdir -p discover; D=discover
      try() { local n="$1"; shift; if "$@" > "$D/$n.json" 2> "$D/$n.err"; then echo "OK   $n"; else echo "DENY/FAIL $n: $(tr '\n' ' ' < "$D/$n.err" | cut -c1-300)"; fi; }
      ACCT=$(aws sts get-caller-identity --query Account --output text); echo "aws identity: $(aws sts get-caller-identity --query Arn --output text)"
      [ "$ACCT" = 472838866351 ] || { echo "STOP: not account 472838866351"; exit 1; }
      try td-list aws ecs list-task-definitions --family-prefix "$FAMILY" --sort DESC --max-items 5
      # ListTaskDefinitions is denied to this role; DescribeTaskDefinition is not, so walk the revisions directly.
      TDS=$(jq -r '.taskDefinitionArns[0:3][]? // empty' "$D/td-list.json" 2>/dev/null || true)
      if [ -z "$TDS" ]; then for r in 1 2 3 4 5 6; do aws ecs describe-task-definition --task-definition "$FAMILY:$r" --query taskDefinition.taskDefinitionArn --output text >/dev/null 2>&1 && TDS="$TDS $FAMILY:$r"; done; echo "revisions found: ${TDS:-none}"; fi
      for TD in $TDS; do
        n="td-${TD##*/}"; n="${n//:/-}"
        try "$n" aws ecs describe-task-definition --task-definition "$TD" --query 'taskDefinition.{family:family,revision:revision,status:status,exec:executionRoleArn,task:taskRoleArn,cpu:cpu,memory:memory,net:networkMode,compat:requiresCompatibilities,containers:containerDefinitions[].{name:name,image:image,command:command,entryPoint:entryPoint,secrets:secrets,env:environment,logs:logConfiguration}}'
        [ -s "$D/$n.json" ] && jq -c '{family,revision,status,exec,task,cpu,memory,net,containers:[.containers[]|{name,image,secrets:[.secrets[]?|{name,valueFrom}],env:[.env[]?|{name,value}],logs:.logs.options}]}' "$D/$n.json"
      done
      try net aws ecs describe-services --cluster "$CLUSTER" --services "$NET_FROM_SERVICE" --query 'services[0].{td:taskDefinition,net:networkConfiguration,running:runningCount,desired:desiredCount}'
      [ -s "$D/net.json" ] && jq -c . "$D/net.json"
      try rds aws rds describe-db-clusters --db-cluster-identifier "$DBCLUSTER" --query 'DBClusters[0].{status:Status,engine:EngineVersion,endpoint:Endpoint,http:HttpEndpointEnabled,members:length(DBClusterMembers)}'
      [ -s "$D/rds.json" ] && jq -c . "$D/rds.json"
      try s3-prefix aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PFX/" --delimiter / --query '{objects:Contents[].[Key,Size,LastModified],prefixes:CommonPrefixes[].Prefix}'
      [ -s "$D/s3-prefix.json" ] && jq -c . "$D/s3-prefix.json"
      try s3-runs aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PFX/runs/" --query 'Contents[].[Key,Size,LastModified]'
      [ -s "$D/s3-runs.json" ] && jq -r '.[]?|@tsv' "$D/s3-runs.json" | tail -60
      # Permission probe only: revision 999999 does not exist, so no task can start.
      if aws ecs run-task --cluster "$CLUSTER" --task-definition "$FAMILY:999999" --launch-type FARGATE \
           --network-configuration 'awsvpcConfiguration={subnets=[subnet-00000000],assignPublicIp=DISABLED}' > "$D/runtask-probe.out" 2>&1; then
        echo "UNEXPECTED: run-task on a missing revision returned success"; cat "$D/runtask-probe.out"
      else
        echo "runtask-probe: $(tr '\n' ' ' < "$D/runtask-probe.out" | cut -c1-300)"
      fi
      LATEST=$(echo $TDS | tr ' ' '\n' | tail -1)
      if [ -n "$LATEST" ]; then
        NETJSON=$(jq -c '.net.awsvpcConfiguration' "$D/net.json")
        CNAME=$(aws ecs describe-task-definition --task-definition "$LATEST" --query 'taskDefinition.containerDefinitions[0].name' --output text)
        # PassRole/RunTask probe on the REAL latest revision with a subnet that does not exist and a no-op command:
        # ECS rejects the subnet synchronously, so no task can start. AccessDenied here = iam:PassRole or RunTask refused.
        OV=$(jq -cn --arg c "$CNAME" '{containerOverrides:[{name:$c,command:["true"]}]}')
        if aws ecs run-task --cluster "$CLUSTER" --task-definition "$LATEST" --launch-type FARGATE --overrides "$OV" \
             --network-configuration 'awsvpcConfiguration={subnets=[subnet-00000000000000000],assignPublicIp=DISABLED}' > "$D/passrole-probe.out" 2>&1; then
          echo "UNEXPECTED: run-task accepted a non-existent subnet"; jq -c '{tasks:[.tasks[]?.taskArn],failures}' "$D/passrole-probe.out"
        else
          echo "passrole-probe ($LATEST): $(tr '\n' ' ' < "$D/passrole-probe.out" | cut -c1-400)"
        fi
        echo "network the run would use (from $NET_FROM_SERVICE): $NETJSON"
      fi
      try describe-tasks-probe aws ecs describe-tasks --cluster "$CLUSTER" --tasks 00000000000000000000000000000000
      LG=$(jq -rs 'map(.containers[0].logs.options["awslogs-group"] // empty)|.[0] // empty' "$D"/td-*.json 2>/dev/null || true)
      LP=$(jq -rs 'map(.containers[0].logs.options["awslogs-stream-prefix"] // empty)|.[0] // empty' "$D"/td-*.json 2>/dev/null || true)
      echo "log group: ${LG:-none} prefix: ${LP:-none}"
      if [ -n "$LG" ]; then
        try logs aws logs describe-log-streams --log-group-name "$LG" --order-by LastEventTime --descending --max-items 8 --query 'logStreams[].[logStreamName,lastEventTimestamp]'
        [ -s "$D/logs.json" ] && jq -r '.[]?|@tsv' "$D/logs.json"
        try logs-read aws logs filter-log-events --log-group-name "$LG" --limit 5 --query 'events[].[logStreamName,timestamp]'
        S1=$(jq -r '.[0][0] // empty' "$D/logs.json" 2>/dev/null || true)
        if [ -n "$S1" ]; then try logs-get aws logs get-log-events --log-group-name "$LG" --log-stream-name "$S1" --limit 3 --query 'events[].timestamp'; fi
      fi
      # GetLogEvents on a stream name that cannot exist: AccessDenied = no read; ResourceNotFound = read allowed.
      aws logs get-log-events --log-group-name /vitana/schema-parity --log-stream-name staging-migrate/migrate/00000000000000000000000000000000 --limit 1 > "$D/getlog-probe.out" 2>&1 || true
      echo "getlog-probe: $(tr '\n' ' ' < "$D/getlog-probe.out" | cut -c1-300)"
      for k in vtid-05803-acceptance-v1.tgz vtid-05803-bootstrap.sh runs/LAST-PROBE-PASS; do
        try "head-${k//\//-}" aws s3api head-object --bucket "$BUCKET" --key "$PFX/$k" --query '[ContentLength,LastModified]'
        [ -s "$D/head-${k//\//-}.json" ] && echo "  $PFX/$k $(jq -c . "$D/head-${k//\//-}.json")"
      done
      # Live staging services: which secrets their task definitions bind (names and ARNs only, never values).
      for SV in ${K5_SERVICES:-vitana-gateway vitana-postgrest-aurora-proxy}; do
        TDA=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SV" --query 'services[0].taskDefinition' --output text 2>/dev/null || echo "")
        DC=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SV" --query 'services[0].[desiredCount,runningCount,loadBalancers[0].targetGroupArn]' --output text 2>/dev/null || echo "?")
        echo "service $SV: ${TDA:-unreadable} desired/running=$DC"
        [ -n "$TDA" ] || continue
        aws ecs describe-task-definition --task-definition "$TDA" --query 'taskDefinition.containerDefinitions[0].{secrets:secrets[].[name,valueFrom],env:environment[?contains(name,`SUPABASE`)||contains(name,`AURORA`)||contains(name,`DATA_`)||contains(name,`PGRST`)].[name,value]}' --output json > "$D/svc-$SV.json" 2>&1 || true
        jq -r '(.secrets[]? | "  secret \(.[0]) <- \(.[1] | sub("arn:aws:secretsmanager:eu-central-1:472838866351:secret:";""))"), (.env[]? | "  env    \(.[0]) = \(.[1])")' "$D/svc-$SV.json" 2>/dev/null | sed -E 's#(://[^:/@]+:)[^@]+@#\1***@#' || true
        PRODREF=$(jq -r '[.secrets[]?|select(.[1]|test("secret:vitana/(supabase|aurora)/prod/|vitana-aurora-prod"))|.[0]]|join(" ")' "$D/svc-$SV.json" 2>/dev/null || true)
        echo "  production-credential secrets bound: ${PRODREF:-none}"
      done
      for S in vitana/supabase/staging/jwt-secret vitana/supabase/staging/anon-key vitana/gateway/staging/service-token vitana/supabase/staging/url-aurora-proxy vitana/aurora/staging-db/database-url vitana/aurora/staging-db/postgrest-authenticator-uri; do
        if aws secretsmanager describe-secret --secret-id "$S" --query '[Name,LastChangedDate]' --output text > "$D/sec.out" 2>&1; then echo "secret exists: $(cat "$D/sec.out")"; else echo "secret $S: $(tr '\n' ' ' < "$D/sec.out" | grep -oE 'ResourceNotFoundException|AccessDeniedException' | head -1 || echo unreadable)"; fi
      done
      echo "DISCOVERY DONE (read-only)"

# VTID-05803 post-restore Aurora staging acceptance (Kiro 5): the Agentic Delivery staging-verification step.
# Runs ONLY on main in an api/web pipeline with VTID05803_ACCEPTANCE=run. Starts ONE one-shot Fargate task of the EXISTING
# family vitana-aurora-staging-migrate (secrets: SOURCE_URI = Supabase source, PGUSER/PGPASSWORD = staging master; env PGHOST
# = staging writer) with a command override that runs vtid-05803-acceptance/k5.py from this repository, embedded below as
# xz+base64 and checked against its sha256 before it runs. Both database sessions are default_transaction_read_only=on:
# nothing is written to the source or to staging. The checks are the canonical A07/A08/A09 package already in S3
# (vtid-05803-acceptance-v1.tgz; URI and sha256 come from the task definition).
# Evidence: the task uploads every output to s3://vitana-code-index/vtid-05803/staging/runs/<RUN>/ and logs to
# /vitana/schema-parity; this role can read neither, so the job artifact records both references plus the ECS stop data.
# Exit contract (job = task): 0 acceptance passed; 1 acceptance failed (staging verification fails, recovery/rework);
# 2 configuration or infrastructure error: run-task refused, no task, task not STOPPED in time, no container exit code,
# evidence upload failed, or any other container exit code. Exit 2 is never reported as acceptance.
# VTID05803_ACCEPTANCE=auto (the schedule): runs the acceptance once per completed staging load. The migration owner reports
# completion by publishing this project's generic package file vtid-05803-staging-load/latest/marker.json
# ({"id":"<unique>","data":"schema-only|full","by":"<agent>","ref":"<MR, pipeline or run>"}). A marker already consumed
# (vtid-05803-acceptance/state/consumed.json, written after a 0 or 1) or no marker = exit 3: nothing to accept, nothing ran
# (allowed to fail, so the pipeline shows a warning, never a pass). An exit 2 does not consume the marker: the next tick retries.
vtid-05803-acceptance-run:
  stage: verify
  needs: []
  # Exit 3 = auto mode with no new staging load reported: nothing ran. Only auto can exit 3; it is never a pass.
  allow_failure:
    exit_codes: [3]
  tags: [vitana-eng-v1]
  image: public.ecr.aws/docker/library/alpine:3.20
  interruptible: false
  retry: 0
  timeout: 90m
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://sts.amazonaws.com
  variables:
    AWS_REGION: eu-central-1
    AWS_DEFAULT_REGION: eu-central-1
    AWS_ROLE_ARN: $AWS_STAGING_ROLE_ARN
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/oidc-token
    CLUSTER: Vitana-ECS-Cluster
    NET_FROM_SERVICE: vitana-postgrest-aurora-proxy
    K5_TD: vitana-aurora-staging-migrate:2
    K5_DATA: schema-only
    K5_PY_SHA256: "7f330051af7f625eb9c1dc4bc627fcbf390e09fad2700522ac3c2fa81b5f5ace"
    K5_PY: ""
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(api|web)$/ && $VTID05803_ACCEPTANCE == "run"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(api|web|schedule)$/ && $VTID05803_ACCEPTANCE == "auto"
  artifacts:
    when: always
    expire_in: 90 days
    paths: [acceptance/]
  script:
    - |
      set -uo pipefail
      mkdir -p acceptance; A=acceptance
      fin() {
        jq -n --argjson rc "$1" --arg r "$2" --arg run "${RUN:-}" --arg td "$K5_TD" --arg task "${TASK:-}" --arg out "${OUT:-}" \
          --arg ec "${EXIT:-}" --arg sr "${STOPPED:-}" --arg sc "${STOPCODE:-}" --arg cr "${CREASON:-}" --arg ls "${LOGSTREAM:-}" \
          --arg commit "$CI_COMMIT_SHA" --arg data "$K5_DATA" --arg marker "${MARKER_ID:-}" --arg mode "${VTID05803_ACCEPTANCE:-}" \
          '{vtid:"VTID-05803",step:"aurora-staging-acceptance",exit_code:$rc,result:(if $rc==0 then "PASS" elif $rc==1 then "FAIL" elif $rc==3 then "NOT_RUN" else "ERROR" end),
            reason:$r,data_mode:$data,run:$run,task_definition:$td,task:$task,container_exit_code:$ec,stop_code:$sc,stopped_reason:$sr,
            container_reason:$cr,evidence_s3:$out,log_group:"/vitana/schema-parity",log_stream:$ls,platform_commit:$commit,trigger:$mode,marker:$marker}' > "$A/result.json"
        if [ "${VTID05803_ACCEPTANCE:-}" = auto ] && [ -n "${MARKER_ID:-}" ] && { [ "$1" = 0 ] || [ "$1" = 1 ]; }; then
          jq -n --arg m "$MARKER_ID" --argjson rc "$1" --arg p "$CI_PIPELINE_URL" --arg run "${RUN:-}" --arg at "$(date -u +%FT%TZ)" \
            '{marker_id:$m,exit_code:$rc,result:(if $rc==0 then "PASS" else "FAIL" end),pipeline:$p,run:$run,at:$at}' > "$A/consumed.json"
          curl -fsS -o /dev/null --upload-file "$A/consumed.json" -H "JOB-TOKEN: $CI_JOB_TOKEN" "$PKG/vtid-05803-acceptance/state/consumed.json" \
            && echo "marker $MARKER_ID consumed" || echo "WARNING: could not record marker $MARKER_ID as consumed; the next tick runs it again"
        fi
        cat "$A/result.json"; echo "ACCEPTANCE RESULT exit=$1 $2"; exit "$1"
      }
      PKG="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic"; MARKER_ID=""
      if [ "${VTID05803_ACCEPTANCE:-}" = auto ]; then
        apk add --no-cache curl jq >/dev/null || fin 2 "tool install failed"
        CODE=$(curl -sS -o "$A/marker.json" -w '%{http_code}' -H "JOB-TOKEN: $CI_JOB_TOKEN" "$PKG/vtid-05803-staging-load/latest/marker.json") || fin 2 "package registry unreachable"
        [ "$CODE" = 404 ] && fin 3 "no staging load reported (vtid-05803-staging-load/latest/marker.json absent): nothing ran"
        [ "$CODE" = 200 ] || fin 2 "marker read returned HTTP $CODE"
        MARKER_ID=$(jq -r '.id // empty' "$A/marker.json"); MDATA=$(jq -r '.data // "schema-only"' "$A/marker.json")
        printf '%s' "$MARKER_ID" | grep -Eq '^[A-Za-z0-9._:-]{1,80}$' || fin 2 "marker id missing or invalid"
        case "$MDATA" in schema-only|full) K5_DATA=$MDATA ;; *) fin 2 "marker data must be schema-only or full" ;; esac
        CODE=$(curl -sS -o "$A/consumed-before.json" -w '%{http_code}' -H "JOB-TOKEN: $CI_JOB_TOKEN" "$PKG/vtid-05803-acceptance/state/consumed.json") || fin 2 "package registry unreachable"
        if [ "$CODE" = 200 ] && [ "$(jq -r '.marker_id // empty' "$A/consumed-before.json")" = "$MARKER_ID" ]; then
          M="$MARKER_ID"; MARKER_ID=""; fin 3 "marker $M already accepted ($(jq -r '.result + " " + .pipeline' "$A/consumed-before.json")): nothing ran"
        fi
        echo "staging load reported: marker $MARKER_ID ($(jq -c '{data,by,ref}' "$A/marker.json")); running the acceptance"
      fi
      apk add --no-cache aws-cli jq xz curl >/dev/null || fin 2 "tool install failed"
      printf '%s' "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
      ACCT=$(aws sts get-caller-identity --query Account --output text) || fin 2 "sts failed"
      [ "$ACCT" = 472838866351 ] || fin 2 "not account 472838866351"
      GOT=$(printf '%s' "$K5_PY" | base64 -d | xz -dc | sha256sum | cut -d' ' -f1)
      [ "$GOT" = "$K5_PY_SHA256" ] || fin 2 "embedded runner sha256 mismatch"
      case "$K5_TD" in vitana-aurora-staging-migrate:[0-9]*) ;; *) fin 2 "K5_TD must be a vitana-aurora-staging-migrate revision" ;; esac
      case "$K5_DATA" in schema-only|full) ;; *) fin 2 "K5_DATA must be schema-only or full" ;; esac
      aws ecs describe-task-definition --task-definition "$K5_TD" --query taskDefinition > "$A/td.json" 2> "$A/td.err" || fin 2 "describe $K5_TD failed"
      CNAME=$(jq -r '.containerDefinitions[0].name' "$A/td.json")
      PGH=$(jq -r '.containerDefinitions[0].environment[]? | select(.name=="PGHOST") | .value' "$A/td.json")
      case "$PGH" in *prod*) fin 2 "task definition PGHOST names production" ;; vitana-aurora-staging.*|vitana-aurora-staging-*) ;; *) fin 2 "task definition PGHOST is not the staging writer" ;; esac
      for s in SOURCE_URI PGUSER PGPASSWORD; do
        jq -e --arg s "$s" '.containerDefinitions[0].secrets[]? | select(.name==$s)' "$A/td.json" >/dev/null || fin 2 "task definition lacks secret $s"
      done
      jq -e '.containerDefinitions[0].environment[]? | select(.name=="ACCEPT_S3_URI")' "$A/td.json" >/dev/null || fin 2 "task definition lacks ACCEPT_S3_URI"
      SVC=$(aws ecs describe-services --cluster "$CLUSTER" --services "$NET_FROM_SERVICE" --query 'services[0]' --output json) || fin 2 "describe $NET_FROM_SERVICE failed"
      case "$(printf '%s' "$SVC" | jq -r .taskDefinition)" in *staging*) ;; *) fin 2 "$NET_FROM_SERVICE does not run a staging task definition" ;; esac
      NET=$(printf '%s' "$SVC" | jq -c '{awsvpcConfiguration: (.networkConfiguration.awsvpcConfiguration | .assignPublicIp = "DISABLED")}')
      RUN=$(date -u +%Y%m%dT%H%M%SZ)-k5-acceptance-$K5_DATA
      OUT=s3://vitana-code-index/vtid-05803/staging/runs/$RUN
      # Container command: decode the runner, check its sha256, run it. Values come from the override environment.
      CMD='["bash","-c","set -u; apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 awscli ca-certificates xz-utils >/dev/null || exit 20; mkdir -p /w; printf %s \"$K5_PY\" | base64 -d | xz -dc > /w/k5.py || exit 21; echo \"$K5_PY_SHA256  /w/k5.py\" | sha256sum -c - >/dev/null || exit 22; exec python3 /w/k5.py"]'
      jq -cn --arg c "$CNAME" --argjson cmd "$CMD" --arg py "$K5_PY" --arg ph "$K5_PY_SHA256" --arg run "$RUN" --arg out "$OUT" \
        --arg data "$K5_DATA" --arg commit "$CI_COMMIT_SHA" \
        '{containerOverrides: [{name: $c, command: $cmd, environment: [{name: "K5_PY", value: $py}, {name: "K5_PY_SHA256", value: $ph},
          {name: "K5_RUN", value: $run}, {name: "K5_OUT", value: $out}, {name: "K5_DATA", value: $data}]}]}' > "$A/overrides.json"
      OVB=$(wc -c < "$A/overrides.json"); echo "override bytes: $OVB (ECS limit 8192)"; [ "$OVB" -lt 8192 ] || fin 2 "override too large ($OVB bytes)"
      echo "run $RUN: $K5_TD container $CNAME, network from $NET_FROM_SERVICE, evidence $OUT/"
      aws ecs run-task --cluster "$CLUSTER" --task-definition "$K5_TD" --launch-type FARGATE --count 1 --network-configuration "$NET" \
        --overrides "file://$A/overrides.json" --started-by "kiro5-acc-$CI_JOB_ID" > "$A/run-task.json" 2> "$A/run-task.err" \
        || fin 2 "run-task refused: $(tr '\n' ' ' < "$A/run-task.err" | cut -c1-400)"
      TASK=$(jq -r '.tasks[0].taskArn // empty' "$A/run-task.json")
      [ -n "$TASK" ] || fin 2 "run-task started no task: $(jq -c .failures "$A/run-task.json")"
      LOGSTREAM="staging-migrate/$CNAME/${TASK##*/}"
      echo "task $TASK, log /vitana/schema-parity $LOGSTREAM"
      for i in $(seq 1 160); do
        ST=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].lastStatus' --output text 2>/dev/null || echo UNKNOWN)
        [ "$ST" = STOPPED ] && break
        [ $((i % 4)) -eq 0 ] && echo "  $(date -u +%H:%M:%S) $ST"
        sleep 30
      done
      aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" > "$A/describe-task.json" 2>/dev/null || fin 2 "describe-tasks failed"
      ST=$(jq -r '.tasks[0].lastStatus' "$A/describe-task.json")
      STOPPED=$(jq -r '.tasks[0].stoppedReason // ""' "$A/describe-task.json")
      STOPCODE=$(jq -r '.tasks[0].stopCode // ""' "$A/describe-task.json")
      EXIT=$(jq -r '.tasks[0].containers[0].exitCode // ""' "$A/describe-task.json")
      CREASON=$(jq -r '.tasks[0].containers[0].reason // ""' "$A/describe-task.json")
      echo "lastStatus=$ST stopCode=$STOPCODE exitCode=${EXIT:-none} stoppedReason=$STOPPED containerReason=$CREASON"
      [ "$ST" = STOPPED ] || fin 2 "task did not reach STOPPED within 80 minutes (lastStatus=$ST)"
      case "$EXIT" in
        0) fin 0 "acceptance passed; evidence $OUT/" ;;
        111|112|113|114|115|116|117) fin 1 "acceptance failed (code $EXIT) and the evidence upload also failed" ;;
        1|11|12|13|14|15|16|17) F=""; [ "$EXIT" -ge 11 ] && { M=$((EXIT - 10)); [ $((M % 2)) -eq 1 ] && F="$F A07"; [ $((M / 2 % 2)) -eq 1 ] && F="$F A08"; [ $((M / 4)) -eq 1 ] && F="$F A09"; }
           fin 1 "acceptance failed: unexplained differences in${F:- (suites not reported)}; evidence $OUT/" ;;
        "") fin 2 "no container exit code (stopCode=$STOPCODE: $STOPPED $CREASON)" ;;
        20) fin 2 "container setup: apt-get failed (task egress or mirror)" ;;
        21|22) fin 2 "container setup: runner payload decode or sha256 failed" ;;
        30) fin 2 "SOURCE_URI secret missing or unparsable" ;;
        31) fin 2 "SOURCE_URI does not point at the Supabase project" ;;
        32) fin 2 "source not reachable over TCP" ;;
        33) fin 2 "PGHOST is not vitana-aurora-staging" ;;
        40|41|42|43|44|46|47|48|49) fin 2 "source connection error $EXIT (41 auth, 42 network, 43 ssl, 44 database, 46 not read-only; 47/48/49 = auth/network/ssl via the session-pooler fallback); evidence $OUT/" ;;
        50|51|52|53|54|56) fin 2 "staging connection error $EXIT (51 auth, 52 network, 53 ssl, 54 database, 56 not read-only); evidence $OUT/" ;;
        60) fin 2 "acceptance package download or checksum failed" ;;
        61|62) fin 2 "A07/A08 catalog capture failed on $( [ "$EXIT" = 61 ] && echo source || echo staging ); evidence $OUT/" ;;
        70) fin 2 "A09 did not complete; evidence $OUT/" ;;
        80) fin 2 "acceptance passed but evidence upload failed: not accepted" ;;
        *) fin 2 "configuration or infrastructure error (container exit $EXIT); evidence $OUT/" ;;
      esac
