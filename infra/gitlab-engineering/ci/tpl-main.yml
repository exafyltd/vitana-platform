# VTID-05550 — T2 main delivery (plan agentic-delivery §3.6; lane pipelines). Hidden jobs only.
# Every landing on main runs every check of the repository once (full-suite:<check>, main class, never interrupted, so a
# red main is always tied to one landing) in parallel with the image build and the staging deploy. The orchestration
# per changed deployable service is in the generated file:
#   build-image:<svc> (.build-image, main) → push-image:<svc> (.push-image, deploy) → deploy-staging:<svc>
#   (.deploy-staging, deploy; the service's env_overrides only in live mode) → rollback-staging:<svc> (on failure)
#   → staging-verify:<svc> (.staging-verify, main) → record:<svc> (.record, deploy, live mode only)
#   vtid-close (.vtid-close, live mode only) and, for vitana-v1, notify-platform (.notify-platform, live mode only).
# The .build-image … .rollback-staging, .preview-upload and .preview-stop jobs are lane deploy-path's (tpl-deploy.yml);
# .staging-verify, .staging-verify-nightly, .record, .vtid-close and .notify-platform are lane verify-on-gitlab's
# (tpl-verify.yml). The generated jobs pass them DEPLOY_* and VERIFY_SERVICE variables; tpl-verify reads the deploy-runs
# file from $CI_PROJECT_DIR/deploy-runs.json (DEPLOY_RUNS_FILE), which deploy-staging leaves as an artifact.
# Shadow mode (DELIVERY_MODE unset or not "live", the default of the generated file): record, vtid-close,
# notify-platform and every assist job are not created, no env_overrides are passed, and the deploy templates only
# render (plan §3.6 step 8). The settings sync sets the project variable DELIVERY_MODE=live at the cut (plan §8.2).

.full-suite:
  image: public.ecr.aws/docker/library/node:20-bookworm
  tags: [vitana-eng-main]
  interruptible: false
  timeout: 30m
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]
  variables:
    CI: "true"
    npm_config_cache: $CI_PROJECT_DIR/.npm
    npm_config_store_dir: $CI_PROJECT_DIR/.pnpm-store

# E2E-PREVIEW-ORB (vitana-v1, plan §2.2 T4): the signed-in ORB conversation flow against the preview host
# (tests/e2e/orb-preview.mjs), by hand only, as its workflow_dispatch today. It signs in as the test user, so it runs on
# the main class with a per-job ID token for the read-only test-user secret (plan §3.2; the role and secret lane
# verify-on-gitlab's .staging-verify reads), never on the untrusted class, and only in live mode (generated rules).
.e2e-preview-orb:
  extends: .full-suite
  timeout: 15m
  id_tokens:
    VERIFY_ID_TOKEN:
      aud: aws:verify
  variables:
    CENTRAL_DIR: /tmp/vitana-central
    SECRETS_DIR: /tmp/vitana-secrets
    GL_VERIFY_ROLE_ARN: arn:aws:iam::472838866351:role/gl-verify
    AWS_REGION: eu-central-1
    PREVIEW_URL: https://preview.vitanaland.com
  before_script:
    - rm -rf "$CENTRAL_DIR" "$SECRETS_DIR" && mkdir -p "$SECRETS_DIR"
    - git clone --quiet --depth 1 --branch main --filter=blob:none --sparse "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/vitana/vitana-platform.git" "$CENTRAL_DIR"
    - git -C "$CENTRAL_DIR" sparse-checkout set --no-cone /scripts/eng/verify/
  script:
    - node "$CENTRAL_DIR/scripts/eng/verify/aws-secret.mjs" --token-env VERIFY_ID_TOKEN --role-arn "$GL_VERIFY_ROLE_ARN" --secret-id vitana/ci/test-user --out "$SECRETS_DIR/test-user.json"
    - 'export E2E_EMAIL="$(node -p "require(process.env.SECRETS_DIR + \"/test-user.json\").TEST_USER_EMAIL")"'
    - 'export E2E_PASSWORD="$(node -p "require(process.env.SECRETS_DIR + \"/test-user.json\").TEST_USER_PASSWORD")"'
    - npm install --no-save --no-audit --no-fund @playwright/test@1.51.0
    - npx playwright install --with-deps chromium
    - node tests/e2e/orb-preview.mjs
  artifacts:
    when: always
    expire_in: 14 days
    paths: [tests/e2e/screenshots/]
