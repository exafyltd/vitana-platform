# VTID-05550 — T7 assist jobs (plan agentic-delivery §3.9; lane pipelines). Hidden jobs only.
# Some jobs must write to a branch: I18N-PROPAGATE fills every language when the German source changes. They need the
# LLM keys, so they never run on the untrusted class. The rule:
#   - The merge bot (lane merge-queue, assist-trigger.mjs) creates the protected ref assist/<iid>-<rule> at main and
#     starts a pipeline on it with ASSIST_RULE, ASSIST_MR_IID, ASSIST_MR_HEAD and ASSIST_SOURCE_BRANCH, once per head
#     and rule, and only before the review accept.
#   - The job runs the tool from main and reads the merge request's files only as data (catalog JSON, never its code):
#     a worktree of the merge request head, with main's scripts/ laid over it; only the data paths are committed.
#   - It pushes the result as one commit to the branch as bot-assist (ASSIST_PUSH_TOKEN: a protected, masked CI
#     variable the settings sync rotates). A branch whose home is GitHub (bridged, plan §3.13) gets the commit through
#     lane github-bridge: the job leaves it as the artifact assist-out/assist.patch and pushes nothing.
#   - LLM keys come from Secrets Manager (vitana/ci/llm-keys, JSON keyed by the GitHub secret names) through role
#     gl-assist (ID token audience aws:assist); providers stay as the workflows use them today.
#   - Shadow mode: no assist job is created (plan §3.6 step 8); the script refuses as well.
# The scheduled safety net (i18n-nightly, 04:00 UTC like I18N-PROPAGATE's schedule) runs on main and opens a merge
# request from bot-assist/nightly-<rule>-<date> (assist/* is protected; bot-assist is a Developer) instead.

.schedules-assist:
  i18n-nightly:
    description: "T7 assist safety net: propagate what reached main without it (I18N-PROPAGATE schedule)"
    cron: "0 4 * * *"
    cron_timezone: UTC
    ref: main
    variables:
      DELIVERY_SCHEDULE: i18n-nightly

.assist:
  image: public.ecr.aws/docker/library/node:20-bookworm
  tags: [vitana-eng-main]
  interruptible: false
  timeout: 45m
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]
  id_tokens:
    ASSIST_ID_TOKEN:
      aud: aws:assist
  variables:
    GIT_DEPTH: "0"
    CENTRAL_DIR: /tmp/vitana-central
    SECRETS_DIR: /tmp/vitana-secrets
    ASSIST_WORKTREE: /tmp/vitana-assist
    ASSIST_DATA_PATHS: src/i18n i18n-source-stamps
    I18N_PROVIDER: deepseek
    GL_ASSIST_ROLE_ARN: arn:aws:iam::472838866351:role/gl-assist
  before_script:
    - '[ "$DELIVERY_MODE" = "live" ] || { echo "DELIVERY_MODE is not live (shadow mode): assist jobs do not run (plan agentic-delivery §3.6 step 8)"; exit 3; }'
    - rm -rf "$CENTRAL_DIR" "$SECRETS_DIR" "$ASSIST_WORKTREE" && mkdir -p "$SECRETS_DIR" assist-out
    - git clone --quiet --depth 1 --branch main --filter=blob:none --sparse "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/vitana/vitana-platform.git" "$CENTRAL_DIR"
    - git -C "$CENTRAL_DIR" sparse-checkout set --no-cone /scripts/eng/verify/
    - node "$CENTRAL_DIR/scripts/eng/verify/aws-secret.mjs" --token-env ASSIST_ID_TOKEN --role-arn "$GL_ASSIST_ROLE_ARN" --secret-id vitana/ci/llm-keys --out "$SECRETS_DIR/llm-keys.json"
    - eval "$(node -e 'const k=require(process.argv[1]);for(const [n,v] of Object.entries(k))if(/^[A-Z][A-Z0-9_]*$/.test(n))console.log(`export ${n}=${JSON.stringify(String(v))}`)' "$SECRETS_DIR/llm-keys.json")"
    - 'if [ "$ASSIST_KIND" = "merge_request" ]; then git fetch --quiet origin "refs/merge-requests/${ASSIST_MR_IID}/head" && [ "$(git rev-parse FETCH_HEAD)" = "$ASSIST_MR_HEAD" ] || { echo "merge request !${ASSIST_MR_IID} head moved from ${ASSIST_MR_HEAD}: nothing to do for this head"; exit 0; }; git worktree add --quiet --detach "$ASSIST_WORKTREE" FETCH_HEAD; else git worktree add --quiet -b "bot-assist/nightly-${ASSIST_RULE}-$(date -u +%Y%m%d)" "$ASSIST_WORKTREE" HEAD; fi'
    - rm -rf "$ASSIST_WORKTREE/scripts" && cp -R "$CI_PROJECT_DIR/scripts" "$ASSIST_WORKTREE/scripts" && cd "$ASSIST_WORKTREE"
    - 'assist_finish() { git -C "$ASSIST_WORKTREE" checkout --quiet -- scripts 2>/dev/null || true; git -C "$ASSIST_WORKTREE" add -- $ASSIST_DATA_PATHS; if git -C "$ASSIST_WORKTREE" diff --cached --quiet; then echo "assist ${ASSIST_RULE}: nothing to change"; return 0; fi; GIT_AUTHOR_NAME=bot-assist GIT_COMMITTER_NAME=bot-assist GIT_AUTHOR_EMAIL=bot-assist@gitlab.vitanaland.com GIT_COMMITTER_EMAIL=bot-assist@gitlab.vitanaland.com git -C "$ASSIST_WORKTREE" commit --quiet -m "assist(${ASSIST_RULE}): $1" -m "Assist-Rule: ${ASSIST_RULE}" -m "Assist-Head: ${ASSIST_MR_HEAD:-$CI_COMMIT_SHA}"; git -C "$ASSIST_WORKTREE" format-patch -1 --stdout > "$CI_PROJECT_DIR/assist-out/assist.patch"; if [ "$ASSIST_KIND" = "merge_request" ] && [ "$ASSIST_BRANCH_HOME" = "github" ]; then echo "bridged branch: lane github-bridge applies assist-out/assist.patch"; return 0; fi; if [ "$ASSIST_KIND" = "merge_request" ]; then git -C "$ASSIST_WORKTREE" push --quiet "https://bot-assist:${ASSIST_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/${ASSIST_SOURCE_BRANCH}"; else B=$(git -C "$ASSIST_WORKTREE" branch --show-current); git -C "$ASSIST_WORKTREE" push --quiet -o merge_request.create -o merge_request.target=main -o "merge_request.title=assist(${ASSIST_RULE}): $1" "https://bot-assist:${ASSIST_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/$B"; fi; }'
  artifacts:
    when: always
    expire_in: 7 days
    paths: [assist-out/]
