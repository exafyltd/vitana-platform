cicdl-lint-services:
  extends: ".check"
  stage: "checks"
  variables:
    DELIVERY_CHECK: "cicdl-lint-services"
  script:
    - "apt-get update -qq && apt-get install -y -qq --no-install-recommends jq >/dev/null"
    - "echo \"🔍 Validating services directory structure...\"\n\nviolations=0\n\nif [ ! -d \"services\" ]; then\n  echo \"❌ ERROR: /services directory not found\"\n  exit 1\nfi\n\necho \"✅ /services directory exists\"\necho \"\"\n\necho \"📋 Found services:\"\nfind services -mindepth 1 -maxdepth 3 -type d | sort\necho \"\""
    - "echo \"🔍 Checking for manifest.json in each service...\"\necho \"\"\n\nviolations=0\nservices_checked=0\n\n# Check agents - look for manifest.json at the direct agent level\nfor agent_dir in services/agents/*/; do\n  if [ -d \"$agent_dir\" ]; then\n    services_checked=$((services_checked + 1))\n    agent_name=$(basename \"$agent_dir\")\n\n    if [ -f \"${agent_dir}manifest.json\" ]; then\n      echo \"✅ ${agent_dir}\"\n    else\n      echo \"❌ Missing: ${agent_dir}manifest.json\"\n      violations=$((violations + 1))\n    fi\n  fi\ndone\n\n# Check MCP services\nfor mcp_dir in services/mcp/*/; do\n  if [ -d \"$mcp_dir\" ]; then\n    services_checked=$((services_checked + 1))\n\n    if [ -f \"${mcp_dir}manifest.json\" ]; then\n      echo \"✅ $mcp_dir\"\n    else\n      echo \"❌ Missing: ${mcp_dir}manifest.json\"\n      violations=$((violations + 1))\n    fi\n  fi\ndone\n\n# Check gateway\nif [ -d \"services/gateway\" ]; then\n  services_checked=$((services_checked + 1))\n\n  if [ -f \"services/gateway/manifest.json\" ]; then\n    echo \"✅ services/gateway/\"\n  else\n    echo \"❌ Missing: services/gateway/manifest.json\"\n    violations=$((violations + 1))\n  fi\nfi\n\n# Check deploy-watcher\nif [ -d \"services/deploy-watcher\" ]; then\n  services_checked=$((services_checked + 1))\n\n  if [ -f \"services/deploy-watcher/manifest.json\" ]; then\n    echo \"✅ services/deploy-watcher/\"\n  else\n    echo \"❌ Missing: services/deploy-watcher/manifest.json\"\n    violations=$((violations + 1))\n  fi\nfi\n\necho \"\"\necho \"Services checked: $services_checked\"\necho \"Violations: $violations\"\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"❌ FAILURE: $violations service(s) missing manifest.json\"\n  exit 1\nfi\n\necho \"✅ All services have manifest.json files\""
    - "echo \"🔍 Validating manifest.json schema...\"\necho \"\"\n\nviolations=0\nmanifests=$(find services -maxdepth 3 -name \"manifest.json\" -type f)\n\nif [ -z \"$manifests\" ]; then\n  echo \"⚠️  No manifest.json files found\"\n  exit 0\nfi\n\nfor manifest in $manifests; do\n  echo \"Checking: $manifest\"\n\n  if ! jq empty \"$manifest\" 2>/dev/null; then\n    echo \"  ❌ Invalid JSON syntax\"\n    violations=$((violations + 1))\n    continue\n  fi\n\n  # Check for required fields - support both old and new schema\n  name=$(jq -r '.name // empty' \"$manifest\")\n  vtid=$(jq -r '.vtid // empty' \"$manifest\")\n  vt_layer=$(jq -r '.vt_layer // .layer // empty' \"$manifest\")\n  vt_module=$(jq -r '.vt_module // .module // empty' \"$manifest\")\n\n  if [ -z \"$name\" ]; then\n    echo \"  ❌ Missing required field: name\"\n    violations=$((violations + 1))\n  fi\n\n  # Either vtid or both vt_layer/vt_module required\n  if [ -z \"$vtid\" ] && ([ -z \"$vt_layer\" ] || [ -z \"$vt_module\" ]); then\n    echo \"  ⚠️  Warning: Missing vtid or vt_layer/vt_module\"\n  fi\n\n  if [ $violations -eq 0 ]; then\n    echo \"  ✅ Valid: $name\"\n  fi\ndone\n\necho \"\"\n\nif [ $violations -gt 0 ]; then\n  echo \"❌ FAILURE: $violations manifest validation error(s)\"\n  exit 1\nfi\n\necho \"✅ All manifests are valid\""
    - "echo \"🔍 Checking top-level service naming conventions...\"\necho \"\"\n\nviolations=0\n\n# Only check top-level service directories (maxdepth 2)\n# Internal subdirectories can follow language conventions (e.g., Python snake_case)\nwhile IFS= read -r dir; do\n  dirname=$(basename \"$dir\")\n\n  # Skip hidden directories and node_modules\n  if [[ \"$dirname\" == .* ]] || [[ \"$dirname\" == \"node_modules\" ]]; then\n    continue\n  fi\n\n  # Check for uppercase or underscore\n  if echo \"$dirname\" | grep -qE '[A-Z]|_'; then\n    echo \"❌ Non-kebab-case directory: $dir\"\n    echo \"   Top-level service directories must use kebab-case\"\n    violations=$((violations + 1))\n  fi\ndone < <(find services -mindepth 1 -maxdepth 2 -type d -not -path \"*/node_modules/*\")\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"❌ FAILURE: $violations naming convention violation(s)\"\n  echo \"\"\n  echo \"📘 Phase 2B Standard: Top-level service directories must use kebab-case\"\n  echo \"   Internal subdirectories may follow language conventions\"\n  exit 1\nfi\n\necho \"✅ All top-level service directories follow kebab-case convention\""
    - "echo \"✅ Services Lint Checks Complete\"\necho \"\"\necho \"Checks passed:\"\necho \"  ✅ Services directory structure valid\"\necho \"  ✅ All services have manifest.json\"\necho \"  ✅ All manifests have valid schema\"\necho \"  ✅ Naming conventions followed\""
  rules:
