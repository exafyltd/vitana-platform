    DELIVERY_CHECK: "phase-2b-naming"
  script:
    - "echo \"🔍 Checking GitHub Actions workflow naming...\"\nviolations=0\n\nfor file in .github/workflows/*.yml .github/workflows/*.yaml; do\n  [ -f \"$file\" ] || continue\n\n  filename=$(basename \"$file\")\n  # Skip this file and reusable workflows\n  if [[ \"$filename\" == \"PHASE-2B-NAMING-ENFORCEMENT.yml\" ]] || \\\n     [[ \"$filename\" == _* ]]; then\n    continue\n  fi\n\n  # Check if filename contains lowercase letters (excluding extension)\n  basename_no_ext=\"${filename%.*}\"\n  if echo \"$basename_no_ext\" | grep -q '[a-z]'; then\n    echo \"❌ VIOLATION: $file\"\n    echo \"   Expected: UPPERCASE-WITH-HYPHENS.yml\"\n    echo \"   Example: DEPLOY-GATEWAY.yml, RUN-TESTS.yml\"\n    violations=$((violations + 1))\n  else\n    echo \"✅ $file\"\n  fi\ndone\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"❌ Found $violations workflow naming violations\"\n  echo \"📘 Phase 2B Standard: All workflow files must use UPPERCASE names\"\n  exit 1\nfi\n\necho \"✅ All workflows follow UPPERCASE naming standard\""
    - "echo \"🔍 Checking workflows include run-name with VTID...\"\nviolations=0\n\nfor file in .github/workflows/*.yml .github/workflows/*.yaml; do\n  [ -f \"$file\" ] || continue\n\n  filename=$(basename \"$file\")\n  # Skip reusable workflows and this file\n  if [[ \"$filename\" == _* ]] || \\\n     [[ \"$filename\" == \"PHASE-2B-NAMING-ENFORCEMENT.yml\" ]]; then\n    continue\n  fi\n\n  # Check if workflow has run-name\n  if ! grep -q \"^run-name:\" \"$file\"; then\n    echo \"⚠️  WARNING: $file missing run-name field\"\n    violations=$((violations + 1))\n  else\n    # Check if run-name references VTID or branch\n    if ! grep -A 1 \"^run-name:\" \"$file\" | grep -qi \"vtid\\|github.ref\"; then\n      echo \"⚠️  WARNING: $file run-name doesn't include VTID reference\"\n      violations=$((violations + 1))\n    else\n      echo \"✅ $file\"\n    fi\n  fi\ndone\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"⚠️  Found $violations workflows without VTID in run-name\"\n  echo \"📘 Recommended: Add run-name with VTID for tracking\"\n  echo \"Example:\"\n  echo \"  run-name: 'Deploy Gateway [VTID: DEV-CICDL-0031] (\\<ref>)'\"\n  # Warning only, not failing\nfi"
    - "echo \"🔍 Checking file naming convention (kebab-case)...\"\nviolations=0\n\n# Check TypeScript/JavaScript files\nwhile IFS= read -r file; do\n  filename=$(basename \"$file\")\n  dirname=$(dirname \"$file\")\n\n  # Skip node_modules, .git, temp_* directories, etc\n  if echo \"$file\" | grep -qE \"node_modules|\\.git|\\.next|dist|build|/temp_\"; then\n    continue\n  fi\n\n  # Check for camelCase or snake_case (should be kebab-case)\n  basename_no_ext=\"${filename%.*}\"\n  if echo \"$basename_no_ext\" | grep -qE \"[A-Z]|_\"; then\n    # Allow certain exceptions\n    if [[ \"$filename\" =~ ^(README|LICENSE|CHANGELOG|Dockerfile|Makefile)\\.? ]]; then\n      continue\n    fi\n\n    echo \"❌ VIOLATION: $file\"\n    echo \"   Contains uppercase or underscores\"\n    echo \"   Expected: kebab-case (e.g., my-service.ts)\"\n    violations=$((violations + 1))\n  fi\ndone < <(find . -type f \\( -name \"*.ts\" -o -name \"*.js\" -o -name \"*.tsx\" -o -name \"*.jsx\" \\) -not -path \"*/node_modules/*\" -not -path \"*/.git/*\")\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"❌ Found $violations file naming violations\"\n  echo \"📘 Phase 2B Standard: Use kebab-case for all code files\"\n  exit 1\nfi\n\necho \"✅ All files follow kebab-case naming standard\""
    - "echo \"🔍 Checking VTID format in code...\"\nviolations=0\n\n# Check for VTID constants that aren't UPPERCASE\nwhile IFS= read -r file; do\n  # Look for VTID assignments with lowercase\n  if grep -nE \"vtid\\s*[:=]\\s*['\\\"]\" \"$file\"; then\n    echo \"❌ VIOLATION: $file\"\n    echo \"   VTID constants should be UPPERCASE\"\n    echo \"   Use: const VTID = 'DEV-CICDL-0031'\"\n    echo \"   Not: const vtid = 'DEV-CICDL-0031'\"\n    violations=$((violations + 1))\n  fi\ndone < <(find services packages -type f \\( -name \"*.ts\" -o -name \"*.js\" \\) -not -path \"*/node_modules/*\" 2>/dev/null || true)\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"⚠️  Found $violations VTID format warnings\"\n  echo \"📘 Recommended: Use UPPERCASE for VTID constants\"\n  # Warning only\nfi"
    - "echo \"🔍 Checking PR description for Phase 2B checklist...\"\n\n# This would require GitHub API access to check PR body\n# For now, we'll just log a reminder\necho \"⚡ Reminder: Ensure PR description includes Phase 2B compliance checklist\"\necho \"   The PR template should be filled out completely\""
    - "echo \"✅ Phase 2B Naming Standards Verification Complete\"\necho \"\"\necho \"Checks passed:\"\necho \"  ✅ Workflow naming (UPPERCASE)\"\necho \"  ✅ File naming (kebab-case)\"\necho \"  ✅ VTID format compliance\"\necho \"\"\necho \"Ready for review and merge!\""
