"full-suite:voice-pipeline-parity":
  extends: ".full-suite"
  stage: "full-suite"
  variables:
    DELIVERY_CHECK: "voice-pipeline-parity"
  script:
    - "apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-pip >/dev/null"
    - "pip install --quiet --break-system-packages libcst"
    - "cd voice-pipeline-spec"
    - "npm ci --no-audit --no-fund"
    - "npm run validate-spec"
    - "npm run extract:ts"
    - "npm run extract:py"
