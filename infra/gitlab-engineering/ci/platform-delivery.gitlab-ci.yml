    key:
      files:
        - "services/gateway/package-lock.json"
      prefix: "aurora-i18n-integration"
    paths:
      - ".npm"
    policy: "pull-push"
  script:
    - "cd services/gateway"
    - "npm ci --no-audit --no-fund --prefer-offline"
