"full-suite:validator-check":
  extends: ".full-suite"
  stage: "full-suite"
  variables:
    DELIVERY_CHECK: "validator-check"
    GIT_DEPTH: "0"
  cache:
    key:
      files:
        - "services/gateway/package-lock.json"
      prefix: "validator-check"
    paths:
      - ".npm"
    policy: "pull-push"
  script:
    - "test -f gov/validator-rules.yaml || { echo \"REJECTED: missing gov/validator-rules.yaml\"; exit 2; }"
    - "if [ \"$CI_PIPELINE_SOURCE\" != \"merge_request_event\" ]; then echo \"validator-check: $CI_PIPELINE_SOURCE pipeline on $CI_COMMIT_REF_NAME has no merge request title or description, so the gates that read them are skipped here (body declarations, VTID and profile, changed files, path ownership, evidence pack, acceptance mapping, route mount, OASIS, merge deploy): VALIDATOR-CHECK runs them on pull requests only, and they ran on the merge request pipeline of every landed change. The CSP and build gates run.\"; fi"
    - "VC_TARGET=\"${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}\"; git fetch --quiet origin \"+refs/heads/$VC_TARGET:refs/remotes/origin/$VC_TARGET\""
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then if [ \"${CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED:-false}\" = \"true\" ]; then echo \"REJECTED: the merge request description is longer than the 2700 characters GitLab passes to CI (CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED), so its declarations cannot be read: shorten it\"; exit 2; fi; printf \"%s\" \"${CI_MERGE_REQUEST_TITLE:-}\" > /tmp/pr_title.txt; printf \"%s\" \"${CI_MERGE_REQUEST_DESCRIPTION:-}\" > /tmp/pr_body.txt; test -s /tmp/pr_title.txt || { echo \"REJECTED: empty PR title\"; exit 2; }; test -s /tmp/pr_body.txt || { echo \"REJECTED: empty PR body\"; exit 2; }; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then node scripts/ci/validator-path-guard.cjs --pr-body-check /tmp/pr_body.txt; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then VC_VTID=\"$(grep -Eo 'VTID-[0-9]{4,5}' /tmp/pr_title.txt | head -n 1 || true)\"; if [ -z \"$VC_VTID\" ]; then VC_VTID=\"$(grep -Eo '^[[:space:]]*VTID:[[:space:]]*VTID-[0-9]{4,5}' /tmp/pr_body.txt | grep -Eo 'VTID-[0-9]{4,5}' | head -n 1 || true)\"; fi; test -n \"$VC_VTID\" || { echo \"REJECTED: no VTID in the title, and no explicit 'VTID: VTID-XXXXX' line in the body\"; exit 10; }; VC_PROFILE=\"$(grep -Eo 'VALIDATION_PROFILE:\\s*[a-zA-Z0-9_/-]+' /tmp/pr_body.txt | head -n 1 | awk '{print $2}' || true)\"; test -n \"$VC_PROFILE\" || { echo \"REJECTED: VALIDATION_PROFILE missing in PR body\"; exit 11; }; echo \"Detected VTID=$VC_VTID PROFILE=$VC_PROFILE\"; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then git diff --name-only \"origin/$VC_TARGET\"...HEAD > /tmp/changed_files.txt; COUNT=\"$(wc -l < /tmp/changed_files.txt | tr -d ' ')\"; echo \"Changed files: $COUNT\"; test \"$COUNT\" -gt 0 || { echo \"REJECTED: no changes detected\"; exit 16; }; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then node scripts/ci/validator-path-guard.cjs /tmp/changed_files.txt \"$VC_PROFILE\" /tmp/pr_body.txt; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then EVID=\"docs/validation/$VC_VTID\"; test -d \"$EVID\" || { echo \"REJECTED: missing evidence dir $EVID\"; exit 30; }; test -f \"$EVID/acceptance.md\" || { echo \"REJECTED: missing $EVID/acceptance.md\"; exit 31; }; test -f \"$EVID/commands.log\" || { echo \"REJECTED: missing $EVID/commands.log\"; exit 32; }; test -d \"$EVID/outputs\" || { echo \"REJECTED: missing $EVID/outputs/\"; exit 33; }; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then A=\"docs/validation/$VC_VTID/acceptance.md\"; grep -qE '^AC-' \"$A\" || { echo \"REJECTED: acceptance.md has no AC- entries\"; exit 40; }; VTID=\"$VC_VTID\" python3 - << 'PY'\nimport re, sys, os\npath=os.path.expandvars(\"docs/validation/${VTID}/acceptance.md\")\ntxt=open(path,encoding=\"utf-8\").read().splitlines()\nac_idx=[i for i,l in enumerate(txt) if re.match(r'^AC-\\d+', l.strip())]\nif not ac_idx:\n  print(\"REJECTED: no AC- entries\"); sys.exit(40)\nfor i in ac_idx:\n  window=txt[i+1:i+13]\n  if not any(re.match(r'^(TEST:|CURL:|UI:)', w.strip()) for w in window):\n    print(f\"REJECTED: AC at line {i+1} has no TEST:/CURL:/UI: mapping within 12 lines\")\n    sys.exit(41)\nprint(\"Acceptance mapping OK\")\nPY\nfi"
    - "DIFF_BASE=\"origin/$VC_TARGET\"; REVERTED_SHA=\"$(git log \"origin/$VC_TARGET\"..HEAD | grep -oE 'This reverts commit [0-9a-f]{40}' | head -n1 | awk '{print $4}' || true)\"; if [ -n \"$REVERTED_SHA\" ] && git rev-parse -q --verify \"${REVERTED_SHA}^{commit}\" >/dev/null && git merge-base --is-ancestor \"$REVERTED_SHA\" \"origin/$VC_TARGET\"; then DIFF_BASE=\"${REVERTED_SHA}^\"; echo \"Detected a corruption-recovery revert of $REVERTED_SHA (a real commit on origin/$VC_TARGET); comparing CSP surface against $DIFF_BASE instead of origin/$VC_TARGET.\"; fi; git diff \"$DIFF_BASE\"...HEAD -- 'services/gateway/src/frontend/' 'services/gateway/dist/frontend/' > /tmp/csp_diff.txt || true; node scripts/ci/validator-path-guard.cjs --csp-added-lines /tmp/csp_diff.txt || exit 50"
    - "(cd services/gateway && npm ci --no-audit --no-fund --prefer-offline && npm run build)"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then if [ \"$VC_PROFILE\" = \"command_hub_frontend\" ]; then SRC_CHANGED=\"$(grep -c '^services/gateway/src/frontend/command-hub/' /tmp/changed_files.txt || true)\"; DIST_CHANGED=\"$(grep -c '^services/gateway/dist/frontend/command-hub/' /tmp/changed_files.txt || true)\"; if [ \"$SRC_CHANGED\" -eq 0 ] || [ \"$DIST_CHANGED\" -eq 0 ]; then echo \"REJECTED: command_hub_frontend requires src+dist both updated\"; exit 60; fi; fi; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then git diff \"origin/$VC_TARGET\"...HEAD -- 'services/gateway/src/routes/' 'services/gateway/src/index.ts' 'services/gateway/src/app.ts' > /tmp/route_diff.txt || true; if node scripts/ci/validator-path-guard.cjs --route-evidence-required /tmp/route_diff.txt; then A=\"docs/validation/$VC_VTID/acceptance.md\"; grep -q \"ROUTE_MOUNT:\" \"$A\" || { echo \"REJECTED: missing ROUTE_MOUNT:\"; exit 70; }; grep -q \"FINAL_URL:\" \"$A\" || { echo \"REJECTED: missing FINAL_URL:\"; exit 71; }; grep -q \"CURL_PROOF:\" \"$A\" || { echo \"REJECTED: missing CURL_PROOF:\"; exit 72; }; fi; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then IMPACT=\"$(grep -Eo 'OASIS_IMPACT:\\s*(yes|no)' /tmp/pr_body.txt | head -n 1 | awk '{print $2}' || true)\"; test -n \"$IMPACT\" || { echo \"REJECTED: invalid OASIS_IMPACT value\"; exit 80; }; if [ \"$IMPACT\" = \"yes\" ]; then grep -q \"OASIS_PROOF:\" \"docs/validation/$VC_VTID/acceptance.md\" || { echo \"REJECTED: missing OASIS_PROOF:\"; exit 81; }; fi; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then grep -q \"$VC_VTID\" /tmp/pr_title.txt || { echo \"REJECTED: PR title must contain VTID for autodeploy gate\"; exit 90; }; grep -q \"MERGE_PAYLOAD_PREVIEW:\" /tmp/pr_body.txt || { echo \"REJECTED: missing MERGE_PAYLOAD_PREVIEW:\"; exit 91; }; fi"
    - "if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then echo \"APPROVED\"; echo \"VTID=$VC_VTID\"; echo \"PROFILE=$VC_PROFILE\"; echo \"Evidence=docs/validation/$VC_VTID/\"; fi"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"push\" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"schedule\" && $DELIVERY_SCHEDULE == \"nightly\""

