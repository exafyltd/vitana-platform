    GIT_DEPTH: "0"
  script:
    - "IMPACT_SCAN_DRY_RUN=false; if [ \"$CI_PIPELINE_SOURCE\" = \"merge_request_event\" ]; then IMPACT_SCAN_BASE=\"origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME\"; git fetch --quiet origin \"+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME\"; elif [ -n \"${CI_COMMIT_BRANCH:-}\" ] && [ \"${CI_COMMIT_BRANCH#train/}\" != \"$CI_COMMIT_BRANCH\" ]; then IMPACT_SCAN_BASE=\"origin/main\"; git fetch --quiet origin \"+refs/heads/main:refs/remotes/origin/main\"; elif [ \"$CI_PIPELINE_SOURCE\" = \"push\" ] && [ -n \"${CI_COMMIT_BEFORE_SHA:-}\" ] && [ \"$CI_COMMIT_BEFORE_SHA\" != \"0000000000000000000000000000000000000000\" ]; then IMPACT_SCAN_BASE=\"$CI_COMMIT_BEFORE_SHA\"; IMPACT_SCAN_DRY_RUN=true; else IMPACT_SCAN_BASE=\"HEAD\"; IMPACT_SCAN_DRY_RUN=true; echo \"dev-autopilot-impact: $CI_PIPELINE_SOURCE pipeline without a landing: nothing to compare\"; fi; export IMPACT_SCAN_BASE IMPACT_SCAN_DRY_RUN; echo \"impact scan: base $IMPACT_SCAN_BASE, dry run $IMPACT_SCAN_DRY_RUN (blockers fail merge request and train pipelines only, as on GitHub)\""
    - "git rev-parse --verify --quiet \"$IMPACT_SCAN_BASE^{commit}\" >/dev/null || { echo \"dev-autopilot-impact: base $IMPACT_SCAN_BASE does not resolve; failing closed instead of letting the scan fall back to the parent commit\"; exit 1; }"
    - "node scripts/ci/dev-autopilot-impact-scan.mjs"
  artifacts:
    when: "always"
    expire_in: "1 day"
    paths:
      - "dev-autopilot-impact-findings.json"
      - ".delivery-ran/"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"push\" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"schedule\" && $DELIVERY_SCHEDULE == \"nightly\""

"full-suite:cicdl-lint-services":
  extends: ".full-suite"
  stage: "full-suite"
  variables:
    DELIVERY_CHECK: "cicdl-lint-services"
  script:
    - "apt-get update -qq && apt-get install -y -qq --no-install-recommends jq >/dev/null"
    - "echo \"🔍 Validating services directory structure...\"\n\nviolations=0\n\nif [ ! -d \"services\" ]; then\n  echo \"❌ ERROR: /services directory not found\"\n  exit 1\nfi\n\necho \"✅ /services directory exists\"\necho \"\"\n\necho \"📋 Found services:\"\nfind services -mindepth 1 -maxdepth 3 -type d | sort\necho \"\""
    - "echo \"🔍 Checking for manifest.json in each service...\"\necho \"\"\n\nviolations=0\nservices_checked=0\n\n# Check agents - look for manifest.json at the direct agent level\nfor agent_dir in services/agents/*/; do\n  if [ -d \"$agent_dir\" ]; then\n    services_checked=$((services_checked + 1))\n    agent_name=$(basename \"$agent_dir\")\n\n    if [ -f \"${agent_dir}manifest.json\" ]; then\n      echo \"✅ ${agent_dir}\"\n    else\n      echo \"❌ Missing: ${agent_dir}manifest.json\"\n      violations=$((violations + 1))\n    fi\n  fi\ndone\n\n# Check MCP services\nfor mcp_dir in services/mcp/*/; do\n  if [ -d \"$mcp_dir\" ]; then\n    services_checked=$((services_checked + 1))\n\n    if [ -f \"${mcp_dir}manifest.json\" ]; then\n      echo \"✅ $mcp_dir\"\n    else\n      echo \"❌ Missing: ${mcp_dir}manifest.json\"\n      violations=$((violations + 1))\n    fi\n  fi\ndone\n\n# Check gateway\nif [ -d \"services/gateway\" ]; then\n  services_checked=$((services_checked + 1))\n\n  if [ -f \"services/gateway/manifest.json\" ]; then\n    echo \"✅ services/gateway/\"\n  else\n    echo \"❌ Missing: services/gateway/manifest.json\"\n    violations=$((violations + 1))\n  fi\nfi\n\n# Check deploy-watcher\nif [ -d \"services/deploy-watcher\" ]; then\n  services_checked=$((services_checked + 1))\n\n  if [ -f \"services/deploy-watcher/manifest.json\" ]; then\n    echo \"✅ services/deploy-watcher/\"\n  else\n    echo \"❌ Missing: services/deploy-watcher/manifest.json\"\n    violations=$((violations + 1))\n  fi\nfi\n\necho \"\"\necho \"Services checked: $services_checked\"\necho \"Violations: $violations\"\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"❌ FAILURE: $violations service(s) missing manifest.json\"\n  exit 1\nfi\n\necho \"✅ All services have manifest.json files\""
    - "echo \"🔍 Validating manifest.json schema...\"\necho \"\"\n\nviolations=0\nmanifests=$(find services -maxdepth 3 -name \"manifest.json\" -type f)\n\nif [ -z \"$manifests\" ]; then\n  echo \"⚠️  No manifest.json files found\"\n  exit 0\nfi\n\nfor manifest in $manifests; do\n  echo \"Checking: $manifest\"\n\n  if ! jq empty \"$manifest\" 2>/dev/null; then\n    echo \"  ❌ Invalid JSON syntax\"\n    violations=$((violations + 1))\n    continue\n  fi\n\n  # Check for required fields - support both old and new schema\n  name=$(jq -r '.name // empty' \"$manifest\")\n  vtid=$(jq -r '.vtid // empty' \"$manifest\")\n  vt_layer=$(jq -r '.vt_layer // .layer // empty' \"$manifest\")\n  vt_module=$(jq -r '.vt_module // .module // empty' \"$manifest\")\n\n  if [ -z \"$name\" ]; then\n    echo \"  ❌ Missing required field: name\"\n    violations=$((violations + 1))\n  fi\n\n  # Either vtid or both vt_layer/vt_module required\n  if [ -z \"$vtid\" ] && ([ -z \"$vt_layer\" ] || [ -z \"$vt_module\" ]); then\n    echo \"  ⚠️  Warning: Missing vtid or vt_layer/vt_module\"\n  fi\n\n  if [ $violations -eq 0 ]; then\n    echo \"  ✅ Valid: $name\"\n  fi\ndone\n\necho \"\"\n\nif [ $violations -gt 0 ]; then\n  echo \"❌ FAILURE: $violations manifest validation error(s)\"\n  exit 1\nfi\n\necho \"✅ All manifests are valid\""
    - "echo \"🔍 Checking top-level service naming conventions...\"\necho \"\"\n\nviolations=0\n\n# Only check top-level service directories (maxdepth 2)\n# Internal subdirectories can follow language conventions (e.g., Python snake_case)\nwhile IFS= read -r dir; do\n  dirname=$(basename \"$dir\")\n\n  # Skip hidden directories and node_modules\n  if [[ \"$dirname\" == .* ]] || [[ \"$dirname\" == \"node_modules\" ]]; then\n    continue\n  fi\n\n  # Check for uppercase or underscore\n  if echo \"$dirname\" | grep -qE '[A-Z]|_'; then\n    echo \"❌ Non-kebab-case directory: $dir\"\n    echo \"   Top-level service directories must use kebab-case\"\n    violations=$((violations + 1))\n  fi\ndone < <(find services -mindepth 1 -maxdepth 2 -type d -not -path \"*/node_modules/*\")\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"❌ FAILURE: $violations naming convention violation(s)\"\n  echo \"\"\n  echo \"📘 Phase 2B Standard: Top-level service directories must use kebab-case\"\n  echo \"   Internal subdirectories may follow language conventions\"\n  exit 1\nfi\n\necho \"✅ All top-level service directories follow kebab-case convention\""
    - "echo \"✅ Services Lint Checks Complete\"\necho \"\"\necho \"Checks passed:\"\necho \"  ✅ Services directory structure valid\"\necho \"  ✅ All services have manifest.json\"\necho \"  ✅ All manifests have valid schema\"\necho \"  ✅ Naming conventions followed\""
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"push\" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"schedule\" && $DELIVERY_SCHEDULE == \"nightly\""

"full-suite:phase-2b-naming":
  extends: ".full-suite"
  stage: "full-suite"
  variables:
    DELIVERY_CHECK: "phase-2b-naming"
  script:
    - "echo \"🔍 Checking GitHub Actions workflow naming...\"\nviolations=0\n\nfor file in .github/workflows/*.yml .github/workflows/*.yaml; do\n  [ -f \"$file\" ] || continue\n\n  filename=$(basename \"$file\")\n  # Skip this file and reusable workflows\n  if [[ \"$filename\" == \"PHASE-2B-NAMING-ENFORCEMENT.yml\" ]] || \\\n     [[ \"$filename\" == _* ]]; then\n    continue\n  fi\n\n  # Check if filename contains lowercase letters (excluding extension)\n  basename_no_ext=\"${filename%.*}\"\n  if echo \"$basename_no_ext\" | grep -q '[a-z]'; then\n    echo \"❌ VIOLATION: $file\"\n    echo \"   Expected: UPPERCASE-WITH-HYPHENS.yml\"\n    echo \"   Example: DEPLOY-GATEWAY.yml, RUN-TESTS.yml\"\n    violations=$((violations + 1))\n  else\n    echo \"✅ $file\"\n  fi\ndone\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"❌ Found $violations workflow naming violations\"\n  echo \"📘 Phase 2B Standard: All workflow files must use UPPERCASE names\"\n  exit 1\nfi\n\necho \"✅ All workflows follow UPPERCASE naming standard\""
    - "echo \"🔍 Checking workflows include run-name with VTID...\"\nviolations=0\n\nfor file in .github/workflows/*.yml .github/workflows/*.yaml; do\n  [ -f \"$file\" ] || continue\n\n  filename=$(basename \"$file\")\n  # Skip reusable workflows and this file\n  if [[ \"$filename\" == _* ]] || \\\n     [[ \"$filename\" == \"PHASE-2B-NAMING-ENFORCEMENT.yml\" ]]; then\n    continue\n  fi\n\n  # Check if workflow has run-name\n  if ! grep -q \"^run-name:\" \"$file\"; then\n    echo \"⚠️  WARNING: $file missing run-name field\"\n    violations=$((violations + 1))\n  else\n    # Check if run-name references VTID or branch\n    if ! grep -A 1 \"^run-name:\" \"$file\" | grep -qi \"vtid\\|github.ref\"; then\n      echo \"⚠️  WARNING: $file run-name doesn't include VTID reference\"\n      violations=$((violations + 1))\n    else\n      echo \"✅ $file\"\n    fi\n  fi\ndone\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"⚠️  Found $violations workflows without VTID in run-name\"\n  echo \"📘 Recommended: Add run-name with VTID for tracking\"\n  echo \"Example:\"\n  echo \"  run-name: 'Deploy Gateway [VTID: DEV-CICDL-0031] (\\<ref>)'\"\n  # Warning only, not failing\nfi"
    - "echo \"🔍 Checking file naming convention (kebab-case)...\"\nviolations=0\n\n# Check TypeScript/JavaScript files\nwhile IFS= read -r file; do\n  filename=$(basename \"$file\")\n  dirname=$(dirname \"$file\")\n\n  # Skip node_modules, .git, temp_* directories, etc\n  if echo \"$file\" | grep -qE \"node_modules|\\.git|\\.next|dist|build|/temp_\"; then\n    continue\n  fi\n\n  # Check for camelCase or snake_case (should be kebab-case)\n  basename_no_ext=\"${filename%.*}\"\n  if echo \"$basename_no_ext\" | grep -qE \"[A-Z]|_\"; then\n    # Allow certain exceptions\n    if [[ \"$filename\" =~ ^(README|LICENSE|CHANGELOG|Dockerfile|Makefile)\\.? ]]; then\n      continue\n    fi\n\n    echo \"❌ VIOLATION: $file\"\n    echo \"   Contains uppercase or underscores\"\n    echo \"   Expected: kebab-case (e.g., my-service.ts)\"\n    violations=$((violations + 1))\n  fi\ndone < <(find . -type f \\( -name \"*.ts\" -o -name \"*.js\" -o -name \"*.tsx\" -o -name \"*.jsx\" \\) -not -path \"*/node_modules/*\" -not -path \"*/.git/*\")\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"❌ Found $violations file naming violations\"\n  echo \"📘 Phase 2B Standard: Use kebab-case for all code files\"\n  exit 1\nfi\n\necho \"✅ All files follow kebab-case naming standard\""
    - "echo \"🔍 Checking VTID format in code...\"\nviolations=0\n\n# Check for VTID constants that aren't UPPERCASE\nwhile IFS= read -r file; do\n  # Look for VTID assignments with lowercase\n  if grep -nE \"vtid\\s*[:=]\\s*['\\\"]\" \"$file\"; then\n    echo \"❌ VIOLATION: $file\"\n    echo \"   VTID constants should be UPPERCASE\"\n    echo \"   Use: const VTID = 'DEV-CICDL-0031'\"\n    echo \"   Not: const vtid = 'DEV-CICDL-0031'\"\n    violations=$((violations + 1))\n  fi\ndone < <(find services packages -type f \\( -name \"*.ts\" -o -name \"*.js\" \\) -not -path \"*/node_modules/*\" 2>/dev/null || true)\n\nif [ $violations -gt 0 ]; then\n  echo \"\"\n  echo \"⚠️  Found $violations VTID format warnings\"\n  echo \"📘 Recommended: Use UPPERCASE for VTID constants\"\n  # Warning only\nfi"
    - "echo \"🔍 Checking PR description for Phase 2B checklist...\"\n\n# This would require GitHub API access to check PR body\n# For now, we'll just log a reminder\necho \"⚡ Reminder: Ensure PR description includes Phase 2B compliance checklist\"\necho \"   The PR template should be filled out completely\""
    - "echo \"✅ Phase 2B Naming Standards Verification Complete\"\necho \"\"\necho \"Checks passed:\"\necho \"  ✅ Workflow naming (UPPERCASE)\"\necho \"  ✅ File naming (kebab-case)\"\necho \"  ✅ VTID format compliance\"\necho \"\"\necho \"Ready for review and merge!\""
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"push\" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"schedule\" && $DELIVERY_SCHEDULE == \"nightly\""

"full-suite:phase-2b-doc-gate":
  extends: ".full-suite"
  stage: "full-suite"
  variables:
    DELIVERY_CHECK: "phase-2b-doc-gate"
  script:
    - "set -e\nmissing=0\nfor i in $(seq -w 00 20); do\n  count=$(ls phase_2b/${i}_*.md 2>/dev/null | wc -l | tr -d ' ')\n  if [ \"$count\" -eq 0 ]; then\n    echo \"ERROR: Missing required file for index ${i} (phase_2b/${i}_*.md)\"\n    missing=1\n  fi\ndone\nexit $missing"
    - "set -e\nfor f in phase_2b/*.md; do\n  grep -q \"^# \" \"$f\" || { echo \"ERROR: No H1 heading in $f\"; exit 1; }\n  for sec in \"## Purpose\" \"## Audience\" \"## Inputs\" \"## Outputs\" \"## Procedures\" \"## Validation\" \"## Links\"; do\n    grep -q \"$sec\" \"$f\" || echo \"WARNING: Missing section '$sec' in $f\"\n  done\ndone"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"push\" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"schedule\" && $DELIVERY_SCHEDULE == \"nightly\""

"full-suite:openapi-enforce":
  extends: ".full-suite"
  stage: "full-suite"
  variables:
    DELIVERY_CHECK: "openapi-enforce"
  script:
    - "npm install -g @stoplight/spectral-cli >/dev/null"
    - "echo \"🔍 Finding OpenAPI specification files...\"\n\n# Find all OpenAPI specs\nSPECS=$(find specs packages/openapi -name \"*.yml\" -o -name \"*.yaml\" 2>/dev/null || true)\n\nif [ -z \"$SPECS\" ]; then\n  echo \"⚠️  No OpenAPI specifications found\"\n  echo \"has_specs=false\" >> \"$CI_PROJECT_DIR/openapi-enforce.env\"\n  exit 0\nfi\n\necho \"has_specs=true\" >> \"$CI_PROJECT_DIR/openapi-enforce.env\"\necho \"Found specifications:\"\necho \"$SPECS\" | while read spec; do\n  echo \"  - $spec\"\ndone"
    - "echo \"✨ Running Spectral validation...\"\necho \"\"\n\nviolations=0\ntotal_specs=0\n\n# Validate each spec\nfor spec in $(find specs packages/openapi -name \"*.yml\" -o -name \"*.yaml\" 2>/dev/null); do\n  total_specs=$((total_specs + 1))\n  echo \"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\"\n  echo \"📄 Validating: $spec\"\n  echo \"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\"\n\n  if spectral lint \"$spec\" --fail-severity=warn; then\n    echo \"✅ $spec - PASSED\"\n  else\n    echo \"❌ $spec - FAILED\"\n    violations=$((violations + 1))\n  fi\n\n  echo \"\"\ndone\n\necho \"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\"\necho \"📊 Summary\"\necho \"━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\"\necho \"Total specs validated: $total_specs\"\necho \"Passed: $((total_specs - violations))\"\necho \"Failed: $violations\"\necho \"\"\n\nif [ $violations -gt 0 ]; then\n  echo \"❌ FAILURE: $violations OpenAPI specification(s) failed validation\"\n  echo \"\"\n  echo \"📘 Common issues:\"\n  echo \"   - Missing or invalid OpenAPI version\"\n  echo \"   - Schema validation errors\"\n  echo \"   - Missing required fields (info, paths, etc.)\"\n  echo \"   - Invalid references (\\$ref)\"\n  echo \"   - Security scheme issues\"\n  echo \"\"\n  echo \"💡 Fix the errors above and commit the changes.\"\n  echo \"   Run locally: spectral lint <spec-file>\"\n  exit 1\nfi\n\necho \"✅ All OpenAPI specifications are valid!\""
    - "echo \"🔍 Checking OpenAPI versions...\"\necho \"\"\n\nviolations=0\n\nfor spec in $(find specs packages/openapi -name \"*.yml\" -o -name \"*.yaml\" 2>/dev/null); do\n  version=$(grep -E \"^openapi:\" \"$spec\" | head -1 | awk '{print $2}' | tr -d '\"' | tr -d \"'\")\n\n  if [ -z \"$version\" ]; then\n    echo \"❌ $spec - Missing openapi version field\"\n    violations=$((violations + 1))\n    continue\n  fi\n\n  # Check if version is 3.0.x or 3.1.x\n  if echo \"$version\" | grep -qE \"^3\\.[01]\\.[0-9]+$\"; then\n    echo \"✅ $spec - OpenAPI $version\"\n  else\n    echo \"❌ $spec - Unsupported version: $version\"\n    echo \"   Required: OpenAPI 3.0.x or 3.1.x\"\n    violations=$((violations + 1))\n  fi\ndone\n\necho \"\"\n\nif [ $violations -gt 0 ]; then\n  echo \"❌ FAILURE: $violations version issue(s)\"\n  echo \"\"\n  echo \"📘 All OpenAPI specs must use version 3.0.x or 3.1.x\"\n  echo \"   Add to spec: openapi: 3.0.3\"\n  exit 1\nfi\n\necho \"✅ All specs use supported OpenAPI versions\""
    - "echo \"🔍 Checking for duplicate operationIds...\"\necho \"\"\n\nviolations=0\n\nfor spec in $(find specs packages/openapi -name \"*.yml\" -o -name \"*.yaml\" 2>/dev/null); do\n  echo \"Checking: $spec\"\n\n  # Extract all operationIds\n  operation_ids=$(grep -oP 'operationId:\\s*\\K[^\\s]+' \"$spec\" 2>/dev/null || true)\n\n  if [ -z \"$operation_ids\" ]; then\n    echo \"  ⚠️  No operationIds found (optional)\"\n    continue\n  fi\n\n  # Check for duplicates\n  duplicates=$(echo \"$operation_ids\" | sort | uniq -d)\n\n  if [ -n \"$duplicates\" ]; then\n    echo \"  ❌ Duplicate operationIds found:\"\n    echo \"$duplicates\" | while read dup; do\n      echo \"     - $dup\"\n    done\n    violations=$((violations + 1))\n  else\n    echo \"  ✅ No duplicate operationIds\"\n  fi\ndone\n\necho \"\"\n\nif [ $violations -gt 0 ]; then\n  echo \"❌ FAILURE: Duplicate operationIds detected\"\n  echo \"\"\n  echo \"📘 Each operation must have a unique operationId within a spec\"\n  exit 1\nfi\n\necho \"✅ No duplicate operationIds found\""
    - "echo \"🔍 Checking for schemas directory...\"\n\nif [ -d \"packages/openapi\" ] && [ ! -d \"packages/openapi/schemas\" ]; then\n  echo \"⚠️  Recommendation: Create packages/openapi/schemas/ for shared schemas\"\n  echo \"   This allows reuse across multiple API specs using \\$ref\"\nelse\n  echo \"✅ Schemas directory structure looks good\"\nfi"
    - "echo \"📄 Generating validation report...\"\n\nmkdir -p docs/reports\nREPORT=\"docs/reports/openapi-validation-$(date +%Y%m%d).md\"\n\ncat > \"$REPORT\" << EOF\n# OpenAPI Validation Report\n\n**Date:** $(date -u +\"%Y-%m-%d %H:%M:%S UTC\")  \n**VTID:** DEV-CICDL-0033  \n**Branch:** $CI_COMMIT_REF_NAME\n\n## Validated Specifications\n\nEOF\n\nfor spec in $(find specs packages/openapi -name \"*.yml\" -o -name \"*.yaml\" 2>/dev/null); do\n  version=$(grep -E \"^openapi:\" \"$spec\" | head -1 | awk '{print $2}' | tr -d '\"' | tr -d \"'\")\n  echo \"- ✅ \\`$spec\\` (OpenAPI $version)\" >> \"$REPORT\"\ndone\n\ncat >> \"$REPORT\" << EOF\n\n## Validation Results\n\n- ✅ All specs passed Spectral validation\n- ✅ All specs use supported OpenAPI versions\n- ✅ No duplicate operationIds detected\n\n## Next Steps\n\n1. Review the validated specifications\n2. Deploy to API Gateway (if applicable)\n3. Generate client SDKs (optional)\n\n---\n\n**Validation Tool:** Spectral CLI  \n**CI Workflow:** CICDL-CORE-OPENAPI-ENFORCE\nEOF\n\necho \"✅ Report saved to: $REPORT\""
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"push\" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"schedule\" && $DELIVERY_SCHEDULE == \"nightly\""

