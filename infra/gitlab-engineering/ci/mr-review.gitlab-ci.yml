# Bedrock MR review job. A hand-written fragment: it is NOT generated by scripts/eng/pipeline-gen.mjs yet.
# Wire it into the v1 delivery configuration (vitana/ci-config) through the generator before it runs in any pipeline.
# Runs on merge request pipelines only, so CI_COMMIT_SHA is the merge request head that the review binds to.
# The job makes no acceptance of its own: it asks the gateway, verifies the signed attestation with the pinned
# public key, and records the signed result as an MR note. The merge bot acts on that note, not on this job's exit code.
.mr-review:
  image: public.ecr.aws/docker/library/node:20-bookworm
  stage: checks
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - node scripts/ci/mr-review/review-job.mjs

bedrock-review:
  extends: .mr-review
  # Required CI variables (masked where secret), set in the vitana/vitana-v1 project:
  #   MR_REVIEW_GATEWAY_URL      gateway base URL
  #   MR_REVIEW_CALLER_TOKEN     dedicated reviewer caller credential (masked); not the Supabase or prod key
  #   MR_REVIEW_GITLAB_TOKEN     token that may write MR notes on vitana-v1 (masked)
  #   MR_REVIEW_PUBLIC_KEY_PEM   pinned reviewer public key (PEM, from KMS GetPublicKey)
  #   MR_REVIEW_KEY_ID           KMS key identifier the attestations must carry
  #   MR_REVIEW_REVIEWER         reviewer identity the attestations must carry (bedrock-plan-sparring)
  #   CI_API_V4_URL, CI_PROJECT_ID, CI_PROJECT_PATH, CI_MERGE_REQUEST_IID, CI_COMMIT_SHA: provided by GitLab
  variables:
    MR_REVIEW_LEVEL: "bedrock"
