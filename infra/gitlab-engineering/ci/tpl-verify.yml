# VTID-05552 — STAGING-VERIFY on GitLab: plan agentic-delivery §3.6 steps 3 to 6 and 8 (lane verify-on-gitlab).
#
# Hidden jobs only. The main and nightly pipelines (lane pipelines: tpl-main.yml, tpl-nightly.yml) extend them once per
# service, set VERIFY_SERVICE (gateway | community-app), a stage, and `needs:` (`.record` needs that service's
# `.staging-verify` job and its artifact; `.staging-verify` needs `.deploy-staging` and its deploy-runs file).
#   .staging-verify          main class. Shadow mode: wait up to 60 minutes for staging to serve the commit GitHub
#                            deployed. Then platform main's run.mjs verify, with --deploy-runs-file in place of the
#                            GitHub Actions API. Read-only against staging, as on GitHub (CLAUDE.md rule 48).
#   .staging-verify-nightly  the same on the commit staging serves now, with full=true (T3).
#   .record                  deploy class. record-oasis.sh writes the staging.verify.* row the PUBLISH gate reads.
#   .vtid-close              deploy class. vtid-auto-close.cjs, with its environment from the squash commit.
#   .notify-platform         deploy class, vitana-v1. Starts the platform pipeline that SCREENS-CATALOG-TRIGGER starts.
# Every script comes from platform main (the clone made by .delivery-central), never from the commit under test, the
# way GitHub's STAGING-VERIFY checks out its runner from main. Deploy-class jobs check out nothing (GIT_STRATEGY none).
# Shadow mode is DELIVERY_MODE set to anything but "live", or unset. In shadow mode .record, .vtid-close and
# .notify-platform never run, and their scripts refuse as well. So GitHub stays the only writer of verification rows
# and VTID closes until the cutover. Secrets: one Secrets Manager secret per job through its plan §7 role (ID token
# audience aws:verify or aws:record); each secret is JSON keyed by the GitHub secret names it replaces.

# GitLab sets a resource group's process mode only through the API (PUT /projects/:id/resource_groups/:key), never in
# YAML. Plan §3.6 step 3 asks for oldest first: the settings sync applies these modes to the groups the jobs use.
.resource-groups:
  staging-verify-gateway: oldest_first
  staging-verify-community-app: oldest_first
  staging-verify-gateway-full: oldest_first
  staging-verify-community-app-full: oldest_first

# The central scripts: a sparse, shallow clone of platform main through the job's own token (plan §7: jobs read the
# other project with their job token; the platform project's job token allowlist includes vitana-v1).
.delivery-central:
  image: public.ecr.aws/docker/library/node:20-bookworm
  interruptible: false
  variables:
    CENTRAL_DIR: /tmp/vitana-central
    SECRETS_DIR: /tmp/vitana-secrets
    PLATFORM_PROJECT_PATH: vitana/vitana-platform
    AWS_REGION: eu-central-1
  before_script:
    - rm -rf "$CENTRAL_DIR" "$SECRETS_DIR"
    - git clone --quiet --depth 1 --branch main --filter=blob:none --sparse "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${PLATFORM_PROJECT_PATH}.git" "$CENTRAL_DIR"
    - git -C "$CENTRAL_DIR" sparse-checkout set --no-cone /scripts/ci/staging-verify/ /scripts/eng/verify/ /scripts/ci/vtid-auto-close.cjs
    - 'echo "central scripts: ${PLATFORM_PROJECT_PATH} main @ $(git -C "$CENTRAL_DIR" rev-parse HEAD)"'

.staging-verify:
  extends: .delivery-central
  tags: [vitana-eng-main]
  resource_group: staging-verify-${VERIFY_SERVICE}
  timeout: 2h 15m
  id_tokens:
    VERIFY_ID_TOKEN:
      aud: aws:verify
  variables:
    GIT_DEPTH: "0"
    VERIFY_SERVICE: ""
    VERIFY_FULL: "false"
    DEPLOY_RUNS_FILE: $CI_PROJECT_DIR/deploy-runs.json
    GL_VERIFY_ROLE_ARN: arn:aws:iam::472838866351:role/gl-verify
  script:
    - node "$CENTRAL_DIR/scripts/eng/verify/aws-secret.mjs" --token-env VERIFY_ID_TOKEN --role-arn "$GL_VERIFY_ROLE_ARN" --secret-id vitana/ci/test-user --out "$SECRETS_DIR/test-user.json"
    - node "$CENTRAL_DIR/scripts/eng/verify/shadow-wait.mjs" --run-mjs "$CENTRAL_DIR/scripts/ci/staging-verify/run.mjs" --service "$VERIFY_SERVICE" --sha "$CI_COMMIT_SHA" --repo-root "$CI_PROJECT_DIR" --out "$CI_PROJECT_DIR/staging-verify-out/$VERIFY_SERVICE" --deploy-runs-file "$DEPLOY_RUNS_FILE" --full "$VERIFY_FULL" --test-user-file "$SECRETS_DIR/test-user.json"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - staging-verify-out/

# T3, 02:17 UTC: every change suite of the service against the commit staging serves now (as STAGING-VERIFY-NIGHTLY).
# Its own resource group, so a 45-minute full run never delays a per-landing verification (VTID-05144 on GitHub).
.staging-verify-nightly:
  extends: .staging-verify
  resource_group: staging-verify-${VERIFY_SERVICE}-full
  variables:
    VERIFY_FULL: "true"
  script:
    - node "$CENTRAL_DIR/scripts/eng/verify/aws-secret.mjs" --token-env VERIFY_ID_TOKEN --role-arn "$GL_VERIFY_ROLE_ARN" --secret-id vitana/ci/test-user --out "$SECRETS_DIR/test-user.json"
    - node "$CENTRAL_DIR/scripts/eng/verify/shadow-wait.mjs" --run-mjs "$CENTRAL_DIR/scripts/ci/staging-verify/run.mjs" --service "$VERIFY_SERVICE" --sha-from-staging --repo-root "$CI_PROJECT_DIR" --out "$CI_PROJECT_DIR/staging-verify-out/$VERIFY_SERVICE" --deploy-runs-file "$DEPLOY_RUNS_FILE" --full "$VERIFY_FULL" --test-user-file "$SECRETS_DIR/test-user.json"

# record-oasis.sh, unchanged, writes the row; WORKFLOW = gitlab:<project>/staging-verify (lane prerequisites). It runs
# when the verification failed too. Without its secret the job is red and the result stays in the verify artifact.
.record:
  extends: .delivery-central
  tags: [vitana-eng-deploy]
  id_tokens:
    RECORD_ID_TOKEN:
      aud: aws:record
  variables:
    GIT_STRATEGY: none
    VERIFY_SERVICE: ""
    GL_RECORD_ROLE_ARN: arn:aws:iam::472838866351:role/gl-record
  rules:
    - if: $DELIVERY_MODE != "live"
      when: never
    - when: always
  script:
    - command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends jq >/dev/null)
    - node "$CENTRAL_DIR/scripts/eng/verify/aws-secret.mjs" --token-env RECORD_ID_TOKEN --role-arn "$GL_RECORD_ROLE_ARN" --secret-id vitana/ci/oasis-recorder --out "$SECRETS_DIR/oasis-recorder.json"
    - node "$CENTRAL_DIR/scripts/eng/verify/record-env.mjs" run --record-script "$CENTRAL_DIR/scripts/ci/staging-verify/record-oasis.sh" --out "$CI_PROJECT_DIR/staging-verify-out/$VERIFY_SERVICE" --secret-file "$SECRETS_DIR/oasis-recorder.json"

# vtid-auto-close.cjs, unchanged, closes the VTIDs of the landed merge request through the governed completion
# endpoint. As VTID-AUTO-CLOSE on GitHub, a close that does not happen never fails the landing (allow_failure).
.vtid-close:
  extends: .delivery-central
  tags: [vitana-eng-deploy]
  needs: []
  allow_failure: true
  id_tokens:
    RECORD_ID_TOKEN:
      aud: aws:record
  variables:
    GIT_STRATEGY: none
    GL_RECORD_ROLE_ARN: arn:aws:iam::472838866351:role/gl-record
  rules:
    - if: $DELIVERY_MODE != "live"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - node "$CENTRAL_DIR/scripts/eng/verify/aws-secret.mjs" --token-env RECORD_ID_TOKEN --role-arn "$GL_RECORD_ROLE_ARN" --secret-id vitana/ci/gateway-service-token --out "$SECRETS_DIR/gateway-service-token.json"
    - node "$CENTRAL_DIR/scripts/eng/verify/vtid-close-env.mjs" run --close-script "$CENTRAL_DIR/scripts/ci/vtid-auto-close.cjs" --secret-file "$SECRETS_DIR/gateway-service-token.json"

# vitana-v1 only: the multi-project pipeline that replaces the regen-screens-catalog repository dispatch of
# SCREENS-CATALOG-TRIGGER.yml (same paths, same payload). The job token needs no secret and no AWS role.
.notify-platform:
  image: public.ecr.aws/docker/library/node:20-bookworm
  tags: [vitana-eng-deploy]
  interruptible: false
  needs: []
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $DELIVERY_MODE != "live"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes:
        - src/config/admin-navigation.ts
        - src/lib/screen-id.ts
  script:
    - '[ "$DELIVERY_MODE" = "live" ] || { echo "DELIVERY_MODE is not live (shadow mode): notify-platform does not run (plan agentic-delivery §3.6 step 8)"; exit 3; }'
    - curl --fail-with-body --silent --show-error --request POST --form "token=${CI_JOB_TOKEN}" --form ref=main --form "variables[DISPATCH_EVENT_TYPE]=regen-screens-catalog" --form "variables[DISPATCH_SOURCE_REPO]=vitana-v1" --form "variables[DISPATCH_SOURCE_SHA]=${CI_COMMIT_SHA}" --output /dev/null "${CI_API_V4_URL}/projects/vitana%2Fvitana-platform/trigger/pipeline"
