  stage: "full-suite"
  parallel: 3
  variables:
    DELIVERY_CHECK: "vitest"
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    key:
      files:
        - "package-lock.json"
      prefix: "vitest"
    paths:
      - ".npm"
    policy: "pull-push"
  script:
    - "npm ci --no-audit --no-fund --prefer-offline"
    - "mkdir -p shards"
    - "npx vitest list --filesOnly | sed \"s#^#$CI_PROJECT_DIR/#\" > \"shards/list-${CI_NODE_INDEX}.txt\""
    - "npx vitest run --shard=\"${CI_NODE_INDEX}/${CI_NODE_TOTAL}\" --reporter=default --reporter=json --outputFile=\"shards/shard-${CI_NODE_INDEX}.json\""
  artifacts:
    when: "always"
    expire_in: "1 day"
    paths:
      - "shards/"
      - ".delivery-ran/"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"push\" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"schedule\" && $DELIVERY_SCHEDULE == \"nightly\""

