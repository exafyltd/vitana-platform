"full-suite:android-module":
  extends: ".full-suite"
  stage: "full-suite"
  image: "public.ecr.aws/docker/library/node:20-bookworm"
  parallel: 2
  variables:
    DELIVERY_CHECK: "android-module"
    APP_PROFILE: "development"
    EXPO_OFFLINE: "0"
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  cache:
    key:
      files:
        - "apps/mobile/package-lock.json"
      prefix: "android-module"
    paths:
      - ".npm"
      - ".android-sdk"
      - ".gradle-home"
    policy: "pull-push"
  script:
    - "apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless >/dev/null"
    - "cd apps/mobile"
    - "npm ci --no-audit --no-fund --prefer-offline"
    - "mkdir -p \"$ANDROID_HOME/licenses\" && printf \"\\n24333f8a63b6825ea9c5514f83c2829b004d1fee\\nd56f5187479451eabf01fb78af6dfcb131a6481e\\n\" > \"$ANDROID_HOME/licenses/android-sdk-license\""
    - "java -version 2>&1 | head -n 1"
    - "npx expo prebuild --platform android --no-install"
    - "CLASSES=$(find modules/vitana-voice/android/src/test -name \"*Test.kt\" -o -name \"*Test.java\" | sed \"s#.*/##; s#\\.[a-z]*$##\" | sort | awk -v n=\"$CI_NODE_TOTAL\" -v i=\"$CI_NODE_INDEX\" '(NR - 1) % n == i - 1')"
    - "if [ -z \"$CLASSES\" ]; then echo \"no test class in shard $CI_NODE_INDEX/$CI_NODE_TOTAL\"; exit 0; fi"
    - "cd android && ./gradlew :vitana-voice:testDebugUnitTest $(for c in $CLASSES; do printf -- \"--tests *.%s \" \"$c\"; done) --no-daemon --stacktrace"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"push\" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"schedule\" && $DELIVERY_SCHEDULE == \"nightly\""

