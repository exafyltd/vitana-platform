preview-e2e:
  extends:
    - ".check"
    - ".central-tools"
  stage: "checks"
  variables:
    DELIVERY_CHECK: "preview-e2e"
    STAGING_GATEWAY: "https://preview-aws-gateway.vitanaland.com"
    NODE_OPTIONS: "--max-old-space-size=4096"
  cache:
    key:
      files:
        - "package-lock.json"
      prefix: "preview-e2e"
    paths:
      - ".npm"
    policy: "pull-push"
  script:
    - "npm ci --no-audit --no-fund --prefer-offline"
    - "OK=false; for i in 1 2 3; do if [ \"$(curl -s -o /dev/null -w '%{http_code}' \"$STAGING_GATEWAY/alive\")\" = \"200\" ]; then OK=true; break; fi; sleep 30; done"
    - "if [ \"$OK\" != \"true\" ]; then echo \"preview-e2e: neutral: staging gateway unhealthy, e2e deferred to STAGING-VERIFY\"; exit 0; fi"
    - "printf 'VITE_GATEWAY_BASE=%s\\nVITE_GATEWAY_URL=%s/api/v1\\nVITE_APP_VERSION=%s\\nVITE_HEALTH_REAL_DATA=true\\n' \"$STAGING_GATEWAY\" \"$STAGING_GATEWAY\" \"$(git rev-parse --short=12 HEAD)\" > .env.production"
    - "npm run build"
    - "cp \"$CENTRAL_DIR/scripts/ci/staging-verify/staging-guard.ts\" tests/e2e/staging/staging-guard.ts"
    - "npm install --no-save --no-audit --no-fund @playwright/test@1.51.0"
    - "npx playwright install --with-deps chromium"
    - "(npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &)"
    - "for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done"
    - "SPECS=\"tests/e2e/staging/smoke.staging.spec.ts\"; for v in $(printf \"%s\" \"$GATE_TITLE\" | grep -Eo \"VTID-[0-9]{4,5}\" | sort -u || true); do m=\"docs/validation/$v/staging-tests.json\"; if [ -f \"$m\" ]; then SPECS=\"$SPECS $(node -e \"const m=require('./$m');console.log(m.tests.filter(t=>t.kind==='playwright').map(t=>t.spec).join(' '))\")\"; fi; done; echo \"specs (no session, plan §3.4; the signed-in specs run in STAGING-VERIFY): $SPECS\""
    - "printf \"%s\\n\" \"import { defineConfig, devices } from '@playwright/test';\" \"export default defineConfig({ testDir: process.cwd(), timeout: 90_000, retries: 0, workers: 1, reporter: [['list']], use: { baseURL: 'http://127.0.0.1:4173', ...devices['Desktop Chrome'], screenshot: 'only-on-failure' } });\" > .pr-gate.playwright.config.mjs"
    - "E2E=0; npx playwright test $SPECS --config=.pr-gate.playwright.config.mjs 2>&1 | tee /tmp/e2e.log || E2E=$?"
    - "if [ \"$E2E\" = \"0\" ]; then echo \"preview-e2e: passed ($(grep -Eo '[0-9]+ passed' /tmp/e2e.log | tail -1 || true))\"; exit 0; fi"
    - "ENFORCE=$(node -p \"require('./scripts/ci/pr-gate/config.json').enforce_preview_e2e === true\")"
    - "if [ \"$ENFORCE\" = \"true\" ]; then echo \"preview-e2e: failed\"; exit 1; fi; echo \"preview-e2e (report-only, enforce_preview_e2e is not true) would fail: see the log above\""
  artifacts:
    when: "always"
    expire_in: "1 day"
    paths:
      - "test-results/"
      - ".delivery-ran/"
  rules:
    - if: "$CI_PIPELINE_SOURCE == \"merge_request_event\" || $CI_COMMIT_BRANCH =~ /^train\\//"
      changes:
