  extends: ".assist"
  stage: "assist"
  tags:
    - "vitana-eng-main"
  interruptible: false
  variables:
    ASSIST_RULE: "i18n-nightly"
    ASSIST_KIND: "schedule"
  script:
    - "node scripts/i18n-stamp-source.mjs --check-all > /tmp/drift.txt 2>&1 && { echo \"no language is behind the German source\"; exit 0; } || true"
    - "node scripts/i18n-stamp-source.mjs --locale=en --check --flag || true"
    - "node scripts/translate-keys.mjs --init --provider=\"$I18N_PROVIDER\" --locale=en --source=de --batch=30 || true"
    - "node scripts/i18n-stamp-source.mjs --locale=en"
    - "for L in $(node scripts/i18n-locales.mjs --list | grep -vx en); do node scripts/i18n-stamp-source.mjs --locale=\"$L\" --check --flag || true; node scripts/translate-keys.mjs --init --provider=\"$I18N_PROVIDER\" --locale=\"$L\" --source=en --batch=30 || true; node scripts/i18n-stamp-source.mjs --locale=\"$L\"; done"
    - "assist_finish \"propagate the German source to every language (nightly safety net)\""
  rules:
    - if: "$DELIVERY_MODE != \"live\""
      when: "never"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == \"schedule\" && $DELIVERY_SCHEDULE == \"i18n-nightly\""
