name: SQL-LIVE-ROOM-CALENDAR
run-name: 'live room reminder calendar trigger against a throwaway Postgres [VTID: VTID-04965] (${{ github.ref_name }})'

# VTID-04965 — runs the Live Room reminder -> calendar trigger (entry on
# Erinnern, cancel on un-notify, backfill, test-account exclusion) against a
# disposable Postgres service container. Never runs against Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*vtid_04965*.sql'
      - 'scripts/ci/sql-tests/*live-room-calendar*'
      - '.github/workflows/SQL-LIVE-ROOM-CALENDAR.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the live room calendar test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-live-room-calendar-test.sh 2>&1 | tee /tmp/liveroom.log
      - name: Assert the test ran to the end
        run: grep -q "^PASS vtid-04965 live room calendar" /tmp/liveroom.log
