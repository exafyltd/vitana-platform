name: SQL-HEALTH-SOURCES
run-name: 'health_sources against a throwaway Postgres [VTID: VTID-05161] (${{ github.ref_name }})'

# VTID-05161 — the Aurora-only health_sources migration and the Supabase-target
# user_integrations browser-write revoke against a disposable Postgres service
# container: backfill from user_connections (wearable/aggregator) and
# user_integrations, idempotency, the connector_registry FK, RLS own-read and no
# browser writes, the reconcile counts, erase_user_data() discovery, and the
# placement guard that refuses a Supabase-shaped database. Never runs against
# Supabase or Aurora.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*health_sources*.sql'
      - 'supabase/migrations/*user_integrations*.sql'
      - 'supabase/migrations/*erase_user_data*.sql'
      - 'supabase/migrations/20260417000000_vtid_02100_connector_framework.sql'
      - 'supabase/migrations/20260417000100_vtid_02100_connector_registry_seed.sql'
      - 'supabase/migrations/20260417010000_vtid_02100_connector_registry_update.sql'
      - 'supabase/migrations/20260423200000_vitana_integrations_v1.sql'
      - 'scripts/ci/sql-tests/**'
      - '.github/workflows/SQL-HEALTH-SOURCES.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the health_sources test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-health-sources-test.sh 2>&1 | tee /tmp/health-sources.log
      - name: Assert the test ran to the end
        run: |
          grep -q '^PASS vtid-05161 health sources' /tmp/health-sources.log
          grep -q '^PASS vtid-05161 placement guard' /tmp/health-sources.log
