name: Alert — OASIS Ledger Integrity

# VTID-03516. The ledger spent six days asserting that almost all recent work
# had failed, and nothing noticed.
#
# 24 of the last 80 VTIDs carried status='rejected' / terminal_outcome='failed'
# for work that was merged and verified in production — including VTID-03480,
# whose fix was watched flipping `ok:false` -> `ok:true` on live sessions.
# CLAUDE.md rule 1 is "always treat OASIS as the single source of truth"; that
# rule is worth nothing if no check ever asks whether the source of truth is
# telling the truth.
#
# WHAT IT CATCHES
# ---------------
# The autonomous execution plane terminalizing work that was never its own.
# The worker-runner's claimable-task feed used to select on the exact tuple
# CLAUDE.md §4.1 tells every Claude Code session to write onto its own VTID
# (in_progress + spec_status=approved + not terminal + unclaimed), so it
# claimed session work, failed instantly on a missing ANTHROPIC_API_KEY, and
# recorded a false failure. The fix is the ownership allowlist in
# services/gateway/src/routes/worker-orchestrator.ts
# (`isAutonomousExecutionTask`); this workflow is the assertion that the fix
# is still holding.
#
# It deliberately does NOT alert on terminal_outcome='failed' in general. Real
# failures exist and must stay quiet, or this gets muted within a week. It
# fires only on the fingerprint of a false verdict: claimed by a worker-runner,
# terminalized failed, but not autonomous-plane work.
#
# VTID-05141 — TRANSPORT CHANGED: this workflow is now a thin GET of the
# production gateway's public, read-only ops health route
# (services/gateway/src/routes/ops-health-checks.ts), which runs the same
# query and thresholds this workflow used to run inline. One implementation
# per check; the panel and this alert can no longer disagree. A non-JSON
# answer, an HTTP 404/5xx or any status other than "ok" fails the job
# (never silently green).
#
# Route: /api/v1/ops/health/vtid-ledger (ci_ledger_integrity_check, 7-day
# lookback — backed by
# supabase/migrations/20260806160000_vtid_03516_ledger_integrity_check.sql).

on:
  schedule:
    - cron: '40 7 * * *'   # 09:40 CET daily, staggered off the other two alerts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Assert the ledger records no false failures
        env:
          HEALTH_URL: https://gateway.vitanaland.com/api/v1/ops/health/vtid-ledger
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o health.json -w '%{http_code}' --max-time 60 "$HEALTH_URL") || HTTP="000"
          echo "GET $HEALTH_URL -> HTTP $HTTP"
          head -c 2000 health.json 2>/dev/null || true
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::error::$HEALTH_URL answered HTTP $HTTP. A 404 means the route is not deployed to production; 5xx or 000 means the gateway did not answer. The check itself failed."
            exit 1
          fi
          if ! jq -e 'type == "object"' health.json >/dev/null 2>&1; then
            echo "::error::$HEALTH_URL did not answer a JSON object (an HTML page means the route does not exist on the deployed gateway). The check itself failed."
            exit 1
          fi
          STATUS=$(jq -r '.status // "missing"' health.json)
          REASON=$(jq -r '.reason // ""' health.json)
          if [ "$STATUS" != "ok" ]; then
            echo "::error::OASIS ledger integrity check is not healthy (VTIDs terminalized failed by the autonomous plane without owning the work — check isAutonomousExecutionTask() in services/gateway/src/routes/worker-orchestrator.ts): status=$STATUS reason=$REASON (see the JSON above)."
            exit 1
          fi
          echo "OK: status=$STATUS"

      # VTID-05103: a failed check reaches the one self-healing intake (loop L1),
      # not just a red run in Actions. Reporting never changes this job's result.
      - name: Check out the report script
        if: failure()
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Report failure to self-healing
        if: failure()
        env:
          SERVICE_TOKEN: ${{ secrets.GATEWAY_SERVICE_TOKEN }}
        run: bash scripts/ci/report-to-self-healing.sh "alert-oasis-ledger-integrity" "alert-workflow://ALERT-OASIS-LEDGER-INTEGRITY" "OASIS ledger records false failures from the autonomous plane"
