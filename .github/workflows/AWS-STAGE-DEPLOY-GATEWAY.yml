                 --arg SEC_ERP_BRIDGE "$SEC_ERP_BRIDGE" --arg ERP_BRIDGE_URL "$ERP_BRIDGE_URL" \
                 --arg SEC_SQL_RO "$SEC_SQL_RO" \
                 --arg SEC_MACHINE_AUTH "$SEC_MACHINE_AUTH" \
                 --arg SEC_SERVICE_TOKEN "$SEC_SERVICE_TOKEN" --arg SEC_INTERNAL_TOKEN "$SEC_INTERNAL_TOKEN" \
                 --arg SCAN_TOKEN "$DEV_AUTOPILOT_SCAN_TOKEN_VALUE" \
                 --arg GCP_CRED_CONFIG "$GCP_CRED_CONFIG" \
                 --arg TASK_ROLE "$TASK_ROLE_ARN" '
                .containerDefinitions[0].image = $IMG
                | .containerDefinitions[0].environment |=
                    ( [ .[] | select(.name | IN("GIT_COMMIT_SHA","COMMIT_SHA","BUILD_INFO_MARKER",
                                                "NOVA_SONIC_ENABLED","NOVA_SONIC_REGION","NOVA_SONIC_MODEL_ID",
                                                "NOVA_SONIC_CANARY_USER_IDS","NOVA_SONIC_CANARY_TENANT_IDS",
                                                "FEATURE_ORB_GREETING_TTS_BRIDGE_ENV",
                                                "FEATURE_ORB_SAFE_FAST_GREETING_ENV",
                                                "FEATURE_LATENCY_TELEMETRY_ENV",
                                                "FEATURE_ORB_FAST_START_ENV",
                                                "FEATURE_ORB_BRAIN_CACHE_ENV",
                                                "FEATURE_ORB_NOVA_PREWARM_ENV",
                                                "FEATURE_ORB_WS_TRANSPORT_ENV",
                                                "ORB_FULL_DUPLEX_ENABLED",
                                                "ORB_DAY_CLOSE_RUNG_ENABLED",
                                                "ORB_LOG_NOVA_INSTRUCTION_DEBUG",
                                                "TTS_PROVIDER","TTS_POLLY_STRICT","VERTEX_LIVE_UNAVAILABLE",
                                                "ORB_CASCADED_VOICE_ENABLED",
                                                "OPERATOR_EXECUTION_ONRAMP_ENABLED",
                                                "OPERATOR_ONRAMP_EXECUTOR",
                                                "OPERATOR_CODEBASE_READ_ENABLED",
                                                "OPERATOR_DB_READONLY_ENABLED",
                                                "OPERATOR_AWS_READONLY_ENABLED",
                                                "OPERATOR_BOOTSTRAP_PACK_ENABLED","OPERATOR_BOOTSTRAP_BUILD_INFO_URLS",
                                                "DEV_AUTOPILOT_LLM_REVIEW_ENABLED",
                                                "DEV_AUTOPILOT_USE_JOB","DEV_AUTOPILOT_JOB_CLOUD",
                                                "DEV_AUTOPILOT_WATCHER_LIVE",
                                                "OPERATOR_PLANNER_ENABLED",
                                                "OPERATOR_VTID_SELF_ALLOCATE_ENABLED","OPERATOR_PR_APPROVAL_REQUIRED",
                                                "OPERATOR_THREADS_ENABLED","OPERATOR_TURN_MEMORY_ENABLED",
                                                "REMINDERS_INPROCESS_DISPATCH_ENABLED","CALENDAR_DEFAULT_REMINDERS_ENABLED",
                                                "OPERATOR_SQL_READONLY_ENABLED",
                                                "OPERATOR_MACHINE_AUTH_ENABLED",
                                                "BEDROCK_ROLE_ARN","AWS_BEDROCK_REGION",
                                                "AURORA_CA_BUNDLE_PATH",
                                                "GOOGLE_CLOUD_PROJECT","VERTEX_AI_LOCATION",
                                                "VERTEX_SERBIAN_BRIDGE_ENABLED",
                                                "GCP_SERVICE_ACCOUNT_JSON",
                                                "OPERATOR_CODEINTEL_ENABLED",
                                                "DEV_AUTOPILOT_SCAN_TOKEN",
                                                "DEV_AUTOPILOT_EXECUTOR","DEV_AUTOPILOT_PR_APPROVAL_REQUIRED",
                                                "CODEINTEL_PLATFORM_REPO_DIR","CODEINTEL_V1_REPO_DIR",
                                                "NAV_CONTINUATION_BIND") | not) ]
                      + [ {name:"GIT_COMMIT_SHA", value:$SHA},
                          {name:"COMMIT_SHA", value:$SHA},
                          {name:"BUILD_INFO_MARKER", value:$SHORT},
                          {name:"NOVA_SONIC_ENABLED", value:$NOVA_ENABLED},
                          {name:"NOVA_SONIC_REGION", value:"eu-north-1"},
                          {name:"NOVA_SONIC_MODEL_ID", value:"amazon.nova-2-sonic-v1:0"},
                          {name:"NOVA_SONIC_CANARY_USER_IDS", value:$NOVA_USERS},
                          {name:"NOVA_SONIC_CANARY_TENANT_IDS", value:$NOVA_TENANTS},
                          {name:"FEATURE_ORB_GREETING_TTS_BRIDGE_ENV", value:"staging-only"},
                          {name:"FEATURE_ORB_SAFE_FAST_GREETING_ENV", value:"staging-only"},
                          {name:"FEATURE_LATENCY_TELEMETRY_ENV", value:"staging-only"},
                          {name:"FEATURE_ORB_FAST_START_ENV", value:"staging+prod"},
                          {name:"FEATURE_ORB_BRAIN_CACHE_ENV", value:"staging+prod"},
                          {name:"FEATURE_ORB_NOVA_PREWARM_ENV", value:"staging-only"},
                          {name:"FEATURE_ORB_WS_TRANSPORT_ENV", value:"staging-only"},
                          {name:"ORB_FULL_DUPLEX_ENABLED", value:"true"},
                          {name:"ORB_DAY_CLOSE_RUNG_ENABLED", value:"true"},
                          {name:"ORB_LOG_NOVA_INSTRUCTION_DEBUG", value:"true"},
                          {name:"NAV_CONTINUATION_BIND", value:"true"},
                          {name:"TTS_PROVIDER", value:"polly"},
                          {name:"TTS_POLLY_STRICT", value:"true"},
                          {name:"TTS_FISH_FALLBACK_ENABLED", value:"true"},
                          {name:"VERTEX_LIVE_UNAVAILABLE", value:"true"},
                          {name:"ORB_CASCADED_VOICE_ENABLED", value:"true"},
                          {name:"OPERATOR_EXECUTION_ONRAMP_ENABLED", value:"true"},
                          {name:"OPERATOR_ONRAMP_EXECUTOR", value:"agent"},
                          {name:"OPERATOR_CODEBASE_READ_ENABLED", value:"true"},
                          {name:"OPERATOR_DB_READONLY_ENABLED", value:"true"},
                          {name:"OPERATOR_AWS_READONLY_ENABLED", value:"true"},
                          {name:"OPERATOR_BOOTSTRAP_PACK_ENABLED", value:"true"},
                          {name:"OPERATOR_BOOTSTRAP_BUILD_INFO_URLS", value:"staging=https://preview-aws-gateway.vitanaland.com/api/v1/admin/build-info,prod=https://gateway.vitanaland.com/api/v1/admin/build-info"},
                          {name:"DEV_AUTOPILOT_LLM_REVIEW_ENABLED", value:"true"},
                          {name:"DEV_AUTOPILOT_USE_JOB", value:"true"},
                          {name:"DEV_AUTOPILOT_JOB_CLOUD", value:"aws"},
                          {name:"DEV_AUTOPILOT_WATCHER_LIVE", value:"true"},
                          {name:"DEV_AUTOPILOT_EXECUTOR", value:"agent"},
                          {name:"DEV_AUTOPILOT_PR_APPROVAL_REQUIRED", value:"true"},
                          {name:"OPERATOR_PLANNER_ENABLED", value:"true"},
                          {name:"OPERATOR_VTID_SELF_ALLOCATE_ENABLED", value:"true"},
                          {name:"OPERATOR_PR_APPROVAL_REQUIRED", value:"true"},
                          {name:"OPERATOR_THREADS_ENABLED", value:"true"},
                          {name:"OPERATOR_TURN_MEMORY_ENABLED", value:"true"},
                          {name:"REMINDERS_INPROCESS_DISPATCH_ENABLED", value:"true"},
                          {name:"CALENDAR_DEFAULT_REMINDERS_ENABLED", value:"true"},
                          {name:"BEDROCK_ROLE_ARN", value:$TASK_ROLE},
                          {name:"AWS_BEDROCK_REGION", value:"eu-central-1"},
                          {name:"AURORA_CA_BUNDLE_PATH", value:"/app/certs/rds-combined-ca-bundle.pem"},
                          {name:"GOOGLE_CLOUD_PROJECT", value:"project-da3eb05a-c86e-47cb-85f"},
                          {name:"VERTEX_AI_LOCATION", value:"global"},
                          {name:"VERTEX_SERBIAN_BRIDGE_ENABLED", value:"true"},
                          {name:"GCP_SERVICE_ACCOUNT_JSON", value:$GCP_CRED_CONFIG},
                          {name:"OPERATOR_CODEINTEL_ENABLED", value:"true"},
                          {name:"CODEINTEL_PLATFORM_REPO_DIR", value:"/repo-platform"},
                          {name:"CODEINTEL_V1_REPO_DIR", value:"/repo-vitana-v1"},
                          {name:"DEV_AUTOPILOT_SCAN_TOKEN", value:$SCAN_TOKEN} ] )
                | .containerDefinitions[0].secrets |=
                    ( [ .[] | select(.name | IN("SUPABASE_JWT_SECRET","SUPABASE_ANON_KEY","GATEWAY_SERVICE_TOKEN","GATEWAY_INTERNAL_TOKEN",
                                                "GOOGLE_GEMINI_API_KEY","GEMINI_API_KEY",
                                                "OPENAI_API_KEY","DEEPSEEK_API_KEY","FISH_API_KEY",
                                                "AURORA_DATABASE_URL",
                                                "AURORA_RLS_DATABASE_URL",
                                                "GITHUB_SAFE_MERGE_TOKEN","OPERATOR_SQL_READONLY_DATABASE_URL",
                                                "OPERATOR_MACHINE_AUTH_TOKEN",
                                                "GCP_SERVICE_ACCOUNT_JSON") | not) ]
                      + [ {name:"SUPABASE_JWT_SECRET",   valueFrom:$SEC_JWT},
                          {name:"SUPABASE_ANON_KEY",     valueFrom:$SEC_ANON},
                          {name:"GOOGLE_GEMINI_API_KEY", valueFrom:$SEC_GEMINI},
                          {name:"GEMINI_API_KEY",        valueFrom:$SEC_GEMINI},
                          {name:"OPENAI_API_KEY",        valueFrom:$SEC_OPENAI},
                          {name:"DEEPSEEK_API_KEY",      valueFrom:$SEC_DEEPSEEK},
                          {name:"FISH_API_KEY",          valueFrom:$SEC_FISH},
                          {name:"AURORA_DATABASE_URL",   valueFrom:$SEC_AURORA},
                          {name:"AURORA_RLS_DATABASE_URL", valueFrom:$SEC_AURORA_RLS},
                          {name:"GITHUB_SAFE_MERGE_TOKEN", valueFrom:$SEC_GITHUB_TOKEN},
                          {name:"GATEWAY_SERVICE_TOKEN", valueFrom:$SEC_SERVICE_TOKEN} ] )
                | ( if $SEC_INTERNAL_TOKEN != "" then
                      ( .containerDefinitions[0].secrets |=
                          ( [ .[] | select(.name | IN("GATEWAY_INTERNAL_TOKEN") | not) ]
                            + [ {name:"GATEWAY_INTERNAL_TOKEN", valueFrom:$SEC_INTERNAL_TOKEN} ] ) )
                    else . end )
                | ( if $SEC_ERP_BRIDGE != "" then
                      ( .containerDefinitions[0].environment |=
                          ( [ .[] | select(.name | IN("ERP_BRIDGE_URL") | not) ]
                            + [ {name:"ERP_BRIDGE_URL", value:$ERP_BRIDGE_URL} ] )
                      | .containerDefinitions[0].secrets |=
                          ( [ .[] | select(.name | IN("ERP_BRIDGE_TOKEN") | not) ]
                            + [ {name:"ERP_BRIDGE_TOKEN", valueFrom:$SEC_ERP_BRIDGE} ] ) )
                    else . end )
                | ( if $SEC_SQL_RO != "" then
                      ( .containerDefinitions[0].environment |=
                          ( [ .[] | select(.name | IN("OPERATOR_SQL_READONLY_ENABLED") | not) ]
                            + [ {name:"OPERATOR_SQL_READONLY_ENABLED", value:"true"} ] )
                      | .containerDefinitions[0].secrets |=
                          ( [ .[] | select(.name | IN("OPERATOR_SQL_READONLY_DATABASE_URL") | not) ]
                            + [ {name:"OPERATOR_SQL_READONLY_DATABASE_URL", valueFrom:$SEC_SQL_RO} ] ) )
                    else . end )
                | ( if $SEC_MACHINE_AUTH != "" then
                      ( .containerDefinitions[0].environment |=
                          ( [ .[] | select(.name | IN("OPERATOR_MACHINE_AUTH_ENABLED") | not) ]
                            + [ {name:"OPERATOR_MACHINE_AUTH_ENABLED", value:"true"} ] )
                      | .containerDefinitions[0].secrets |=
                          ( [ .[] | select(.name | IN("OPERATOR_MACHINE_AUTH_TOKEN") | not) ]
                            + [ {name:"OPERATOR_MACHINE_AUTH_TOKEN", valueFrom:$SEC_MACHINE_AUTH} ] ) )
                    else . end )
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $NEW_ARN"
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$NEW_ARN" >/dev/null
          echo "Waiting for service to stabilize (up to ~10 min)…"
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}"
          echo "Service stable on $NEW_ARN"
      # VTID-04314: a timed-out `services-stable` waiter says nothing about WHY.
      # From 2026-09-22 22:21 UTC seven consecutive deploys died that way with
      # byte-identical build and secret output to the last green run, while
      # staging kept serving the old build. Print the rollout state, the latest
      # service events and the stop reason of the most recent stopped tasks so
      # the failure names its own cause in the job log. Read-only, best-effort.
      - name: Diagnose failed rollout (service events + stopped tasks)
        if: failure() && steps.roll.outcome == 'failure'
        run: |
          set +e
          C="${{ env.ECS_CLUSTER }}"; S="${{ env.ECS_SERVICE }}"
          echo "== deployments"
          aws ecs describe-services --cluster "$C" --services "$S" \
            --query 'services[0].deployments[].{status:status,rollout:rolloutState,reason:rolloutStateReason,td:taskDefinition,desired:desiredCount,running:runningCount,pending:pendingCount,failed:failedTasks}' \
            --output table
          echo "== latest service events"
          aws ecs describe-services --cluster "$C" --services "$S" \
            --query 'services[0].events[:15].[createdAt,message]' --output text
          echo "== most recent stopped tasks"
          ARNS=$(aws ecs list-tasks --cluster "$C" --service-name "$S" --desired-status STOPPED \
            --query 'taskArns[:5]' --output text | tr '\t' ' ' | sed 's/None//g')
          if [ -n "${ARNS// /}" ]; then
            aws ecs describe-tasks --cluster "$C" --tasks $ARNS \
              --query 'tasks[].{td:taskDefinitionArn,stopCode:stopCode,stopped:stoppedReason,health:healthStatus,exit:containers[0].exitCode,why:containers[0].reason}' \
              --output json
          else
            echo "(no stopped tasks listed)"
          fi
          exit 0
      - name: Smoke — env=staging + deployed commit live
        run: |
          set -e
          URL="${{ env.GATEWAY_URL }}"
          SHA="${{ steps.commit.outputs.sha }}"
          for i in 1 2 3 4 5 6; do
            HEALTH=$(curl -fsS "$URL/api/v1/admin/health" 2>/dev/null || echo '')
            BUILD=$(curl -fsS "$URL/api/v1/admin/build-info" 2>/dev/null || echo '')
            ENV=$(echo "$HEALTH" | jq -r '.env // empty')
            COMMIT=$(echo "$BUILD" | jq -r '.git_commit // empty')
            if [ "$ENV" = "staging" ] && [ "$COMMIT" = "$SHA" ]; then
              echo "✓ env=staging, git_commit=$COMMIT"
              exit 0
            fi
            echo "Attempt $i: env='$ENV' commit='$COMMIT' (want staging/$SHA) — retry in 15s"
            sleep 15
          done
          echo "::error::Smoke failed — health/build-info did not report env=staging with the deployed commit"
          exit 1

      - name: Smoke — Nova Sonic health surface present
        run: |
          set -e
          URL="${{ env.GATEWAY_URL }}"
          NOVA=$(curl -fsS "$URL/api/v1/orb/nova-sonic/health")
          echo "$NOVA" | jq .
          REGION=$(echo "$NOVA" | jq -r '.region // empty')
          MODEL=$(echo "$NOVA" | jq -r '.model // empty')
          if [ "$REGION" != "eu-north-1" ] || [ "$MODEL" != "amazon.nova-2-sonic-v1:0" ]; then
            echo "::error::Nova health reports region='$REGION' model='$MODEL' — expected eu-north-1 / amazon.nova-2-sonic-v1:0"
            exit 1
          fi
          echo "✓ Nova Sonic health: enabled=$(echo "$NOVA" | jq -r '.enabled') ready=$(echo "$NOVA" | jq -r '.ready') canary_users=$(echo "$NOVA" | jq -r '.canary_user_count')"

      - name: Emit OASIS event + software_versions row (best-effort)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SVC: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SHA: ${{ steps.commit.outputs.sha }}
          SHORT: ${{ steps.commit.outputs.short }}
          OUTCOME: ${{ job.status }}
        run: |
          set +e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SVC" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE repo secrets not set — skipping OASIS/CLOCK emission (deploy itself unaffected)."
            exit 0
          fi
          STATUS=$([ "$OUTCOME" = "success" ] && echo success || echo error)
          TOPIC=$([ "$OUTCOME" = "success" ] && echo staging.deploy.completed || echo staging.deploy.failed)
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/software_versions" \
            -H "Content-Type: application/json" -H "apikey: $SUPABASE_SVC" \
            -H "Authorization: Bearer $SUPABASE_SVC" -H "Prefer: return=minimal" \
            -d "$(jq -nc --arg sha "$SHA" --arg st "$STATUS" \
              '{service:"vitana-gateway-aws", git_commit:$sha, deploy_type:"normal", initiator:"agent", status:$st, environment:"staging"}')" \
            || echo "::warning::software_versions insert failed; continuing."
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/oasis_events" \
            -H "Content-Type: application/json" -H "apikey: $SUPABASE_SVC" \
            -H "Authorization: Bearer $SUPABASE_SVC" -H "Prefer: return=minimal" \
            -d "$(jq -nc --arg sha "$SHA" --arg short "$SHORT" --arg st "$STATUS" --arg topic "$TOPIC" '{
              vtid: "BOOTSTRAP-AWS-STAGE-DEPLOY",
              topic: $topic,
              service: "vitana-gateway-aws",
              role: "CICD",
              model: "aws-stage-deploy",
              status: $st,
              message: ("AWS-STAGE-DEPLOY-GATEWAY: " + $short),
              metadata: { env: "staging", platform: "aws-ecs", git_commit: $sha, workflow: "AWS-STAGE-DEPLOY-GATEWAY.yml" }
            }')" || echo "::warning::oasis_events insert failed; continuing."

      - name: Summary
        if: success()
        run: |
          {
            echo "## AWS staging gateway deploy"
            echo "- Image: \`${{ steps.build.outputs.image }}\`"
            echo "- Commit: \`${{ steps.commit.outputs.sha }}\`"
            echo "- Verified live at: ${{ env.GATEWAY_URL }}"
            echo "- Reason: ${{ env.DEPLOY_REASON }}"
          } >> "$GITHUB_STEP_SUMMARY"
