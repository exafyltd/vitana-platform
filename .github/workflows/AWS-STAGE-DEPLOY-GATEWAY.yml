# AWS-STAGE-DEPLOY-GATEWAY — build the gateway from `main`, push to ECR,
# and roll the ECS service on the AWS staging stack.
#
# AWS twin of STAGE-DEPLOY.yml (which deploys gateway-staging on GCP Cloud
# Run). Written as part of taking full ownership of the AWS environment
# after the migration-team handover (BOOTSTRAP-AWS-STAGING-VALIDATION).
#
# Design choices:
# - The existing task definition is PRESERVED: only the container image and
#   the commit-stamp env vars (GIT_COMMIT_SHA / COMMIT_SHA /
#   BUILD_INFO_MARKER) are replaced. Env vars and secrets bound on the task
#   def (VITANA_ENV, feature flags, SUPABASE_JWT_SECRET, …) carry forward —
#   the task def is the AWS analogue of STAGE-DEPLOY.yml's authoritative
#   ENV_VARS block, so this workflow does not re-declare it.
# - Smoke gate mirrors STAGE-DEPLOY.yml: /api/v1/admin/health must report
#   env=staging AND /api/v1/admin/build-info must report the deployed
#   commit — otherwise the job fails loudly (CLAUDE.md §15).
# - OASIS event + software_versions row are emitted best-effort via
#   Supabase REST when SUPABASE_URL / SUPABASE_SERVICE_ROLE repo secrets
#   exist, so the Command Hub CLOCK history sees AWS staging deploys.
#
# Required repository secrets:
#   AWS_STAGING_ACCESS_KEY_ID / AWS_STAGING_SECRET_ACCESS_KEY
#   (IAM user claude-staging-validation — ECR push + ECS update)
# Optional repository secrets (for OASIS/CLOCK visibility):
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE

name: AWS Stage Deploy Gateway (ECS)

on:
  push:
    branches: [main]
    paths:
      - 'services/gateway/**'
      - '.github/workflows/AWS-STAGE-DEPLOY-GATEWAY.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this AWS staging gateway deploy'
        required: false
        default: 'manual deploy'
      gateway_url:
        description: 'Public gateway URL for post-deploy verification'
        required: false
        default: 'https://preview-aws-gateway.vitanaland.com'
      # BOOTSTRAP-NOVA-SONIC-VOICE: per-dispatch canary overrides. Empty =
      # fall back to the AWS_STAGE_NOVA_SONIC_* repository variables, so the
      # push-triggered deploys keep reading the durable vars config.
      nova_sonic_enabled:
        description: 'Override NOVA_SONIC_ENABLED for this deploy (true/false; empty = use repo var)'
        required: false
        default: ''
      nova_canary_user_ids:
        description: 'Override Nova canary user UUID allowlist (comma-separated; empty = use repo var)'
        required: false
        default: ''
      nova_canary_tenant_ids:
        description: 'Override Nova canary tenant UUID allowlist (comma-separated; empty = use repo var)'
        required: false
        default: ''
      aws_region:
        description: 'AWS region'
        required: false
        default: 'eu-central-1'
      ecr_repository:
        description: 'ECR repository name for the gateway image'
        required: false
        default: 'vitana/gateway'
      ecs_cluster:
        description: 'ECS cluster name'
        required: false
        default: 'Vitana-ECS-Cluster'
      ecs_service:
        description: 'ECS service name'
        required: false
        default: 'vitana-gateway'

permissions:
  contents: read

concurrency:
  group: aws-stage-deploy-gateway
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    # On push events the dispatch inputs are empty — resolve every target
    # here with the staging defaults so auto-deploys and manual dispatches
    # share one code path.
    env:
      GATEWAY_URL: ${{ inputs.gateway_url || 'https://preview-aws-gateway.vitanaland.com' }}
      TARGET_AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
      ECR_REPOSITORY: ${{ inputs.ecr_repository || 'vitana/gateway' }}
      ECS_CLUSTER: ${{ inputs.ecs_cluster || 'Vitana-ECS-Cluster' }}
      ECS_SERVICE: ${{ inputs.ecs_service || 'vitana-gateway' }}
      DEPLOY_REASON: ${{ inputs.reason || format('auto-deploy on push to main ({0})', github.event.head_commit.message && 'push' || 'dispatch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # VTID-04118 — full history, not the default shallow clone, so the
          # codeintel staging step below can give RepoWise real git-tier
          # data for this repo (bug-fix/churn history, not just a snapshot).
          fetch-depth: 0

      - name: Checkout vitana-v1 (read-only, for codeintel indexing)
        id: checkout_v1
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: exafyltd/vitana-v1
          # Same secret name and same-repo/GITHUB_TOKEN fallback already
          # established by REGEN-SCREENS-CATALOG.yml for cross-repo reads —
          # reused here rather than inventing a second secret for the same
          # purpose. GITHUB_TOKEN alone cannot read a private sibling repo,
          # so without VITANA_V1_READ_TOKEN this step fails and the next
          # step's placeholder-directory fallback keeps the build going.
          token: ${{ secrets.VITANA_V1_READ_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0
          path: services/gateway/codeintel-src/vitana-v1

      - name: Stage codeintel source (VTID-04118 — RepoWise/Graphify image indexing)
        run: |
          set -e
          mkdir -p services/gateway/codeintel-src/platform
          # rsync this checkout (incl. .git) into the Docker build context,
          # excluding node_modules/build output and the staging dir itself
          # so it doesn't try to copy into its own destination.
          rsync -a --exclude='node_modules' --exclude='services/gateway/codeintel-src' \
            --exclude='services/gateway/dist' --exclude='**/dist/**' \
            ./ services/gateway/codeintel-src/platform/
          if [ -d services/gateway/codeintel-src/vitana-v1/.git ]; then
            echo "vitana-v1 checked out — de-bloating node_modules before it enters the Docker build context"
            find services/gateway/codeintel-src/vitana-v1 -maxdepth 4 -type d -name node_modules -prune -exec rm -rf {} +
          else
            echo "vitana-v1 checkout unavailable (VITANA_V1_READ_TOKEN missing/failed) — leaving an empty placeholder so the Dockerfile COPY never fails"
            mkdir -p services/gateway/codeintel-src/vitana-v1
          fi

      - name: Resolve commit metadata + refresh BUILD_INFO
        id: commit
        run: |
          SHORT="$(git rev-parse --short=12 HEAD)"
          {
            echo "sha=$GITHUB_SHA"
            echo "short=$SHORT"
          } >> "$GITHUB_OUTPUT"
          # The gateway Dockerfile COPYs BUILD_INFO into the image; refresh
          # it so the baked file reflects this build, not the last commit
          # that happened to touch it.
          {
            echo "$GITHUB_SHA"
            echo "Build: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > services/gateway/BUILD_INFO

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_STAGING_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_STAGING_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TARGET_AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Preflight — verify ECR repo + ECS service exist
        run: |
          set -e
          if ! aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1; then
            echo "::error::ECR repository '${{ env.ECR_REPOSITORY }}' not found. Available repositories:"
            aws ecr describe-repositories --query 'repositories[].repositoryName' --output table
            exit 1
          fi
          if ! aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
               --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "::error::ECS service '${{ env.ECS_SERVICE }}' not ACTIVE in cluster '${{ env.ECS_CLUSTER }}'. Services:"
            aws ecs list-services --cluster "${{ env.ECS_CLUSTER }}" --output table
            exit 1
          fi

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -e
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.commit.outputs.short }}"
          docker build -t "$IMAGE" -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:staging-latest" services/gateway
          docker push "$IMAGE"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:staging-latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE"

      - name: Register task-definition revision + roll the service
        id: roll
        env:
          # BOOTSTRAP-NOVA-SONIC-VOICE: Nova canary configuration prefers
          # environment-scoped repository VARIABLES when set (not secrets —
          # nothing here is secret; credentials are the ECS task role), but
          # the FALLBACK is now the canary hardcoded below (2026-07-28) —
          # not 'false'/empty. Repo variables were never actually set, so
          # every push-triggered deploy from an unrelated team's merge (this
          # workflow has no path filter — ANY push to main runs it) reset
          # Nova to disabled, over and over, requiring a manual
          # workflow_dispatch re-enable each time. That is no longer
          # tolerable operationally. If AWS_STAGE_NOVA_SONIC_ENABLED /
          # AWS_STAGE_NOVA_SONIC_CANARY_USER_IDS repo variables are ever
          # set, they still win (checked first) — this only changes what
          # happens when they are absent. To roll back to fully disabled,
          # dispatch manually with nova_sonic_enabled=false, or set the
          # repo variable explicitly to 'false'.
          #
          # BOOTSTRAP-NOVA-SONIC-VOICE (2026-07-29): expanded from the
          # 4-user canary to the internal "vitana" dev tenant
          # (00000000-0000-0000-0000-000000000001, DEV_IDENTITY.TENANT_ID)
          # for the runbook's next step (docs/NOVA-SONIC-CANARY-RUNBOOK.md
          # §6: "one internal tenant -> observe one working day"). The 4
          # individual canary users stay allowlisted too (harmless overlap
          # -- both checks are independent `.has()` lookups).
          NOVA_SONIC_ENABLED: ${{ inputs.nova_sonic_enabled || vars.AWS_STAGE_NOVA_SONIC_ENABLED || 'true' }}
          NOVA_SONIC_CANARY_USER_IDS: ${{ inputs.nova_canary_user_ids || vars.AWS_STAGE_NOVA_SONIC_CANARY_USER_IDS || 'a27552a3-0257-4305-8ed0-351a80fd3701,c5a4daf9-190a-4a9e-9638-d6b32f85244a,a2c6ba7e-2ad4-48af-8253-9fe34d0f9232,0adc6ff6-acb0-4dca-99d0-295211a40e3e' }}
          NOVA_SONIC_CANARY_TENANT_IDS: ${{ inputs.nova_canary_tenant_ids || vars.AWS_STAGE_NOVA_SONIC_CANARY_TENANT_IDS || '00000000-0000-0000-0000-000000000001' }}
          # VTID-04225: the CI scan token DEV-AUTOPILOT.yml sends as
          # X-DevAutopilot-Scan-Token. Read off the live task def 2026-09-21:
          # NEITHER gateway task def carried DEV_AUTOPILOT_SCAN_TOKEN, so
          # routes/dev-autopilot.ts's requireScanToken rejected every scan
          # post ("DEV_AUTOPILOT_SCAN_TOKEN not set — rejecting all scan
          # posts") even before the dead GCP URL made the question moot. Same
          # repo secret the workflow uses; plain env var on the task def, the
          # MARKETPLACE_SYNC_SECRET precedent on the prod workflow.
          DEV_AUTOPILOT_SCAN_TOKEN_VALUE: ${{ secrets.DEV_AUTOPILOT_SCAN_TOKEN }}
        # NOTE (VTID-03788): the comments below were relocated OUT of the run:
        # script below. That block's run: value had grown to 25,111 characters
        # (only ~7,400 of it is actual bash -- the rest was accumulated comments),
        # and GitHub Actions hard-rejects a workflow file whose run: value exceeds
        # its internal expression-length limit ("Invalid workflow file: ...
        # Exceeded max expression length 21000") -- confirmed live via the real
        # Actions API (workflow_dispatch), not assumed: every push/dispatch of
        # this workflow failed with 0 jobs from the moment this step crossed
        # that boundary. Comments are bash no-ops wherever they live, so moving
        # them here (a plain YAML comment, outside the run: block scalar) is a
        # pure relocation -- nothing lost, nothing below changes what runs.
        # Original relative order preserved.
        #
        # Swap image + re-stamp commit env vars; preserve everything else
        # (env block, secrets, resources). upsert semantics for the three
        # stamp vars so first-run task defs without them still work.
        # BOOTSTRAP-NOVA-SONIC-VOICE: the five Nova vars are upserted on
        # EVERY deploy so a canary flip (or rollback to disabled/empty) is
        # exactly one variable change + one dispatch. Never AWS access keys
        # here — Nova auth is the task role via the SDK default chain.
        #
        # BOOTSTRAP-NOVA-SONIC-VOICE / VTID-04100:
        # FEATURE_ORB_GREETING_TTS_BRIDGE_ENV was upserted to "off" on
        # 2026-07-28, rejected on PRODUCT grounds, not technical ones: the
        # bridge phrase is synthesized by a different engine from the live
        # upstream, so the user hears one voice say the filler and another
        # voice continue. That objection has NOT gone away — the bridge is
        # Polly now rather than Cloud TTS, and Polly is still not a Nova
        # Sonic voice.
        #
        # It is set to "staging-only" here so the trade can be HEARD and
        # decided on evidence, because the measured cost of not having it is
        # large: on staging 2026-09-19, authenticated `de`, first MODEL audio
        # was p50 ~2.5-3.0s and p90 up to 7.5s, while a bridge frame lands in
        # the time it takes to write one SSE event. VTID-04100 also made the
        # bridge cached and its pre-connect await bounded, so the mechanism no
        # longer costs a Polly round trip per session and can no longer stall
        # a connect the way VTID-03802 did.
        #
        # PROD IS DELIBERATELY NOT CHANGED. Reversing a recorded product
        # decision for every real user is the platform owner's call, not a
        # side effect of a latency VTID. Listen on preview-aws first; if the
        # voice change is acceptable, promote by pinning the same value on
        # AWS-PROD-DEPLOY-GATEWAY.yml. If it is not, set this back to "off"
        # and the measured win has to come from the directive and tool-catalog
        # budgets (VTID-04096/04097) alone.
        #
        # VTID-03646 follow-up -- FEATURE_ORB_SAFE_FAST_GREETING_ENV is
        # upserted to "staging-only" below. Checked live in this repo: it
        # is set on neither AWS gateway task def (only the dead GCP
        # STAGE-DEPLOY.yml ever set it), so the whole greeting-facts
        # prefetch this flag gates -- first name, last-session info,
        # lastFullBriefingDate, lastDayCloseDate, recentNbaKeys, the
        # proactive line -- has been dead on AWS staging AND prod both,
        # not staging-only as VTID-03646's own PR body assumed. Wiring it
        # here, staging only, on purpose -- this repo's prod lever is a
        # deliberate separate action (PUBLISH / manual dispatch, see
        # AWS-PROD-DEPLOY-GATEWAY.yml), never a side effect of a push, and
        # this workflow only ever runs on push.
        #
        # VTID-03513: resolve the FULL secret ARNs before rewriting the task
        # definition. ECS `valueFrom` requires the complete ARN INCLUDING the
        # six-character random suffix Secrets Manager appends
        # (…jwt-secret-AbCdEf). A name-only ARN is accepted by the CLI's
        # --secret-id but NOT by ECS, which reports it as
        # ResourceNotFoundException — indistinguishable at a glance from a
        # secret that genuinely does not exist. Constructing these by string
        # concatenation is therefore wrong; they must be looked up.
        #
        # `describe-secret` also fails the job loudly if a secret is missing,
        # which is strictly better than registering a task def that cannot
        # start and discovering it 10 minutes later via a stabilise timeout.
        # VTID-03773 — SEC_AURORA resolves the SAME Secrets Manager entry
        # oasis-projector already uses in production (vitana/aurora/prod/
        # database-url), wired here so the gateway can open a connection
        # too. Staging only, on purpose: this is Phase 0 of the memory-
        # system rebuild — a connectivity check, nothing reads or writes
        # through it yet (see routes/admin-aurora-memory-health.ts). No new
        # credential is created; this only grants the STAGING task the
        # ability to resolve a secret ARN it did not reference before.
        # VTID-03513: the `secrets` block is now UPSERTED here, not cloned
        # blindly from the previous task definition.
        #
        # WHY. This deploy mutates the previous task def in place, so whatever
        # `secrets` it carried got copied forward on every run — including a
        # wrong one. Between 2026-08-02 and 2026-08-06 six entries pointed at
        # `vitana/gateway/prod/*`, a namespace that does not exist in Secrets
        # Manager (the real ones are `vitana/supabase/prod/*` and
        # `vitana/gateway/staging/*`). ECS cannot start a task whose secret it
        # cannot fetch, so every deploy died with
        #   ResourceInitializationError: ... ResourceNotFoundException
        # then `aws ecs wait services-stable` timed out after 10 min and the
        # job failed. NINE consecutive deploys failed that way and AWS staging
        # served 503 for four days. Nothing alarmed, because the workflow
        # failing red *is* the only signal and nobody was reading it.
        #
        # The reference was invisible in code review: task-def secret wiring
        # lived ONLY in live AWS state, never in this repo. Pinning it here
        # makes it reviewable, and makes a bad hand-edit self-correcting on the
        # next deploy instead of permanent.
        #
        # SUPABASE_JWT_SECRET / SUPABASE_ANON_KEY deliberately point at
        # `vitana/supabase/prod/*` — the same secrets prod uses — because AWS
        # staging talks to the PROD Supabase project (see SUPABASE_URL and
        # SUPABASE_SERVICE_ROLE, which already do). A JWT secret from a
        # different project would fail to validate those tokens: the deploy
        # would go green and every login would break. Verified 2026-08-06 that
        # `vitana/gateway/staging/supabase-jwt-secret` holds an identical
        # value (sha256 match), so this is consistent either way.
        #
        # NOTE: comments inside the jq program string below (the single
        # quoted block starting on the next line) must never contain an
        # apostrophe -- it is bash single-quoted, so a stray "'" closes
        # the string early and breaks the whole command (bit us once,
        # see PR #2978's failed AWS deploy run).
        #
        # That applies to jq COMMENTS too, which is why the note below lives
        # out here rather than beside the pair it describes: a `#` comment
        # inside the program is still inside the shell's single-quoted
        # string, so one apostrophe in a word like "isn't" silently ends the
        # program 20 lines early. Keep the jq body free of prose.
        #
        # VTID-03578 — TTS_PROVIDER=polly, AWS STAGING ONLY, so the switch is
        # exercised somewhere real before it reaches prod.
        #
        # Deliberately NOT set in STAGE-DEPLOY.yml (GCP Cloud Run staging):
        # Polly authenticates through the ECS task role and a Cloud Run
        # instance carries no AWS credentials at all, so every call there
        # would throw, return null, and fall back to Google. That looks like
        # "Polly is broken" when the truth is "Polly was never reachable from
        # that host" — a test that teaches the wrong lesson is worse than no
        # test.
        #
        # Requires polly:SynthesizeSpeech on the gateway task role. Without
        # it, synthesis still succeeds via the Google fallback and logs
        # `[TTS] FALLBACK polly→google` — grep that line to tell a missing
        # IAM grant apart from a working switch, because the user-visible
        # behaviour is identical either way.
        # VTID-03708 — VERTEX_LIVE_UNAVAILABLE + TTS_POLLY_STRICT on
        # STAGING, upserted below.
        #
        # Live task-def audit (read-only aws ecs describe-task-definition,
        # 2026-08-23) found VERTEX_LIVE_UNAVAILABLE unset here while prod
        # already carries it true. That is not a cosmetic gap: with the
        # flag unset, the selector still believes Vertex is a live
        # fallback, so the VTID-03703 fix never actually engages on
        # staging. Walk the real branch: for a Nova-unsupported language
        # (ru/pl/ar/zh), `if (languageBlocked and not vertexDead) return
        # {provider:vertex}` fires and returns BEFORE the cascade is ever
        # consulted -- vertexDead reads false here, so it returns vertex,
        # and Vertex is permanently dead (GCP shutdown). Those sessions die
        # with the exact upstream-1007 close VTID-03703 exists to prevent,
        # even though ORB_CASCADED_VOICE_ENABLED is already true here --
        # the cascade flag being on does nothing while this one is unset.
        #
        # VTID-03720 -- "ORB_CASCADED_VOICE_ENABLED is already true here"
        # was an observation of LIVE AWS STATE, not something this file
        # guaranteed. The var was in NEITHER the strip list NOR the re-add
        # list, so it was merely PRESERVED from whatever the previous task
        # definition happened to carry -- the exact shape VTID-03513 cost
        # four days for, and unverifiable from the repo. Reported live:
        # pl/pt still answered in English on staging for hours. That is the
        # cascade-off branch exactly -- `tryCascadeRescue()` returns null
        # unless the value is the string 'true', control falls to
        # `nova_forced_vertex_unavailable`, Nova is forced to carry a
        # language it cannot speak, and answers in English in a
        # language-flavoured voice (pt -> carolina, pl -> tina).
        #
        # It is now UPSERTED to "true" below, like every other var here, so
        # staging genuinely exercises Transcribe->Bedrock->Polly. Verified
        # by running the real decision functions: pl -> Ola/pl-PL,
        # pt -> Camila/pt-BR, ru/ar/zh all eligible; only sr is refused
        # (no_polly_voice, Polly has no Serbian voice in any engine).
        #
        # TTS_POLLY_STRICT was unset here too (prod has it true). Without
        # it an unservable TTS request tries to fall back to Google, which
        # no longer exists, instead of failing fast.
        #
        # VTID-03741 — FEATURE_ORB_FAST_START_ENV / FEATURE_ORB_BRAIN_CACHE_ENV,
        # pinned here to match AWS-PROD-DEPLOY-GATEWAY.yml.
        #
        # AWS-PROD-DEPLOY-GATEWAY.yml already pins both of these to the exact
        # string "staging+prod" (BOOTSTRAP-ORB-FASTSTART-DRIFT / VTID-03504) --
        # its own comment there records that FEATURE_ORB_FAST_START_ENV missing
        # measured a 9.5s cold authenticated start, past the widget 8s fetch
        # abort, and that FEATURE_ORB_BRAIN_CACHE_ENV missing measured a 2.0s
        # p50 brain build degrading to 17.4s p50 / 119.7s max under stacked
        # reconnects on 2026-08-05. Neither var was ever set anywhere in THIS
        # (staging) workflow -- confirmed by reading it, not assumed -- so
        # whatever the staging task def actually runs today is inherited from
        # whatever a manual edit or an earlier build happened to leave, exactly
        # the class of gap VTID-03513 cost four days for elsewhere in this
        # file. That prod comment also warns not to add a flag here without
        # first checking GET /api/v1/admin/feature-flags on the live stack --
        # this session has no AWS/admin credentials to do that read, so this
        # is deliberately NOT presented as a confirmed measurement the way the
        # prod entry is. The judgment call: these two flags are pure
        # deferral/caching mechanisms (they reorder and de-dupe existing
        # bootstrap work, they do not add new behaviour), already proven safe
        # in prod for weeks, and staging existing specifically to catch a
        # regression before prod makes leaving this undetermined the worse
        # risk, not the safer one -- especially for a VTID whose whole point
        # is reducing the exact click-to-first-audio delay this flag exists
        # to prevent. Pinning to the SAME value prod already runs, so staging
        # and prod stop being two different unverified guesses.
        #
        # VTID-03741 — FEATURE_LATENCY_TELEMETRY_ENV, STAGING ONLY.
        #
        # LatencyTracker (services/gateway/src/orb/live/latency-tracker.ts)
        # already exists and already marks the exact click-to-first-audio
        # breakdown this VTID needs a real baseline for (upstream_connected,
        # context_awaited, setup_sent, greeting_sent, audio_out_first_chunk),
        # emitted as voice.latency.measured OASIS events. It was never set on
        # either AWS gateway task def, so isFeatureLive resolves the code
        # default (off) and the tracker has been a no-op on staging and prod
        # both this whole time — the exact same shape as the
        # FEATURE_ORB_SAFE_FAST_GREETING gap two rows above. Turning it on
        # here, staging only, gives real per-session numbers to measure the
        # wake-brief-ranker parallelization (same VTID) against, instead of
        # relying on log-line spot checks.
        #
        # VTID-03580 — BEDROCK_ROLE_ARN on STAGING, so staging can verify the
        # thing it exists to verify.
        #
        # Measured 2026-08-11: this var was set on `vitana-gateway-awsdr`
        # (prod) and on NOTHING else. `bedrockAdapter.isAvailable()` is a bare
        # `Boolean(process.env.BEDROCK_ROLE_ARN)`, so with it unset the router
        # SKIPS bedrock and serves the stage's fallback — quietly, and with no
        # `llm.call.failed` event, because no call is ever attempted. Staging
        # was therefore answering every backend stage on DeepSeek while prod
        # answered on Claude, and the staging-first workflow (§16) would have
        # certified a Claude routing change it never once exercised.
        #
        # Both services already run as the SAME task role
        # (`vitana-ecs-task-role`), so this grants no new access — it only
        # stops staging pretending the adapter is unconfigured. Resolved from
        # the task definition rather than hardcoded, so it cannot drift from
        # whatever role the service actually assumes.
        # VTID-03773 -- AURORA_CA_BUNDLE_PATH points aurora-client.ts at the
        # RDS CA bundle baked into the image (Dockerfile), so the Aurora
        # connectivity check (routes/admin-aurora-memory-health.ts) gets a
