# AWS-STAGE-DEPLOY-GATEWAY — build the gateway from `main`, push to ECR,
# and roll the ECS service on the AWS staging stack.
#
# AWS twin of STAGE-DEPLOY.yml (which deploys gateway-staging on GCP Cloud
# Run). Written as part of taking full ownership of the AWS environment
# after the migration-team handover (BOOTSTRAP-AWS-STAGING-VALIDATION).
#
# Design choices:
# - The existing task definition is PRESERVED: only the container image and
#   the commit-stamp env vars (GIT_COMMIT_SHA / COMMIT_SHA /
#   BUILD_INFO_MARKER) are replaced. Env vars and secrets bound on the task
#   def (VITANA_ENV, feature flags, SUPABASE_JWT_SECRET, …) carry forward —
#   the task def is the AWS analogue of STAGE-DEPLOY.yml's authoritative
#   ENV_VARS block, so this workflow does not re-declare it.
# - Smoke gate mirrors STAGE-DEPLOY.yml: /api/v1/admin/health must report
#   env=staging AND /api/v1/admin/build-info must report the deployed
#   commit — otherwise the job fails loudly (CLAUDE.md §15).
# - OASIS event + software_versions row are emitted best-effort via
#   Supabase REST when SUPABASE_URL / SUPABASE_SERVICE_ROLE repo secrets
#   exist, so the Command Hub CLOCK history sees AWS staging deploys.
#
# Required repository secrets:
#   AWS_STAGING_ACCESS_KEY_ID / AWS_STAGING_SECRET_ACCESS_KEY
#   (IAM user claude-staging-validation — ECR push + ECS update)
# Optional repository secrets (for OASIS/CLOCK visibility):
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE

name: AWS Stage Deploy Gateway (ECS)

on:
  push:
    branches: [main]
    paths:
      - 'services/gateway/**'
      - '.github/workflows/AWS-STAGE-DEPLOY-GATEWAY.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this AWS staging gateway deploy'
        required: false
        default: 'manual deploy'
      gateway_url:
        description: 'Public gateway URL for post-deploy verification'
        required: false
        default: 'https://preview-aws-gateway.vitanaland.com'
      # BOOTSTRAP-NOVA-SONIC-VOICE: per-dispatch canary overrides. Empty =
      # fall back to the AWS_STAGE_NOVA_SONIC_* repository variables, so the
      # push-triggered deploys keep reading the durable vars config.
      nova_sonic_enabled:
        description: 'Override NOVA_SONIC_ENABLED for this deploy (true/false; empty = use repo var)'
        required: false
        default: ''
      nova_canary_user_ids:
        description: 'Override Nova canary user UUID allowlist (comma-separated; empty = use repo var)'
        required: false
        default: ''
      nova_canary_tenant_ids:
        description: 'Override Nova canary tenant UUID allowlist (comma-separated; empty = use repo var)'
        required: false
        default: ''
      aws_region:
        description: 'AWS region'
        required: false
        default: 'eu-central-1'
      ecr_repository:
        description: 'ECR repository name for the gateway image'
        required: false
        default: 'vitana/gateway'
      ecs_cluster:
        description: 'ECS cluster name'
        required: false
        default: 'Vitana-ECS-Cluster'
      ecs_service:
        description: 'ECS service name'
        required: false
        default: 'vitana-gateway'

permissions:
  contents: read

concurrency:
  group: aws-stage-deploy-gateway
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    # On push events the dispatch inputs are empty — resolve every target
    # here with the staging defaults so auto-deploys and manual dispatches
    # share one code path.
    env:
      GATEWAY_URL: ${{ inputs.gateway_url || 'https://preview-aws-gateway.vitanaland.com' }}
      TARGET_AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
      ECR_REPOSITORY: ${{ inputs.ecr_repository || 'vitana/gateway' }}
      ECS_CLUSTER: ${{ inputs.ecs_cluster || 'Vitana-ECS-Cluster' }}
      ECS_SERVICE: ${{ inputs.ecs_service || 'vitana-gateway' }}
      DEPLOY_REASON: ${{ inputs.reason || format('auto-deploy on push to main ({0})', github.event.head_commit.message && 'push' || 'dispatch') }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve commit metadata + refresh BUILD_INFO
        id: commit
        run: |
          SHORT="$(git rev-parse --short=12 HEAD)"
          {
            echo "sha=$GITHUB_SHA"
            echo "short=$SHORT"
          } >> "$GITHUB_OUTPUT"
          # The gateway Dockerfile COPYs BUILD_INFO into the image; refresh
          # it so the baked file reflects this build, not the last commit
          # that happened to touch it.
          {
            echo "$GITHUB_SHA"
            echo "Build: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > services/gateway/BUILD_INFO

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_STAGING_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_STAGING_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TARGET_AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Preflight — verify ECR repo + ECS service exist
        run: |
          set -e
          if ! aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1; then
            echo "::error::ECR repository '${{ env.ECR_REPOSITORY }}' not found. Available repositories:"
            aws ecr describe-repositories --query 'repositories[].repositoryName' --output table
            exit 1
          fi
          if ! aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
               --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "::error::ECS service '${{ env.ECS_SERVICE }}' not ACTIVE in cluster '${{ env.ECS_CLUSTER }}'. Services:"
            aws ecs list-services --cluster "${{ env.ECS_CLUSTER }}" --output table
            exit 1
          fi

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -e
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.commit.outputs.short }}"
          docker build -t "$IMAGE" -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:staging-latest" services/gateway
          docker push "$IMAGE"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:staging-latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE"

      - name: Register task-definition revision + roll the service
        env:
          # BOOTSTRAP-NOVA-SONIC-VOICE: Nova canary configuration prefers
          # environment-scoped repository VARIABLES when set (not secrets —
          # nothing here is secret; credentials are the ECS task role), but
          # the FALLBACK is now the canary hardcoded below (2026-07-28) —
          # not 'false'/empty. Repo variables were never actually set, so
          # every push-triggered deploy from an unrelated team's merge (this
          # workflow has no path filter — ANY push to main runs it) reset
          # Nova to disabled, over and over, requiring a manual
          # workflow_dispatch re-enable each time. That is no longer
          # tolerable operationally. If AWS_STAGE_NOVA_SONIC_ENABLED /
          # AWS_STAGE_NOVA_SONIC_CANARY_USER_IDS repo variables are ever
          # set, they still win (checked first) — this only changes what
          # happens when they are absent. To roll back to fully disabled,
          # dispatch manually with nova_sonic_enabled=false, or set the
          # repo variable explicitly to 'false'.
          #
          # BOOTSTRAP-NOVA-SONIC-VOICE (2026-07-29): expanded from the
          # 4-user canary to the internal "vitana" dev tenant
          # (00000000-0000-0000-0000-000000000001, DEV_IDENTITY.TENANT_ID)
          # for the runbook's next step (docs/NOVA-SONIC-CANARY-RUNBOOK.md
          # §6: "one internal tenant -> observe one working day"). The 4
          # individual canary users stay allowlisted too (harmless overlap
          # -- both checks are independent `.has()` lookups).
          NOVA_SONIC_ENABLED: ${{ inputs.nova_sonic_enabled || vars.AWS_STAGE_NOVA_SONIC_ENABLED || 'true' }}
          NOVA_SONIC_CANARY_USER_IDS: ${{ inputs.nova_canary_user_ids || vars.AWS_STAGE_NOVA_SONIC_CANARY_USER_IDS || 'a27552a3-0257-4305-8ed0-351a80fd3701,c5a4daf9-190a-4a9e-9638-d6b32f85244a,a2c6ba7e-2ad4-48af-8253-9fe34d0f9232,0adc6ff6-acb0-4dca-99d0-295211a40e3e' }}
          NOVA_SONIC_CANARY_TENANT_IDS: ${{ inputs.nova_canary_tenant_ids || vars.AWS_STAGE_NOVA_SONIC_CANARY_TENANT_IDS || '00000000-0000-0000-0000-000000000001' }}
        run: |
          set -e
          IMAGE="${{ steps.build.outputs.image }}"
          SHA="${{ steps.commit.outputs.sha }}"
          SHORT="${{ steps.commit.outputs.short }}"
          TD_ARN=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "Current task definition: $TD_ARN"
          # Swap image + re-stamp commit env vars; preserve everything else
          # (env block, secrets, resources). upsert semantics for the three
          # stamp vars so first-run task defs without them still work.
          # BOOTSTRAP-NOVA-SONIC-VOICE: the five Nova vars are upserted on
          # EVERY deploy so a canary flip (or rollback to disabled/empty) is
          # exactly one variable change + one dispatch. Never AWS access keys
          # here — Nova auth is the task role via the SDK default chain.
          #
          # BOOTSTRAP-NOVA-SONIC-VOICE: FEATURE_ORB_GREETING_TTS_BRIDGE_ENV
          # is upserted to "off" below (2026-07-28, disabled) -- rejected on
          # product grounds (voice mismatch: the Cloud TTS bridge phrase is
          # never the same voice as the live upstream). See STAGE-DEPLOY.yml
          # for the full rationale. Explicitly set to "off" (not removed) so
          # it cannot silently drift back to a stale "staging-only" value
          # left on the task definition from before.
          #
          # VTID-03513: the `secrets` block is now UPSERTED here, not cloned
          # blindly from the previous task definition.
          #
          # WHY. This deploy mutates the previous task def in place, so whatever
          # `secrets` it carried got copied forward on every run — including a
          # wrong one. Between 2026-08-02 and 2026-08-06 six entries pointed at
          # `vitana/gateway/prod/*`, a namespace that does not exist in Secrets
          # Manager (the real ones are `vitana/supabase/prod/*` and
          # `vitana/gateway/staging/*`). ECS cannot start a task whose secret it
          # cannot fetch, so every deploy died with
          #   ResourceInitializationError: ... ResourceNotFoundException
          # then `aws ecs wait services-stable` timed out after 10 min and the
          # job failed. NINE consecutive deploys failed that way and AWS staging
          # served 503 for four days. Nothing alarmed, because the workflow
          # failing red *is* the only signal and nobody was reading it.
          #
          # The reference was invisible in code review: task-def secret wiring
          # lived ONLY in live AWS state, never in this repo. Pinning it here
          # makes it reviewable, and makes a bad hand-edit self-correcting on the
          # next deploy instead of permanent.
          #
          # SUPABASE_JWT_SECRET / SUPABASE_ANON_KEY deliberately point at
          # `vitana/supabase/prod/*` — the same secrets prod uses — because AWS
          # staging talks to the PROD Supabase project (see SUPABASE_URL and
          # SUPABASE_SERVICE_ROLE, which already do). A JWT secret from a
          # different project would fail to validate those tokens: the deploy
          # would go green and every login would break. Verified 2026-08-06 that
          # `vitana/gateway/staging/supabase-jwt-secret` holds an identical
          # value (sha256 match), so this is consistent either way.
          #
          # NOTE: comments inside the jq program string below (the single
          # quoted block starting on the next line) must never contain an
          # apostrophe -- it is bash single-quoted, so a stray "'" closes
          # the string early and breaks the whole command (bit us once,
          # see PR #2978's failed AWS deploy run).
          NEW_DEF=$(aws ecs describe-task-definition --task-definition "$TD_ARN" --query taskDefinition \
            | jq --arg IMG "$IMAGE" --arg SHA "$SHA" --arg SHORT "$SHORT" \
                 --arg NOVA_ENABLED "$NOVA_SONIC_ENABLED" \
                 --arg NOVA_USERS "$NOVA_SONIC_CANARY_USER_IDS" \
                 --arg NOVA_TENANTS "$NOVA_SONIC_CANARY_TENANT_IDS" \
                 --arg ASM "arn:aws:secretsmanager:${{ env.TARGET_AWS_REGION }}:472838866351:secret:" '
                .containerDefinitions[0].image = $IMG
                | .containerDefinitions[0].environment |=
                    ( [ .[] | select(.name | IN("GIT_COMMIT_SHA","COMMIT_SHA","BUILD_INFO_MARKER",
                                                "NOVA_SONIC_ENABLED","NOVA_SONIC_REGION","NOVA_SONIC_MODEL_ID",
                                                "NOVA_SONIC_CANARY_USER_IDS","NOVA_SONIC_CANARY_TENANT_IDS",
                                                "FEATURE_ORB_GREETING_TTS_BRIDGE_ENV") | not) ]
                      + [ {name:"GIT_COMMIT_SHA", value:$SHA},
                          {name:"COMMIT_SHA", value:$SHA},
                          {name:"BUILD_INFO_MARKER", value:$SHORT},
                          {name:"NOVA_SONIC_ENABLED", value:$NOVA_ENABLED},
                          {name:"NOVA_SONIC_REGION", value:"eu-north-1"},
                          {name:"NOVA_SONIC_MODEL_ID", value:"amazon.nova-2-sonic-v1:0"},
                          {name:"NOVA_SONIC_CANARY_USER_IDS", value:$NOVA_USERS},
                          {name:"NOVA_SONIC_CANARY_TENANT_IDS", value:$NOVA_TENANTS},
                          {name:"FEATURE_ORB_GREETING_TTS_BRIDGE_ENV", value:"off"} ] )
                | .containerDefinitions[0].secrets |=
                    ( [ .[] | select(.name | IN("SUPABASE_JWT_SECRET","SUPABASE_ANON_KEY",
                                                "GOOGLE_GEMINI_API_KEY","GEMINI_API_KEY",
                                                "OPENAI_API_KEY","DEEPSEEK_API_KEY") | not) ]
                      + [ {name:"SUPABASE_JWT_SECRET",   valueFrom:($ASM + "vitana/supabase/prod/jwt-secret")},
                          {name:"SUPABASE_ANON_KEY",     valueFrom:($ASM + "vitana/supabase/prod/anon-key")},
                          {name:"GOOGLE_GEMINI_API_KEY", valueFrom:($ASM + "vitana/gateway/staging/google-gemini-api-key")},
                          {name:"GEMINI_API_KEY",        valueFrom:($ASM + "vitana/gateway/staging/google-gemini-api-key")},
                          {name:"OPENAI_API_KEY",        valueFrom:($ASM + "vitana/gateway/staging/openai-api-key")},
                          {name:"DEEPSEEK_API_KEY",      valueFrom:($ASM + "vitana/gateway/staging/deepseek-api-key")} ] )
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $NEW_ARN"
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$NEW_ARN" >/dev/null
          echo "Waiting for service to stabilize (up to ~10 min)…"
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}"
          echo "Service stable on $NEW_ARN"

      - name: Smoke — env=staging + deployed commit live
        run: |
          set -e
          URL="${{ env.GATEWAY_URL }}"
          SHA="${{ steps.commit.outputs.sha }}"
          for i in 1 2 3 4 5 6; do
            HEALTH=$(curl -fsS "$URL/api/v1/admin/health" 2>/dev/null || echo '')
            BUILD=$(curl -fsS "$URL/api/v1/admin/build-info" 2>/dev/null || echo '')
            ENV=$(echo "$HEALTH" | jq -r '.env // empty')
            COMMIT=$(echo "$BUILD" | jq -r '.git_commit // empty')
            if [ "$ENV" = "staging" ] && [ "$COMMIT" = "$SHA" ]; then
              echo "✓ env=staging, git_commit=$COMMIT"
              exit 0
            fi
            echo "Attempt $i: env='$ENV' commit='$COMMIT' (want staging/$SHA) — retry in 15s"
            sleep 15
          done
          echo "::error::Smoke failed — health/build-info did not report env=staging with the deployed commit"
          exit 1

      - name: Smoke — Nova Sonic health surface present
        run: |
          set -e
          URL="${{ env.GATEWAY_URL }}"
          NOVA=$(curl -fsS "$URL/api/v1/orb/nova-sonic/health")
          echo "$NOVA" | jq .
          REGION=$(echo "$NOVA" | jq -r '.region // empty')
          MODEL=$(echo "$NOVA" | jq -r '.model // empty')
          if [ "$REGION" != "eu-north-1" ] || [ "$MODEL" != "amazon.nova-2-sonic-v1:0" ]; then
            echo "::error::Nova health reports region='$REGION' model='$MODEL' — expected eu-north-1 / amazon.nova-2-sonic-v1:0"
            exit 1
          fi
          echo "✓ Nova Sonic health: enabled=$(echo "$NOVA" | jq -r '.enabled') ready=$(echo "$NOVA" | jq -r '.ready') canary_users=$(echo "$NOVA" | jq -r '.canary_user_count')"

      - name: Emit OASIS event + software_versions row (best-effort)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SVC: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SHA: ${{ steps.commit.outputs.sha }}
          SHORT: ${{ steps.commit.outputs.short }}
          OUTCOME: ${{ job.status }}
        run: |
          set +e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SVC" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE repo secrets not set — skipping OASIS/CLOCK emission (deploy itself unaffected)."
            exit 0
          fi
          STATUS=$([ "$OUTCOME" = "success" ] && echo success || echo error)
          TOPIC=$([ "$OUTCOME" = "success" ] && echo staging.deploy.completed || echo staging.deploy.failed)
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/software_versions" \
            -H "Content-Type: application/json" -H "apikey: $SUPABASE_SVC" \
            -H "Authorization: Bearer $SUPABASE_SVC" -H "Prefer: return=minimal" \
            -d "$(jq -nc --arg sha "$SHA" --arg st "$STATUS" \
              '{service:"vitana-gateway-aws", git_commit:$sha, deploy_type:"normal", initiator:"agent", status:$st, environment:"staging"}')" \
            || echo "::warning::software_versions insert failed; continuing."
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/oasis_events" \
            -H "Content-Type: application/json" -H "apikey: $SUPABASE_SVC" \
            -H "Authorization: Bearer $SUPABASE_SVC" -H "Prefer: return=minimal" \
            -d "$(jq -nc --arg sha "$SHA" --arg short "$SHORT" --arg st "$STATUS" --arg topic "$TOPIC" '{
              vtid: "BOOTSTRAP-AWS-STAGE-DEPLOY",
              topic: $topic,
              service: "vitana-gateway-aws",
              role: "CICD",
              model: "aws-stage-deploy",
              status: $st,
              message: ("AWS-STAGE-DEPLOY-GATEWAY: " + $short),
              metadata: { env: "staging", platform: "aws-ecs", git_commit: $sha, workflow: "AWS-STAGE-DEPLOY-GATEWAY.yml" }
            }')" || echo "::warning::oasis_events insert failed; continuing."

      - name: Summary
        if: success()
        run: |
          {
            echo "## AWS staging gateway deploy"
            echo "- Image: \`${{ steps.build.outputs.image }}\`"
            echo "- Commit: \`${{ steps.commit.outputs.sha }}\`"
            echo "- Verified live at: ${{ env.GATEWAY_URL }}"
            echo "- Reason: ${{ env.DEPLOY_REASON }}"
          } >> "$GITHUB_STEP_SUMMARY"
