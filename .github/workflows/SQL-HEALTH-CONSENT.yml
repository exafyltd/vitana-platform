name: SQL-HEALTH-CONSENT
run-name: 'health consent categories against a throwaway Postgres [VTID: VTID-05092] (${{ github.ref_name }})'

# VTID-05092 — runs the health consent migration against a disposable Postgres
# service container: catalogue seeds, wider granted_via, browser write revokes,
# append-only events (UPDATE trigger + UPDATE/DELETE revoked from service_role),
# fn_set_health_consent validation codes, idempotency, legacy DoctorBox grants,
# and consent + audit row in one transaction. Never runs against Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*health_consent*.sql'
      - 'scripts/ci/sql-tests/*health-consent*'
      - '.github/workflows/SQL-HEALTH-CONSENT.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the health consent test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-health-consent-test.sh 2>&1 | tee /tmp/consent.log
      - name: Assert the test ran to the end
        run: grep -q '^PASS vtid-05092 health consent categories' /tmp/consent.log
