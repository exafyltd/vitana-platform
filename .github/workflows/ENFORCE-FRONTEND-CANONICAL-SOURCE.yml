name: ENFORCE-FRONTEND-CANONICAL-SOURCE (DEV-CICDL-0205)
# Enforces canonical frontend source structure for Command Hub

on: [pull_request]

# Pipeline speed (kiro/pipeline-speed): a newer push to the same PR cancels the
# superseded run, so queued runners do not spend time on stale heads.
concurrency:
  group: frontend-canonical-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gateway dependencies
        working-directory: services/gateway
        run: npm ci

      - name: Build gateway
        working-directory: services/gateway
        run: npm run build

      - name: Validate frontend canonical source
        run: node services/validators/frontend-canonical-source.js
