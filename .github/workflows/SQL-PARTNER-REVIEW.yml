name: SQL-PARTNER-REVIEW
run-name: 'supplier offering keep-offline / allow-listing against a throwaway Postgres [VTID: VTID-04933] (${{ github.ref_name }})'

# VTID-04933 — proves the admin "keep offline" / "allow listing" writes behave
# as intended under the VTID-04769 go-live gate: a kept-offline draft stays off
# when its org goes live (and through pause/resume), an allowed one is held and
# goes on with the org. Disposable Postgres service container; never Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*vtid_04769*'
      - 'scripts/ci/sql-tests/*partner-review*'
      - 'scripts/ci/sql-tests/vtid-04933-*'
      - 'services/gateway/src/services/partner-review.ts'
      - '.github/workflows/SQL-PARTNER-REVIEW.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the keep-offline test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-partner-review-test.sh 2>&1 | tee /tmp/review.log
      - name: Assert the test ran to the end
        run: grep -q "^PASS vtid-04933 keep offline and allow listing" /tmp/review.log
