name: SQL-AUTH-BRIDGE
run-name: 'auth -> Aurora bridge against a throwaway Postgres [VTID: VTID-05023] (${{ github.ref_name }})'

# VTID-05023 part 4 — runs scripts/aws/test/auth-bridge.sh against a
# disposable Postgres service container: ensure_provisioned() creates the same
# rows as Supabase's six auth.users provisioning triggers and is idempotent;
# the PostgREST db-pre-request hook is a no-op for read-only transactions and
# null uids and provisions before an unprovisioned member's first write; the
# deletion path applies the public->auth.users FK actions. Never runs against
# Supabase or Aurora.

on:
  pull_request:
    paths:
      - 'scripts/aws/aurora-cutover-auth-bridge.sql'
      - 'scripts/aws/test/auth-bridge.sh'
      - 'scripts/aws/test/auth-bridge/**'
      - 'scripts/aurora/migrations/0001_auth_shim.sql'
      - '.github/workflows/SQL-AUTH-BRIDGE.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the auth bridge test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          npm run test:auth-bridge 2>&1 | tee /tmp/auth-bridge.log
      - name: Assert the test ran to the end
        run: grep -q '^PASS vtid-05023 auth bridge' /tmp/auth-bridge.log
