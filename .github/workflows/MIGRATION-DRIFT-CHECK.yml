name: Migration Drift Check

# VTID-03486. Follow-up to VTID-03480, where a migration file
# (20260606000000_DEV_COMHU_0503_orb_session_state.sql) was authored, committed,
# reviewed, and never applied — the table did not exist in production for ~2
# months and nothing in CI or at runtime said so.
#
# NOTE ON WHAT THIS CHECKS. The literal ask was "every file in
# supabase/migrations/ has a matching applied version". That is not implementable
# here: measured 2026-08-04, the repo's 377 distinct file versions and the 330
# rows in supabase_migrations.schema_migrations overlap by *2*, because
# migrations reach this database by several routes that each record a fresh
# timestamp rather than the file's own version. A version-match check would
# report ~375 false failures on its first run and be switched off within a day.
#
# So this checks the property that actually matters and that actually catches the
# VTID-03480 bug: if a migration declares CREATE TABLE x, then x must exist.
# See scripts/ci/check-migration-drift.cjs for the full rationale.
#
# Pre-existing drift (103 tables as of 2026-08-04) is recorded in
# scripts/ci/migration-drift-baseline.json; this job fails only on drift that is
# NEW relative to that baseline.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/ci/check-migration-drift.cjs'
      - 'scripts/ci/migration-drift-baseline.json'
  schedule:
    - cron: '40 7 * * *'   # 09:40 CET daily — catches drift introduced elsewhere
  workflow_dispatch:
    inputs:
      # VTID-05023 part 8: which database to compare against. 'default' follows
      # the repo variable MIGRATION_TARGET (unset = supabase, unchanged).
      target:
        description: 'Database to check (default = repo variable MIGRATION_TARGET, unset = supabase)'
        required: false
        type: choice
        options: [default, supabase, aurora]
        default: default

permissions:
  contents: read
  id-token: write # aurora target only: aws-actions/configure-aws-credentials OIDC

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # VTID-05023 part 8. Schedule and pull_request runs have no inputs and
      # follow the repo variable. While MIGRATION_FREEZE is 'true' (Aurora
      # cutover window, final load -> flip) the check fails fast: no migration
      # may merge or be applied in the window.
      - name: Resolve target and enforce the schema freeze
        id: target
        env:
          TARGET_INPUT: ${{ inputs.target }}
          TARGET_VAR: ${{ vars.MIGRATION_TARGET }}
          MIGRATION_FREEZE: ${{ vars.MIGRATION_FREEZE }}
        run: |
          set -euo pipefail
          if [ "${MIGRATION_FREEZE:-}" = "true" ]; then
            echo "::error::MIGRATION_FREEZE=true — schema freeze for the Aurora cutover window (from the start of the final load to the flip). Migrations wait until the repo variable is cleared."
            exit 1
          fi
          case "${TARGET_INPUT:-default}" in
            supabase|aurora) TARGET="$TARGET_INPUT" ;;
            default|'') TARGET="${TARGET_VAR:-supabase}" ;;
            *) echo "::error::unknown target input '$TARGET_INPUT'"; exit 1 ;;
          esac
          case "$TARGET" in
            supabase|aurora) ;;
            *) echo "::error::repo variable MIGRATION_TARGET='$TARGET' — must be supabase or aurora"; exit 1 ;;
          esac
          echo "Drift check target: $TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      # NOTE: deliberately NOT psql. GitHub Actions cannot reach the Supabase
      # pooler — the project has a network allow-list and runner IPs are not on
      # it ("FATAL: (EADDRNOTALLOWED) address not in tenant allow_list").
      # ALERT-WELCOME-GREETING-HEALTH.yml has failed every scheduled run for
      # 6+ days on exactly this. PostgREST is a separate edge service and is not
      # subject to that allow-list, so we go over HTTPS instead.
      - name: Snapshot live public tables (via PostgREST RPC)
        if: steps.target.outputs.target == 'supabase'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE secrets are not set on this repo."
            exit 1
          fi
          HTTP=$(curl -sS -o rpc.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ci_schema_inventory" \
            -H "apikey: $SUPABASE_SERVICE_ROLE" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE" \
            -H 'Content-Type: application/json' -d '{}')
          if [ "$HTTP" != "200" ]; then
            echo "::error::ci_schema_inventory RPC returned HTTP $HTTP. If 404, the function is missing — apply supabase/migrations/20260804080000_vtid_03486_ci_health_rpcs.sql."
            head -c 500 rpc.json || true
            exit 1
          fi
          jq -r '.[].table_name' rpc.json > live-tables.txt
          COUNT=$(grep -c . live-tables.txt || true)
          echo "Live public tables: $COUNT"
          # An empty list would make every declared table look missing. Fail loudly
          # on a broken connection rather than emitting a wall of false positives.
          if [ "$COUNT" -lt "50" ]; then
            echo "::error::Only $COUNT tables returned — the connection or RPC is wrong, not the schema. Refusing to evaluate drift against a bad snapshot."
            exit 1
          fi

      # Aurora answers the same question: the same catalog query as the
      # ci_schema_inventory() RPC (public base + partitioned tables), read-only,
      # as one SELECT over the RDS Data API (the cluster is VPC-private).
      # formattedRecords has the RPC's shape: [{"table_name": ...}, ...].
      - name: Configure AWS credentials (GitHub OIDC — no static keys)
        if: steps.target.outputs.target == 'aurora'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Snapshot live public tables (Aurora, via RDS Data API)
        if: steps.target.outputs.target == 'aurora'
        env:
          AWS_PAGER: ''
        run: |
          set -euo pipefail
          R=eu-central-1
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          [ "$ACCT" = "472838866351" ] || { echo "::error::Assumed role is in account $ACCT, expected 472838866351"; exit 1; }
          CLUSTER_ARN=$(aws rds describe-db-clusters --region $R --db-cluster-identifier vitana-aurora-prod \
            --query 'DBClusters[0].DBClusterArn' --output text)
          SECRET_ARN=$(aws rds describe-db-clusters --region $R --db-cluster-identifier vitana-aurora-prod \
            --query 'DBClusters[0].MasterUserSecret.SecretArn' --output text)
          SQL="SELECT c.relname::text AS table_name FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p') ORDER BY c.relname"
          tries=0
          until aws rds-data execute-statement --region $R --resource-arn "$CLUSTER_ARN" \
                --secret-arn "$SECRET_ARN" --database vitana --sql "$SQL" \
                --format-records-as JSON --query formattedRecords --output text > rpc.json 2> err.txt; do
            if grep -q HttpEndpointNotEnabled err.txt && [ "$tries" -lt 20 ]; then
              tries=$((tries+1)); echo "Data API not ready yet, retrying in 15s ($tries/20)..."; sleep 15
            else
              echo "::error::Aurora inventory query failed"; cat err.txt; exit 1
            fi
          done
          jq -r '.[].table_name' rpc.json > live-tables.txt
          COUNT=$(grep -c . live-tables.txt || true)
          echo "Live public tables (Aurora): $COUNT"
          if [ "$COUNT" -lt "50" ]; then
            echo "::error::Only $COUNT tables returned — the connection or query is wrong, not the schema. Refusing to evaluate drift against a bad snapshot."
            exit 1
          fi

      - name: Check for new migration drift
        run: node scripts/ci/check-migration-drift.cjs --live live-tables.txt
