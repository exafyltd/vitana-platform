name: Alert — ORB Context Bootstrap Latency

# VTID-03504.
#
# WHY THIS EXISTS: on 2026-08-05 a user's ORB sat on "Verbinden..." and then
# looped "Verbindung wird wiederhergestellt...". Server-side,
# `orb.live.context.bootstrap` had run a 2.0s p50 all day and then went to a
# 17.4s p50 / 119.7s max between 14:14 and 14:22 UTC — one user's reconnects
# stacking context builds on each other until the builds starved each other,
# which also degraded two uninvolved users on the same gateway task. Nothing
# alarmed. The incident was found only because someone photographed a phone.
#
# The fix (single-flight de-dupe + TTL reuse + bounded caller waits) removes
# the amplification. This workflow is the part that makes a recurrence
# *noticed* — VTID-03480's standing lesson: a degradation nobody alerts on is
# not detected, it is merely recorded.
#
# TRANSPORT: PostgREST over HTTPS, deliberately NOT `psql "$SUPABASE_DB_URL"`.
# GitHub runner IPs are not on the Supabase project's network allow-list, so
# every psql-based check in this repo is structurally unable to connect
# (VTID-03485/03492). This one reads `oasis_events` directly — no RPC and no
# migration needed, because the events table is already exposed to
# `service_role` through PostgREST.
#
# Thresholds are deliberately loose. Healthy is ~2s; the client's own start
# budget is 8s. Alerting at a 6s p50 catches real degradation with room to
# spare, and the max-latency check catches the tail that actually breaks a
# session even when the median still looks fine.

#
# VTID-05141 — TRANSPORT CHANGED: this workflow is now a thin GET of the
# production gateway's public, read-only ops health route
# (services/gateway/src/routes/ops-health-checks.ts), which runs the same
# query and thresholds this workflow used to run inline. One implementation
# per check; the panel and this alert can no longer disagree. A non-JSON
# answer, an HTTP 404/5xx or any status other than "ok" fails the job
# (never silently green). The transport notes above describe the old inline
# query and are kept as history.
#
# Route: /api/v1/ops/health/orb-bootstrap-latency (orb.live.context.bootstrap over 90
# min: p50 above 6000 ms or more than one build above 12000 ms is degraded; an
# idle window answers ok with idle=true, as this workflow always did).

on:
  schedule:
    - cron: '35 * * * *'   # hourly, staggered off the daily health alerts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latency:
    runs-on: ubuntu-latest
    steps:
      - name: Check ORB context-bootstrap latency
        env:
          HEALTH_URL: https://gateway.vitanaland.com/api/v1/ops/health/orb-bootstrap-latency
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o health.json -w '%{http_code}' --max-time 60 "$HEALTH_URL") || HTTP="000"
          echo "GET $HEALTH_URL -> HTTP $HTTP"
          head -c 2000 health.json 2>/dev/null || true
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::error::$HEALTH_URL answered HTTP $HTTP. A 404 means the route is not deployed to production; 5xx or 000 means the gateway did not answer. The check itself failed."
            exit 1
          fi
          if ! jq -e 'type == "object"' health.json >/dev/null 2>&1; then
            echo "::error::$HEALTH_URL did not answer a JSON object (an HTML page means the route does not exist on the deployed gateway). The check itself failed."
            exit 1
          fi
          STATUS=$(jq -r '.status // "missing"' health.json)
          REASON=$(jq -r '.reason // ""' health.json)
          if [ "$STATUS" != "ok" ]; then
            echo "::error::ORB context bootstrap is degraded (p50 over 6 s or more than one build over 12 s in 90 min — check FEATURE_ORB_BRAIN_CACHE_ENV and the single-flight JOIN logs, VTID-03504): status=$STATUS reason=$REASON (see the JSON above)."
            exit 1
          fi
          echo "OK: status=$STATUS"

      # VTID-05103: a failed check reaches the one self-healing intake (loop L1),
      # not just a red run in Actions. Reporting never changes this job's result.
      - name: Check out the report script
        if: failure()
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Report failure to self-healing
        if: failure()
        env:
          SERVICE_TOKEN: ${{ secrets.GATEWAY_SERVICE_TOKEN }}
        run: bash scripts/ci/report-to-self-healing.sh "alert-orb-bootstrap-latency" "alert-workflow://ALERT-ORB-BOOTSTRAP-LATENCY" "ORB context bootstrap latency over budget"
