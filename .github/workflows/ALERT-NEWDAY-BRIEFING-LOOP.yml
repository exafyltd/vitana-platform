name: Alert — New-Day Briefing Loop / Stamp-Write Health

# VTID-04255.
#
# WHY THIS EXISTS: reported live as "every new day greeting now is nonstop
# new day greeting" — a user got a full "new day" morning briefing 3 times
# in 21 hours (safe_fast_newday_overview/newday_overview wake_opener,
# 2026-09-21/22 UTC), because the ONLY thing gating a repeat full-briefing
# greeting was a durable DB date-stamp write (user_journey.
# last_full_briefing_date) that was silently failing in production with
# Postgres error "permission denied for table user_journey" — very likely a
# stale/wrong deployed AWS Secrets Manager value for the Supabase
# service-role key (see the VTID-04255 PR body for the full trace).
#
# The code fix (compute-greeting-decision.ts: both
# shouldAttemptNewdayOverview() and tryDayCloseRung() now refuse to fire
# on ctx.bucket==='reconnect') closes the USER-VISIBLE symptom
# unconditionally — but the underlying DB write can still be broken, and a
# silent DB-permission failure is exactly the kind of degradation that
# nobody notices for days unless something is watching (VTID-03480's
# standing lesson, repeated verbatim in this repo's other ALERT-*.yml
# files: a degradation nobody alerts on is not detected, it is merely
# recorded).
#
# This checks TWO independent things, either of which is actionable on
# its own:
#   1. stamp_briefing_date_write failures in the last window — the
#      root-cause DB write. Any occurrence means the AWS Secrets Manager
#      credential fix described in the VTID-04255 PR is still outstanding.
#   2. A regression of the exact symptom this VTID fixed — a
#      newday_overview/safe_fast_newday_overview wake_opener firing on a
#      ctx.bucket==='reconnect' session. Post-fix this combination should
#      be structurally unreachable; any occurrence means the fix was
#      reverted, bypassed, or a new code path re-introduced the gap.
#
# TRANSPORT: PostgREST over HTTPS, deliberately NOT `psql "$SUPABASE_DB_URL"`
# — GitHub runner IPs are not on the Supabase project's network allow-list,
# so every psql-based check in this repo is structurally unable to connect
# (VTID-03485/03492). oasis_events is already reachable by service_role
# through PostgREST — no RPC or migration needed, matching
# ALERT-PUSH-DISPATCH-HEALTH.yml's precedent.

#
# VTID-05141 — TRANSPORT CHANGED: this workflow is now a thin GET of the
# production gateway's public, read-only ops health route
# (services/gateway/src/routes/ops-health-checks.ts), which runs the same
# query and thresholds this workflow used to run inline. One implementation
# per check; the panel and this alert can no longer disagree. A non-JSON
# answer, an HTTP 404/5xx or any status other than "ok" fails the job
# (never silently green). The transport notes above describe the old inline
# query and are kept as history.
#
# Route: /api/v1/ops/health/newday-briefing-loop (60 min: any stamp_briefing_date_write
# failure or any newday_overview/safe_fast_newday_overview greeting on a
# bucket=reconnect session is degraded).

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes — catch a recurrence within an hour, not a day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newday-briefing-loop-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check new-day briefing loop health
        env:
          HEALTH_URL: https://gateway.vitanaland.com/api/v1/ops/health/newday-briefing-loop
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o health.json -w '%{http_code}' --max-time 60 "$HEALTH_URL") || HTTP="000"
          echo "GET $HEALTH_URL -> HTTP $HTTP"
          head -c 2000 health.json 2>/dev/null || true
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::error::$HEALTH_URL answered HTTP $HTTP. A 404 means the route is not deployed to production; 5xx or 000 means the gateway did not answer. The check itself failed."
            exit 1
          fi
          if ! jq -e 'type == "object"' health.json >/dev/null 2>&1; then
            echo "::error::$HEALTH_URL did not answer a JSON object (an HTML page means the route does not exist on the deployed gateway). The check itself failed."
            exit 1
          fi
          STATUS=$(jq -r '.status // "missing"' health.json)
          REASON=$(jq -r '.reason // ""' health.json)
          if [ "$STATUS" != "ok" ]; then
            echo "::error::new-day briefing loop is not healthy (stamp_briefing_date_write failures or a full briefing on a reconnect-bucket session — VTID-04255): status=$STATUS reason=$REASON (see the JSON above)."
            exit 1
          fi
          echo "OK: status=$STATUS"

      # VTID-05103: a failed check reaches the one self-healing intake (loop L1),
      # not just a red run in Actions. Reporting never changes this job's result.
      - name: Check out the report script
        if: failure()
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Report failure to self-healing
        if: failure()
        env:
          SERVICE_TOKEN: ${{ secrets.GATEWAY_SERVICE_TOKEN }}
        run: bash scripts/ci/report-to-self-healing.sh "alert-newday-briefing-loop" "alert-workflow://ALERT-NEWDAY-BRIEFING-LOOP" "new-day briefing loop regression (stamp-write failures or reconnect-bucket briefings)"
