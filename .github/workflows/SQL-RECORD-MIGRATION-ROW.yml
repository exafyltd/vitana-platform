name: SQL-RECORD-MIGRATION-ROW
run-name: 'RUN-MIGRATION schema_migrations row against a throwaway Postgres [VTID: VTID-05123] (${{ github.ref_name }})'

# VTID-05123 — runs the real apply-sql-via-management-api.sh --record-migration
# with a fake curl that executes each request on a disposable Postgres service
# container: one row per applied file, no row for a failed or partially applied
# migration, re-runs, shared version prefixes, MCP-held versions, the
# pre-check/apply race, a failed pre-check, and the inputs that must never be
# recorded. Never runs against Supabase; never calls the Management API.

on:
  pull_request:
    paths:
      - 'scripts/ci/apply-sql-via-management-api.sh'
      - 'scripts/ci/sql-tests/run-record-migration-row-test.sh'
      - '.github/workflows/RUN-MIGRATION.yml'
      - '.github/workflows/SQL-RECORD-MIGRATION-ROW.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the record-migration-row test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-record-migration-row-test.sh 2>&1 | tee /tmp/record-migration-row.log
      - name: Assert the test ran to the end
        run: grep -q '^PASS vtid-05123 record migration row' /tmp/record-migration-row.log
