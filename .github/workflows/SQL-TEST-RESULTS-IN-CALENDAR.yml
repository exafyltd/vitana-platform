name: SQL-TEST-RESULTS-IN-CALENDAR
run-name: 'test results in calendar triggers against a throwaway Postgres [VTID: VTID-04997] (${{ github.ref_name }})'

# VTID-04997 — runs the test results -> calendar mirror triggers (insert,
# move, cancel, revive, delete, never-block, backfill) against a disposable Postgres
# service container. Never runs against Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*vtid_04997*.sql'
      - 'scripts/ci/sql-tests/*test-results-in-calendar*'
      - '.github/workflows/SQL-TEST-RESULTS-IN-CALENDAR.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the test results in calendar test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-test-results-in-calendar-test.sh 2>&1 | tee /tmp/testresults.log
      - name: Assert the test ran to the end
        run: grep -q "^PASS vtid-04997 test results in calendar" /tmp/testresults.log
