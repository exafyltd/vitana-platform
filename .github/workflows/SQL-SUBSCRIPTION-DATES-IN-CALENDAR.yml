name: SQL-SUBSCRIPTION-DATES-IN-CALENDAR
run-name: 'subscription dates in calendar triggers against a throwaway Postgres [VTID: VTID-04994] (${{ github.ref_name }})'

# VTID-04994 — runs the subscription dates -> calendar mirror triggers (renews,
# ends, trial, cancel, delete, never-block, backfill) against a disposable Postgres
# service container. Never runs against Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*vtid_04994*.sql'
      - 'scripts/ci/sql-tests/*subscription-dates-in-calendar*'
      - '.github/workflows/SQL-SUBSCRIPTION-DATES-IN-CALENDAR.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the subscription dates in calendar test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-subscription-dates-in-calendar-test.sh 2>&1 | tee /tmp/subscriptiondates.log
      - name: Assert the test ran to the end
        run: grep -q "^PASS vtid-04994 subscription dates in calendar" /tmp/subscriptiondates.log
