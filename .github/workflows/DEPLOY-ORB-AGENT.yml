name: DEPLOY-ORB-AGENT

# VTID-LIVEKIT-FOUNDATION: deploy services/agents/orb-agent/ to Cloud Run.
#
# Triggered by:
#   - manual dispatch (operator-driven during ramp)
#   - main pushes that touch services/agents/orb-agent/** (auto-deploy once stable)
#
# Cloud Run config: max=10, 2 vCPU/4 GiB. The warm floor is controlled by the
# `warm_worker` dispatch input (VTID-03508) and defaults to OFF — see below.
#
# VTID-03508 — WHY THE DEFAULT IS OFF, AND WHAT IT COSTS YOU
# ----------------------------------------------------------
# This service used to deploy with `--min-instances=1 --no-cpu-throttling`
# unconditionally: 2 vCPU + 4 GiB of always-allocated CPU, billed 24/7, ~$150/mo
# — the single largest standby line item in the GCP project.
#
# It bought nothing measurable. As of 2026-08-06:
#   - `voice.livekit_canary_allowlist` contains exactly ONE user.
#   - ZERO LiveKit room-join / agent-dispatch events in the last 90 days
#     (`oasis_events`; the only `orb.livekit.*` topics still firing are
#     `next_action.*`, which is gateway-side suggestion logic, not this agent).
#   - All real ORB voice traffic goes through the WS/Vertex/Nova upstream path,
#     which does not involve this service at all.
#
# THIS IS NOT A LATENCY TRADE-OFF — IT TURNS THE LIVEKIT VOICE PATH OFF.
# The livekit-agents worker connects OUTBOUND to LiveKit Cloud and must stay
# resident to receive dispatches. At min-instances=0 there is no resident
# worker, so it deregisters and LiveKit routes no jobs to it: the path is dead,
# not slow. `--no-cpu-throttling` is likewise required, not a tuning knob — a
# throttled instance gets no CPU between requests and the worker's persistent
# outbound session starves. So the two settings move together, and there is no
# middle setting that is both cheap and functional.
#
# TO TURN LIVEKIT VOICE BACK ON: dispatch this workflow with warm_worker=true.
# No code change, no PR. Cost resumes at ~$150/mo while it is on.
#
# This workflow does NOT replace EXEC-DEPLOY for the gateway — the gateway and
# the orb-agent deploy independently. Smoke test 5/5 in EXEC-DEPLOY verifies
# the gateway can reach this service (when LiveKit is the active provider).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev-sandbox"
        type: choice
        options:
          - dev-sandbox
          - prod
      warm_worker:
        description: "Keep a resident LiveKit worker (min-instances=1, always-allocated CPU). ~$150/mo. Required for the LiveKit voice path to function at all — see header."
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'services/agents/orb-agent/**'
      - '.github/workflows/DEPLOY-ORB-AGENT.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: lovable-vitana-vers1
  GCP_REGION: us-central1
  SERVICE_NAME: vitana-orb-agent
  IMAGE_REPO: us-central1-docker.pkg.dev/lovable-vitana-vers1/vitana-services/orb-agent

jobs:
  # Staging-first cutover gate. Freezes the AUTOMATIC (push) deploy of the live
  # vitana-orb-agent service at/after Mon 8 Jun 2026, 10:00 Europe/Berlin.
  # orb-agent has no staging twin, so post-cutover the push path is freeze-only;
  # deploy via manual workflow_dispatch (the documented exception). Manual
  # dispatch is never frozen.
  cutover_gate:
    runs-on: ubuntu-latest
    outputs:
      frozen: ${{ steps.gate.outputs.frozen }}
    steps:
      - name: Evaluate staging-first cutover
        id: gate
        shell: bash
        run: |
          CUTOVER_EPOCH="$(date -d 'TZ="Europe/Berlin" 2026-06-08 10:00:00' +%s)"
          NOW_EPOCH="$(date -u +%s)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch → not frozen (deliberate prod exception)."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          elif [ "$NOW_EPOCH" -ge "$CUTOVER_EPOCH" ]; then
            echo "::warning::Staging-first cutover ACTIVE — auto deploy of vitana-orb-agent to LIVE is frozen. Use a manual workflow_dispatch to ship."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-cutover — auto deploy proceeds (cutover at $(date -u -d @${CUTOVER_EPOCH}) UTC)."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: cutover_gate
    if: needs.cutover_gate.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        working-directory: services/agents/orb-agent
        run: |
          set -euxo pipefail
          IMAGE="${IMAGE_REPO}:${{ github.sha }}"
          docker build -t "$IMAGE" -t "${IMAGE_REPO}:latest" .
          docker push "$IMAGE"
          docker push "${IMAGE_REPO}:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # VTID-03041: Deepgram API key plumbed via --update-env-vars instead of
      # --update-secrets. Secret Manager would be the right home, but the WIF
      # service account lacks `secretmanager.secrets.create` (VTID-03040 deploy
      # failed on permission denied). --update-env-vars lets us light up the
      # third STT fallback today without waiting on an ops permission grant;
      # follow-up will migrate to Secret Manager once the SA has admin.
      # GH Actions auto-masks the value in workflow logs; the key still lives
      # in the Cloud Run revision env (visible to anyone with run.services.get).
      - name: Deploy to Cloud Run
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          set -euxo pipefail
          EXTRA_ENV=""
          if [ -n "${DEEPGRAM_API_KEY:-}" ]; then
            EXTRA_ENV=",DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}"
          else
            echo "::warning::DEEPGRAM_API_KEY GH secret not set — orb-agent will run with the 2-instance Google-only STT chain (no cross-provider fallback)."
          fi
          # VTID-03508: the warm floor and CPU allocation move together — a
          # resident LiveKit worker needs BOTH, and neither is useful alone.
          # Default (warm_worker unset/false, and every push-triggered run):
          # scale to zero, throttled CPU, ~zero standby cost, LiveKit path off.
          if [ "${{ inputs.warm_worker }}" = "true" ]; then
            echo "warm_worker=true — deploying a RESIDENT worker (~\$150/mo). LiveKit voice path ACTIVE."
            SCALE_ARGS=(--min-instances=1 --no-cpu-throttling)
          else
            echo "::warning::warm_worker not set — deploying scale-to-zero. The LiveKit voice path will be INACTIVE (the worker cannot stay registered with LiveKit Cloud). Re-dispatch with warm_worker=true to restore it. See VTID-03508."
            SCALE_ARGS=(--min-instances=0 --cpu-throttling)
          fi

          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            "${SCALE_ARGS[@]}" \
            --max-instances=10 \
            --cpu=2 \
            --memory=4Gi \
            --timeout=3600 \
            --concurrency=25 \
            --port=8080 \
            --ingress=all \
            --allow-unauthenticated \
            --labels=vtid=vtid-livekit-foundation,vt_layer=aicor,vt_module=voice \
            --update-secrets=LIVEKIT_URL=LIVEKIT_URL:latest,LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,GATEWAY_SERVICE_TOKEN=GATEWAY_SERVICE_TOKEN:latest \
            --set-env-vars="GATEWAY_URL=https://gateway-q74ibpv6ia-uc.a.run.app,AGENT_LOG_LEVEL=INFO,AGENT_ENABLE_WORKER=1,GOOGLE_CLOUD_PROJECT=lovable-vitana-vers1,VERTEX_AI_LOCATION=us-central1,ORB_AGENT_TEXT_ONLY=false${EXTRA_ENV}"

      - name: Delete prior revisions (force only-latest worker connects to LiveKit)
        run: |
          set -euxo pipefail
          # VTID-03508: this step matters only when warm_worker=true. At
          # min-instances=0 no revision holds a resident container, so none can
          # register with LiveKit and there is nothing to disambiguate. Kept
          # unconditional because it is harmless when there is nothing to
          # delete, and must not be forgotten when the warm floor is restored.
          #
          # CRITICAL FIX: the orb-agent's livekit-agents worker connects
          # OUTBOUND to LiveKit Cloud. With --min-instances=1, every Cloud
          # Run revision keeps a warm container alive — and every warm
          # container's worker subprocess registers with LiveKit Cloud.
          # LiveKit then dispatches jobs to ANY connected worker, not just
          # the latest revision. Result: rooms randomly get OLD code while
          # we keep deploying fixes. Delete every non-latest revision so
          # only the just-deployed code receives dispatches.
          LATEST=$(gcloud run services describe "$SERVICE_NAME" \
            --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            --format='value(status.latestReadyRevisionName)')
          echo "Latest revision: $LATEST"
          ALL=$(gcloud run revisions list \
            --service="$SERVICE_NAME" \
            --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            --format='value(metadata.name)')
          for REV in $ALL; do
            if [ "$REV" = "$LATEST" ]; then
              echo "  keep $REV (latest)"
            else
              echo "  delete $REV"
              gcloud run revisions delete "$REV" \
                --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
                --quiet || echo "    (already gone or in use)"
            fi
          done
          echo "✓ Only $LATEST is now serving worker dispatches."

      - name: Smoke test — health endpoint
        run: |
          set -euxo pipefail
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            --format='value(status.url)')
          echo "service URL: $SERVICE_URL"
          # Cold start: scale-to-zero means first hit may take a few seconds.
          for i in 1 2 3 4 5; do
            if curl -fsS "$SERVICE_URL/health" | jq -e '.ok == true' >/dev/null; then
              echo "✓ orb-agent /health returned ok=true on attempt $i"
              curl -fsS "$SERVICE_URL/health" | jq '.'
              exit 0
            fi
            echo "attempt $i failed, retrying..."
            sleep 5
          done
          echo "::error::orb-agent /health did not return ok=true after 5 attempts"
          exit 1

      - name: Verify agents_registry heartbeat
        run: |
          set -euxo pipefail
          # The agent's registry heartbeat fires every 60s. Allow up to 90s for
          # the first heartbeat to land.
          echo "Waiting up to 90s for first heartbeat to populate agents_registry.last_heartbeat_at..."
          # Real implementation: query Supabase via service-role token.
          # For the skeleton workflow this is just a 'sleep + reminder' — a
          # follow-up PR adds the explicit query.
          sleep 90
          echo "✓ skeleton check (real query lands when GATEWAY_SERVICE_TOKEN is wired)"
