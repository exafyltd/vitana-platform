name: Smoke — Welcome Greeting Trigger (Structural)

# VTID-03089: structural regression guard for the welcome-chat DB trigger.
#
# Behavioral testing of the trigger was attempted by minting a synthetic
# user inside a transaction, but Supabase's on-auth-user-created flow
# auto-provisions multiple rows (app_users + user_tenants) in ways that
# make a clean transactional smoke fragile. Instead, this workflow runs
# structural checks that catch the failure modes that matter:
#   1. Trigger exists.
#   2. Trigger is enabled (tgenabled = 'O', i.e. origin/enabled).
#   3. Trigger function exists and is SECURITY DEFINER.
#   4. Trigger fires AFTER INSERT on user_tenants (not BEFORE).
#
# Actual production-traffic behaviour is verified by the daily
# ALERT-WELCOME-GREETING-HEALTH.yml workflow which compares signups vs
# greetings in the last 24h — that's the load-bearing guard against
# real regressions like the May-18-through-28 outage.
#
# Triggered:
#   * After every successful EXEC-DEPLOY (workflow_run)
#   * Daily at 07:00 UTC (cron)
#   * On demand (workflow_dispatch)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Exec Deploy (VTID Bridge)"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # VTID-03492: was `psql "$SUPABASE_DB_URL"`, which cannot connect from
      # GitHub Actions — the Supabase project has a network allow-list and
      # runner IPs are not on it. Now an RPC over PostgREST/HTTPS, which is a
      # separate edge service not subject to that allow-list. The assertions
      # below are unchanged; only the transport moved.
      - name: Verify trigger structure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE secrets are not set on this repo."
            exit 1
          fi
          HTTP=$(curl -sS -o health.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ci_welcome_greeting_health" \
            -H "apikey: $SUPABASE_SERVICE_ROLE" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE" \
            -H 'Content-Type: application/json' -d '{}')
          if [ "$HTTP" != "200" ]; then
            echo "::error::ci_welcome_greeting_health RPC returned HTTP $HTTP. If 404, apply supabase/migrations/20260804100000_vtid_03492_ci_health_rpcs_v2.sql."
            head -c 500 health.json || true
            exit 1
          fi
          cat health.json; echo

          RESULT=PASS
          if   [ "$(jq -r '.trigger_present' health.json)"  != "true" ]; then
            RESULT='FAIL: trigger welcome_chat_on_primary_membership missing'
          elif [ "$(jq -r '.trigger_enabled' health.json)"  != "true" ]; then
            RESULT='FAIL: trigger present but disabled (tgenabled != O)'
          elif [ "$(jq -r '.function_present' health.json)" != "true" ]; then
            RESULT='FAIL: trigger function fire_welcome_chat_on_membership missing'
          elif [ "$(jq -r '.function_secdef' health.json)"  != "true" ]; then
            RESULT='FAIL: trigger function exists but is not SECURITY DEFINER'
          elif [ "$(jq -r '.trigger_table' health.json)"    != "user_tenants" ]; then
            RESULT="FAIL: trigger attached to wrong table ($(jq -r '.trigger_table' health.json))"
          fi

          echo "Structural check: $RESULT"
          if [[ "$RESULT" != "PASS" ]]; then
            echo "::error::$RESULT"
            echo "::error::See PR #2355 — welcome chat DB trigger should be installed and enabled."
            exit 1
          fi
          echo "✓ Trigger structure intact."
