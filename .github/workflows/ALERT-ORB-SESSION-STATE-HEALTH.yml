name: Alert — ORB Session State Health

# VTID-03485. Follow-up to VTID-03480, where `orb_session_state` did not exist
# in production for ~2 months and four ORB features were silently inert.
#
# The in-process tracker added in services/gateway/src/services/orb/
# orb-session-state.ts makes the failure *visible* (admin endpoint + a loud log
# line). This workflow is the part that makes it *noticed* — the lesson from
# VTID-03480 was precisely that `ok:false` in a payload nobody alerts on is not
# detection.
#
# VTID-05141 — TRANSPORT CHANGED: this workflow is now a thin GET of the
# production gateway's public, read-only ops health route
# (services/gateway/src/routes/ops-health-checks.ts), which runs the same
# query and thresholds this workflow used to run inline. One implementation
# per check; the panel and this alert can no longer disagree. A non-JSON
# answer, an HTTP 404/5xx or any status other than "ok" fails the job
# (never silently green).
#
# Route: /api/v1/ops/health/orb-session-ledger (ci_orb_session_state_health,
# supabase/migrations/20260804080000_vtid_03486_ci_health_rpcs.sql).
#
# Three independent conditions, because they fail in different ways:
#   1. The relation exists at all           <- the exact VTID-03480 root cause
#   2. Writes are landing when there is traffic
#   3. No ack reports ok:false

on:
  schedule:
    - cron: '20 7 * * *'   # 09:20 CET daily, staggered off the greeting alert
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ORB session-state health
        env:
          HEALTH_URL: https://gateway.vitanaland.com/api/v1/ops/health/orb-session-ledger
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o health.json -w '%{http_code}' --max-time 60 "$HEALTH_URL") || HTTP="000"
          echo "GET $HEALTH_URL -> HTTP $HTTP"
          head -c 2000 health.json 2>/dev/null || true
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::error::$HEALTH_URL answered HTTP $HTTP. A 404 means the route is not deployed to production; 5xx or 000 means the gateway did not answer. The check itself failed."
            exit 1
          fi
          if ! jq -e 'type == "object"' health.json >/dev/null 2>&1; then
            echo "::error::$HEALTH_URL did not answer a JSON object (an HTML page means the route does not exist on the deployed gateway). The check itself failed."
            exit 1
          fi
          STATUS=$(jq -r '.status // "missing"' health.json)
          REASON=$(jq -r '.reason // ""' health.json)
          if [ "$STATUS" != "ok" ]; then
            echo "::error::ORB session-state health is not healthy (relation missing, no writes under traffic, or ok:false acks — VTID-03480 regression; see GET /api/v1/admin/orb-session-state-health): status=$STATUS reason=$REASON (see the JSON above)."
            exit 1
          fi
          echo "OK: status=$STATUS"

      # VTID-05103: a failed check reaches the one self-healing intake (loop L1),
      # not just a red run in Actions. Reporting never changes this job's result.
      - name: Check out the report script
        if: failure()
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Report failure to self-healing
        if: failure()
        env:
          SERVICE_TOKEN: ${{ secrets.GATEWAY_SERVICE_TOKEN }}
        run: bash scripts/ci/report-to-self-healing.sh "alert-orb-session-state-health" "alert-workflow://ALERT-ORB-SESSION-STATE-HEALTH" "ORB session-state writes unhealthy"
