name: Alert — ORB Session State Health

# VTID-03485. Follow-up to VTID-03480, where `orb_session_state` did not exist
# in production for ~2 months and four ORB features were silently inert.
#
# The in-process tracker added in services/gateway/src/services/orb/
# orb-session-state.ts makes the failure *visible* (admin endpoint + a loud log
# line). This workflow is the part that makes it *noticed* — the lesson from
# VTID-03480 was precisely that `ok:false` in a payload nobody alerts on is not
# detection. Same second-layer role as ALERT-WELCOME-GREETING-HEALTH.yml:
# unit tests prove the tracker works on synthetic data; this proves the real
# table is reachable and real sessions are acking.
#
# Three independent checks, because they fail in different ways:
#   1. The relation exists at all            <- the exact VTID-03480 root cause
#   2. Recent writes are landing              <- catches silent write failure
#   3. Recent acks are not all ok:false       <- catches the original symptom

on:
  schedule:
    - cron: '20 7 * * *'   # 09:20 CET daily, staggered off the greeting alert
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get install -y postgresql-client > /dev/null 2>&1

      - name: Check 1 — orb_session_state relation exists
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          EXISTS=$(psql "$SUPABASE_DB_URL" -t -A <<'EOF'
          SELECT COUNT(*) FROM information_schema.tables
           WHERE table_schema = 'public' AND table_name = 'orb_session_state';
          EOF
          )
          EXISTS=$(echo "$EXISTS" | tr -d ' \r')
          echo "orb_session_state present: $EXISTS"
          if [ "$EXISTS" != "1" ]; then
            echo "::error::orb_session_state does NOT exist in production. This is the VTID-03480 failure exactly: an authored-but-never-applied migration. Every ORB session-state helper is failing soft right now — continuity, audio-ready handshake, pending CTA and opener rotation are all inert. Apply supabase/migrations/20260606000000_DEV_COMHU_0503_orb_session_state.sql."
            exit 1
          fi

      - name: Check 2 — writes are landing
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          OUTPUT=$(psql "$SUPABASE_DB_URL" -t -A -F '|' <<'EOF'
          SELECT
            (SELECT COUNT(*) FROM public.oasis_events
              WHERE topic = 'orb.session.identity.resolved'
                AND created_at >= now() - interval '24 hours') AS starts_24h,
            (SELECT COUNT(*) FROM public.orb_session_state
              WHERE updated_at >= now() - interval '24 hours') AS writes_24h;
          EOF
          )
          LINE=$(echo "$OUTPUT" | grep -v '^$' | tail -1)
          STARTS=$(echo "$LINE" | cut -d'|' -f1 | tr -d ' \r')
          WRITES=$(echo "$LINE" | cut -d'|' -f2 | tr -d ' \r')
          echo "Last 24h: $STARTS session starts, $WRITES session-state rows written"

          if ! [[ "$STARTS" =~ ^[0-9]+$ ]] || ! [[ "$WRITES" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse write-health output. Raw: $OUTPUT"
            exit 1
          fi

          # Only meaningful when there was real traffic. A quiet night is not a
          # fault — this is the distinction that made the overnight ack gap on
          # 2026-08-04 a false alarm at n=2.
          if [ "$STARTS" -ge "5" ] && [ "$WRITES" -eq "0" ]; then
            echo "::error::$STARTS ORB sessions started in the last 24h but ZERO rows were written to orb_session_state. Writes are failing silently (the helpers never throw). Check GET /api/v1/admin/orb-session-state-health for schema_missing and the failure reason."
            exit 1
          fi

      - name: Check 3 — audio-ready acks are not uniformly failing
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          OUTPUT=$(psql "$SUPABASE_DB_URL" -t -A -F '|' <<'EOF'
          WITH acks AS (
            SELECT COALESCE(metadata->>'ok', meta->>'ok') AS ok_flag
              FROM public.oasis_events
             WHERE topic = 'orb.session.audio_ready.acked'
               AND created_at >= now() - interval '24 hours'
          )
          SELECT COUNT(*) AS total,
                 COUNT(*) FILTER (WHERE ok_flag = 'false') AS failed
            FROM acks;
          EOF
          )
          LINE=$(echo "$OUTPUT" | grep -v '^$' | tail -1)
          TOTAL=$(echo "$LINE" | cut -d'|' -f1 | tr -d ' \r')
          FAILED=$(echo "$LINE" | cut -d'|' -f2 | tr -d ' \r')
          echo "Last 24h audio-ready acks: $TOTAL total, $FAILED with ok:false"

          if ! [[ "$TOTAL" =~ ^[0-9]+$ ]] || ! [[ "$FAILED" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse ack-health output. Raw: $OUTPUT"
            exit 1
          fi

          # `ok` here is the return of writeOrbSessionState(), NOT the client's
          # readiness — that misreading is what let VTID-03480 hide for months.
          # Any ok:false at all means the write path is broken again.
          if [ "$TOTAL" -gt "0" ] && [ "$FAILED" -gt "0" ]; then
            echo "::error::$FAILED of $TOTAL audio-ready acks in the last 24h reported ok:false. That flag is the writeOrbSessionState() return value, not client readiness — the session-state write path is failing again (VTID-03480 regression)."
            exit 1
          fi
