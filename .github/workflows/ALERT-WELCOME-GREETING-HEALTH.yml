name: Alert — Welcome Greeting Production Health

# VTID-03089: independent daily heartbeat. Compares actual signups vs actual
# welcome greetings fired in the last 24 hours. If signups happened but the
# trigger produced zero greetings, fail the run so the alarm lights up.
#
# This is the second layer on top of SMOKE-WELCOME-GREETING.yml: smoke test
# proves the trigger CODE works on synthetic data; this alert proves the
# trigger is firing on REAL traffic.
#
# VTID-03492 — TRANSPORT CHANGED, deliberately NOT psql.
# This workflow had failed EVERY scheduled run since at least 2026-07-29 with:
#
#   psql: error: ... FATAL: (EADDRNOTALLOWED)
#   address not in tenant allow_list: {52, 225, 29, 98}
#
# The Supabase project has a network allow-list and GitHub runner IPs are not
# on it (they differ per run, so allow-listing them is not practical). It was
# not flaky — it was structurally unable to connect, and had been silently
# dead for weeks while sitting on the "known chronic failure, don't chase" list.
#
# PostgREST is a separate edge service, NOT subject to the DB allow-list, so
# the query now runs as an RPC over HTTPS with secrets that already exist.
# See supabase/migrations/20260804100000_vtid_03492_ci_health_rpcs_v2.sql.

on:
  schedule:
    - cron: '0 7 * * *'   # 09:00 CET daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Compare last-24h signups vs greetings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE secrets are not set on this repo."
            exit 1
          fi
          HTTP=$(curl -sS -o health.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ci_welcome_greeting_health" \
            -H "apikey: $SUPABASE_SERVICE_ROLE" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE" \
            -H 'Content-Type: application/json' -d '{}')
          if [ "$HTTP" != "200" ]; then
            echo "::error::ci_welcome_greeting_health RPC returned HTTP $HTTP. If 404, apply supabase/migrations/20260804100000_vtid_03492_ci_health_rpcs_v2.sql."
            head -c 500 health.json || true
            exit 1
          fi
          cat health.json; echo

          SIGNUPS=$(jq -r '.signups_24h' health.json)
          SENDERS=$(jq -r '.greeted_senders_24h' health.json)
          UNFLAGGED=$(jq -r '.unflagged_24h' health.json)
          echo "Last 24h: $SIGNUPS signups, $SENDERS distinct trigger-fired senders, $UNFLAGGED unflagged recent users"

          if ! [[ "$SIGNUPS" =~ ^[0-9]+$ ]] || ! [[ "$SENDERS" =~ ^[0-9]+$ ]] || ! [[ "$UNFLAGGED" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse health output."
            exit 1
          fi

          # Two failure modes worth alarming:
          #   * Signups happened, but the trigger emitted zero greetings.
          #   * Any user from the last 24h still has welcome_chat_sent=false.
          # Either signals a broken trigger or someone reintroducing the
          # endpoint-attachment regression.
          if [ "$SIGNUPS" -gt "0" ] && [ "$SENDERS" -eq "0" ]; then
            echo "::error::$SIGNUPS new signups in last 24h but ZERO trigger-fired greetings. Trigger likely broken or disabled."
            exit 1
          fi
          if [ "$UNFLAGGED" -gt "0" ]; then
            echo "::error::$UNFLAGGED users registered in the last 24h still have welcome_chat_sent=false. Greeting fan-out is silently failing for them."
            exit 1
          fi

          echo "✓ Healthy: every recent signup got greeted by the trigger."
