name: SQL-HEALTH-STORE
run-name: 'Health store against a throwaway Postgres [VTID: VTID-05158] (${{ github.ref_name }})'

# VTID-05158 — the Aurora-only health store migration against a disposable
# Postgres service container shaped like Aurora (no auth.users, no
# storage.objects): partitions and their types, replace idempotency, hourly and
# daily rollups (incl. a Europe/Berlin DST day), old series to the hourly tier,
# purge, suppression, erase_user_data() across partitions, RLS and grants, and
# the placement guard that refuses a Supabase-shaped database. Never runs
# against Supabase or Aurora.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*health_store*.sql'
      - 'supabase/migrations/*erase_user_data*.sql'
      - 'scripts/ci/sql-tests/**'
      - '.github/workflows/SQL-HEALTH-STORE.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the health store test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-health-store-test.sh 2>&1 | tee /tmp/health-store.log
      - name: Assert the test ran to the end
        run: |
          grep -q '^PASS vtid-05158 health store' /tmp/health-store.log
          grep -q '^PASS vtid-05158 placement guard' /tmp/health-store.log
