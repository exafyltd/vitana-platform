name: CICDL-GATEWAY-CI
# VTID: DEV-CICDL-0034
# VT_LAYER: CICDL
# VT_MODULE: GATEWAY
# Purpose: Minimal CI to unblock merge - full test coverage deferred to DEV-CICDL-0035

run-name: 'Gateway CI [VTID: DEV-CICDL-0034] (${{ github.ref_name }})'

on:
  push:
    branches: [ main, develop, 'vt/**' ]
    paths:
      - 'services/gateway/**'
      - 'packages/**'
      - 'prisma/**'
      - '.github/workflows/CICDL-GATEWAY-CI.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/gateway/**'
      - 'packages/**'
      - 'prisma/**'

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9.0.0'
  VTID: DEV-CICDL-0034
  VT_LAYER: CICDL
  VT_MODULE: GATEWAY

jobs:
  gateway-validation:
    name: Gateway Validation (Minimal CI)
    runs-on: ubuntu-latest
    
    # Self-contained Postgres - no external dependencies
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Set Test Environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/vitana_test?schema=public" >> $GITHUB_ENV
          echo "SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE=test-service-role-key-mock" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm exec prisma generate

      - name: Prisma Migrate
        run: pnpm exec prisma migrate deploy || pnpm exec prisma db push --skip-generate

      - name: Prisma Validate
        run: pnpm exec prisma validate

      # VTID-04950: the root pnpm install never installs services/gateway's own
      # dependencies, so `tsc` resolved to a different TypeScript and failed on
      # tsconfig (TS5108). `|| echo` hid that for as long as the step existed.
      # Install the gateway's locked deps, the same way TEST-SUITE does.
      - name: Install gateway dependencies
        working-directory: services/gateway
        run: npm ci --no-audit --no-fund

      # VTID-05303 (fake-checks-dedupe): the "Gateway Build Check" step was
      # removed here. The gateway `npm run build` is already a dedicated step in
      # ENFORCE-FRONTEND-CANONICAL-SOURCE.yml (the required check, runs on every
      # PR), so building again here duplicated it on the same PRs. The deps
      # install above is kept because the Type Check and Dev-frontend-spec
      # validation below still need the gateway's locked dependencies.

      - name: Validate Dev frontend navigation spec (17 modules / 87 screens)
        working-directory: services/gateway
        run: npm run validate:dev-frontend-spec

      - name: Gateway Type Check
        working-directory: services/gateway
        # VTID-04950: tsc --noEmit reports 0 errors on main, so it gates for real.
        run: pnpm run typecheck

      # VTID-04950: the "Gateway Lint" step was removed. services/gateway has no
      # ESLint config, so `eslint` exited 2 ("couldn't find a configuration
      # file") on every run, and `|| echo` reported success. Introducing a lint
      # regime is a separate decision; a step that cannot lint is not kept.

      # VTID-05303 (fake-checks-dedupe): the commented-out "Gateway Tests" block
      # (marker "# TESTS DEFERRED TO DEV-CICDL-0035") was removed. Real gateway
      # Jest already runs in TEST-SUITE.yml; the dead block was never re-enabled
      # and only confused the job definition.

      - name: Report Validation Success
        if: success()
        run: |
          echo "✅ **DEV-CICDL-0034 Gateway Minimal CI PASSED**"
          echo ""
          echo "**Validated:**"
          echo "- ✅ Postgres service: healthy"
          echo "- ✅ Prisma: generated, migrated, validated"
          echo "- ✅ Gateway: dependencies installed"
          echo "- ✅ Gateway: type-checked"
          echo "- ✅ Gateway: Dev frontend navigation spec validated"
          echo ""
          echo "ℹ️  Gateway build runs in ENFORCE-FRONTEND-CANONICAL-SOURCE (required check)"
          echo "ℹ️  Gateway Jest runs in TEST-SUITE"
          echo ""
          echo "Self-contained CI with pnpm + local Postgres"
