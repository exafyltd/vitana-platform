name: VALIDATOR-CHECK
run-name: 'Validator Check [${{ github.head_ref || github.ref_name }}]'

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    # VTID-03525: scope the trigger to the surface this gate can actually judge.
    #
    # The workflow demands a VALIDATION_PROFILE and accepts exactly two —
    # `command_hub_frontend` and `gateway_backend` — whose path-ownership guards
    # admit only the trees below. It previously ran on EVERY pull request, so a
    # PR touching .github/, scripts/, supabase/migrations/, another service, or
    # docs/ outside docs/validation/ could not pass it under any profile: no
    # VALIDATION_PROFILE -> exit 11, and any profile -> path-ownership violation.
    #
    # That never surfaced because the file was unparseable YAML and the workflow
    # never started (see this VTID). Fixing the parse without scoping the trigger
    # would put an unactionable red X on most PRs in this repo — which is how a
    # governance gate gets muted a second time.
    #
    # VTID-03696: this list is now the gate's REMIT — the guard judges exactly
    # these trees and reports everything else as "not judged" instead of
    # rejecting it. `scripts/ci/validator-path-guard.cjs` holds the same list in
    # `REMIT` and a test fails if the two drift, so they can no longer disagree
    # the way they did between VTID-03525 and VTID-03696.
    #
    # `services/gateway/test/**` was added here by VTID-03696: VTID-03549 had
    # already allowlisted it in the profile (the Acceptance Mapping Gate REQUIRES
    # TEST: tokens and those jest suites live there) but never added it to the
    # trigger, so a tests-only PR was allowed by the profile and never triggered
    # the gate that demanded it.
    paths:
      - 'services/gateway/src/**'
      - 'services/gateway/dist/**'
      - 'services/gateway/openapi/**'
      - 'services/gateway/test/**'
      - 'docs/validation/**'

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load ruleset
        id: rules
        run: |
          test -f gov/validator-rules.yaml || (echo "REJECTED: missing gov/validator-rules.yaml" && exit 2)

      - name: Collect PR text (title/body)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf "%s" "$PR_TITLE" > /tmp/pr_title.txt
          printf "%s" "$PR_BODY"  > /tmp/pr_body.txt
          test -s /tmp/pr_title.txt || (echo "REJECTED: empty PR title" && exit 2)
          test -s /tmp/pr_body.txt  || (echo "REJECTED: empty PR body" && exit 2)

      - name: Extract VTID + Validation Profile
        id: meta
        run: |
          # VTID-03696 — the body fallback must be a DECLARATION, not a prose
          # mention.
          #
          # This used to take the first `VTID-\d+` appearing anywhere in the
          # body. Every later gate keys off it — most importantly the Evidence
          # Pack Gate, which demands `docs/validation/$VTID/`. So a PR that
          # merely CITES an older VTID as background had its evidence directory
          # silently pointed at unrelated, already-shipped work.
          #
          # Measured on PR #3144: the first VTID- in the body was VTID-03495
          # (the Polly provider, cited as context), and the gate would have
          # demanded docs/validation/VTID-03495/. Creating that directory to go
          # green would have filed evidence for this PR under someone else's
          # VTID — a green check attached to the wrong work.
          #
          # The title remains the primary source (the Merge Deploy Gate already
          # requires the VTID there). The body fallback now requires an explicit
          # `VTID: VTID-XXXXX` line.
          VTID="$(grep -Eo 'VTID-[0-9]{4,5}' /tmp/pr_title.txt | head -n 1)"
          if [ -z "$VTID" ]; then
            VTID="$(grep -Eo '^[[:space:]]*VTID:[[:space:]]*VTID-[0-9]{4,5}' /tmp/pr_body.txt \
                    | grep -Eo 'VTID-[0-9]{4,5}' | head -n 1)"
          fi
          test -n "$VTID" || (echo "REJECTED: no VTID in the title, and no explicit 'VTID: VTID-XXXXX' line in the body" && exit 10)

          PROFILE="$(grep -Eo 'VALIDATION_PROFILE:\s*[a-zA-Z0-9_/-]+' /tmp/pr_body.txt | head -n 1 | awk '{print $2}')"
          test -n "$PROFILE" || (echo "REJECTED: VALIDATION_PROFILE missing in PR body" && exit 11)

          echo "VTID=$VTID" >> $GITHUB_OUTPUT
          echo "PROFILE=$PROFILE" >> $GITHUB_OUTPUT
          echo "Detected VTID=$VTID PROFILE=$PROFILE"

      - name: Require PR markers (scope + acceptance + merge payload + oasis impact)
        run: |
          grep -q "SCOPE_ALLOWLIST:" /tmp/pr_body.txt || (echo "REJECTED: missing SCOPE_ALLOWLIST:" && exit 12)
          grep -q "ACCEPTANCE:"     /tmp/pr_body.txt || (echo "REJECTED: missing ACCEPTANCE:" && exit 13)
          grep -q "MERGE_PAYLOAD_PREVIEW:" /tmp/pr_body.txt || (echo "REJECTED: missing MERGE_PAYLOAD_PREVIEW:" && exit 14)
          grep -q "OASIS_IMPACT:"   /tmp/pr_body.txt || (echo "REJECTED: missing OASIS_IMPACT:" && exit 15)

      - name: Compute changed files
        id: diff
        run: |
          BASE="${{ github.base_ref }}"
          # Fetch the base branch FULLY: the checkout is fetch-depth 0, but a --depth=1
          # base fetch shallow-clips origin/$BASE, and the moment main advances past the
          # PR fork point `git diff origin/main...HEAD` dies with "no merge base"
          # (VTID-03570 — bit every PR after the first post-fork merge to main).
          git fetch origin "$BASE"
          git diff --name-only "origin/$BASE"...HEAD > /tmp/changed_files.txt
          COUNT="$(wc -l < /tmp/changed_files.txt | tr -d ' ')"
          echo "Changed files: $COUNT"
          test "$COUNT" -gt 0 || (echo "REJECTED: no changes detected" && exit 16)

      - name: Enforce Path Ownership Guard (profile-based)
        env:
          PROFILE: ${{ steps.meta.outputs.PROFILE }}
        # VTID-03696 — the logic moved into `scripts/ci/validator-path-guard.cjs`
        # so it can be unit-tested. This step had been silently broken twice, and
        # BOTH times it was a parsing trap rather than a logic error: a heredoc
        # that terminated the YAML block scalar (VTID-03505), and a multi-line
        # awk program that was invalid syntax and so failed every PR regardless
        # of content (VTID-03549). Neither is visible when reading the YAML and
        # neither had a test. Inline shell is where that class of bug lives.
        #
        # Exit codes are unchanged in meaning except 20, which was split:
        #   20 committed .env      (was: .env OR lockfile)
        #   21 unknown profile
        #   22 in-remit file outside the profile allowlist
        #   23 lockfile without a DEPENDENCY_CHANGE: declaration (new)
        run: |
          node scripts/ci/validator-path-guard.cjs \
            /tmp/changed_files.txt "$PROFILE" /tmp/pr_body.txt

      - name: Evidence Pack Gate
        env:
          VTID: ${{ steps.meta.outputs.VTID }}
        run: |
          EVID="docs/validation/$VTID"
          test -d "$EVID" || (echo "REJECTED: missing evidence dir $EVID" && exit 30)
          test -f "$EVID/acceptance.md" || (echo "REJECTED: missing $EVID/acceptance.md" && exit 31)
          test -f "$EVID/commands.log"  || (echo "REJECTED: missing $EVID/commands.log" && exit 32)
          test -d "$EVID/outputs"       || (echo "REJECTED: missing $EVID/outputs/" && exit 33)

      - name: Acceptance Mapping Gate (no unmapped ACs)
        env:
          VTID: ${{ steps.meta.outputs.VTID }}
        run: |
          A="docs/validation/$VTID/acceptance.md"
          # Require at least 1 AC block and require each AC line to include a Verification token.
          grep -qE '^AC-' "$A" || (echo "REJECTED: acceptance.md has no AC- entries" && exit 40)
          # Every AC- line must be followed somewhere (within next 12 lines) by one of TEST:/CURL:/UI:
          python3 - << 'PY'
          import re, sys
          path="docs/validation/${VTID}/acceptance.md"
          # GitHub expands env vars in runner shell; we re-read from env:
          import os
          path=os.path.expandvars(path)
          txt=open(path,encoding="utf-8").read().splitlines()
          ac_idx=[i for i,l in enumerate(txt) if re.match(r'^AC-\d+', l.strip())]
          if not ac_idx:
            print("REJECTED: no AC- entries"); sys.exit(40)
          for i in ac_idx:
            window=txt[i+1:i+13]
            if not any(re.match(r'^(TEST:|CURL:|UI:)', w.strip()) for w in window):
              print(f"REJECTED: AC at line {i+1} has no TEST:/CURL:/UI: mapping within 12 lines")
              sys.exit(41)
          print("Acceptance mapping OK")
          PY

      - name: CSP Governance Gate (scan changed files)
        run: |
          # VTID-03505 — DO NOT un-indent the `python3 - <<PY` heredoc below.
          #
          # A `run: |` block scalar ends at the first line indented less than
          # the block, so a heredoc body written at column 0 (which is what
          # bash normally wants) silently TERMINATES the YAML scalar. GitHub
          # then fails to parse the whole workflow:
          #
          #   could not find expected ':'  ... line 160, column 1
          #
          # That is a *startup* failure, not a step failure: the run completes
          # in the same second it starts with ZERO jobs and a bare red X, and
          # nothing in the Actions UI says why. This file sat broken that way
          # for at least 30 consecutive runs on every branch including main,
          # so PR governance was silently unenforced the entire time.
          #
          # Indentation is safe: YAML strips the block's common indentation
          # before bash ever sees the script, so the `PY` terminator still
          # arrives at column 0 and the heredoc works. `<<PY` is deliberately
          # UNQUOTED so bash expands $p and $f into the Python source.
          #
          # VTID-03696 — scan only the browser-served surface.
          #
          # This used to scan EVERY changed file. Those patterns only mean
          # something in code a browser executes; against YAML, lockfiles,
          # markdown and CI scripts they are just strings. Two false positives,
          # one of them a trap:
          #
          #   * THIS FILE matched `<script`, `.style` and `unsafe-inline` —
          #     because the PATTERNS list below IS those strings. The gate flags
          #     its own source, so the CSP gate rejected any PR that edits
          #     VALIDATOR-CHECK.yml: the validator could not be modified without
          #     the validator failing the change. It stayed hidden because the
          #     file is rarely touched and, pre-VTID-03696, the path guard
          #     rejected such PRs several steps earlier anyway.
          #   * services/gateway/package-lock.json matched the CDN-asset URL
          #     pattern on a registry URL. A lockfile is not served to anyone.
          #
          # Scoping is by construction (the command-hub frontend trees) rather
          # than by luck. See `CSP_SURFACE` in the guard module.
          node scripts/ci/validator-path-guard.cjs --csp-targets \
            /tmp/changed_files.txt > /tmp/csp_files.txt
          echo "CSP scan targets: $(wc -l < /tmp/csp_files.txt)"

          PATTERNS=(
            "<script(?![^>]*\\bsrc=)"
            "style\\s*="
            "\\.style\\b"
            "\\beval\\s*\\("
            "new\\s+Function\\s*\\("
            "unsafe-inline"
            "https?://[^\\s\"']+\\.(js|css)"
          )
          FAIL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            for p in "${PATTERNS[@]}"; do
              if python3 - <<PY
          import re,sys
          p=re.compile(r'''$p''', re.IGNORECASE)
          data=open("$f","rb").read()
          try: s=data.decode("utf-8", errors="ignore")
          except: s=str(data)
          sys.exit(0 if not p.search(s) else 1)
          PY
              then : ; else
                echo "REJECTED: CSP pattern hit in $f :: /$p/"
                FAIL=1
              fi
            done
          done < /tmp/csp_files.txt
          [ "$FAIL" -eq 0 ] || exit 50

      - name: Build Gate (profile-based)
        env:
          PROFILE: ${{ steps.meta.outputs.PROFILE }}
        run: |
          cd services/gateway
          npm ci
          npm run build

          if [ "$PROFILE" = "command_hub_frontend" ]; then
            # Require that src and dist both changed (your mirroring governance)
            SRC_CHANGED="$(grep -c '^services/gateway/src/frontend/command-hub/' /tmp/changed_files.txt || true)"
            DIST_CHANGED="$(grep -c '^services/gateway/dist/frontend/command-hub/' /tmp/changed_files.txt || true)"
            if [ "$SRC_CHANGED" -eq 0 ] || [ "$DIST_CHANGED" -eq 0 ]; then
              echo "REJECTED: command_hub_frontend requires src+dist both updated"
              exit 60
            fi
          fi

      - name: Route Mount Evidence Gate (conditional)
        env:
          VTID: ${{ steps.meta.outputs.VTID }}
        run: |
          # VTID-03696 — trigger on an ADDED ROUTE, not on a touched route FILE.
          #
          # This used to fire whenever anything under src/routes/ (or
          # src/index.ts / src/app.ts) changed, and then demand ROUTE_MOUNT: /
          # FINAL_URL: / CURL_PROOF:. But editing a route file is not the same
          # as adding a route — VTID-03692 changed a branch inside an existing
          # WebSocket handler in routes/orb-live.ts and added no route at all.
          #
          # Demanding a curl proof for a route that does not exist does not
          # produce evidence, it produces INVENTED evidence: the only way to go
          # green is to write down a URL nobody can call. A gate that can only
          # be passed by making something up launders a guess into a green
          # check, which is worse than not having the gate.
          #
          # When a route IS added the requirement is unchanged and still binds.
          BASE="${{ github.base_ref }}"
          git diff "origin/$BASE"...HEAD -- \
            'services/gateway/src/routes/' \
            'services/gateway/src/index.ts' \
            'services/gateway/src/app.ts' > /tmp/route_diff.txt || true

          if node scripts/ci/validator-path-guard.cjs --route-evidence-required /tmp/route_diff.txt; then
            A="docs/validation/$VTID/acceptance.md"
            grep -q "ROUTE_MOUNT:" "$A" || (echo "REJECTED: missing ROUTE_MOUNT:" && exit 70)
            grep -q "FINAL_URL:"   "$A" || (echo "REJECTED: missing FINAL_URL:" && exit 71)
            grep -q "CURL_PROOF:"  "$A" || (echo "REJECTED: missing CURL_PROOF:" && exit 72)
          fi

      - name: OASIS Traceability Gate (conditional)
        env:
          VTID: ${{ steps.meta.outputs.VTID }}
        run: |
          IMPACT="$(grep -Eo 'OASIS_IMPACT:\s*(yes|no)' /tmp/pr_body.txt | head -n 1 | awk '{print $2}')"
          test -n "$IMPACT" || (echo "REJECTED: invalid OASIS_IMPACT value" && exit 80)
          if [ "$IMPACT" = "yes" ]; then
            grep -q "OASIS_PROOF:" "docs/validation/$VTID/acceptance.md" || (echo "REJECTED: missing OASIS_PROOF:" && exit 81)
          fi

      - name: Merge Deploy Gate (VTID must be in merge title/message)
        env:
          VTID: ${{ steps.meta.outputs.VTID }}
        run: |
          # Enforce the intent: PR title already contains VTID; also require merge preview marker exists.
          grep -q "$VTID" /tmp/pr_title.txt || (echo "REJECTED: PR title must contain VTID for autodeploy gate" && exit 90)
          grep -q "MERGE_PAYLOAD_PREVIEW:" /tmp/pr_body.txt || (echo "REJECTED: missing MERGE_PAYLOAD_PREVIEW:" && exit 91)

      - name: PASS summary
        env:
          VTID: ${{ steps.meta.outputs.VTID }}
          PROFILE: ${{ steps.meta.outputs.PROFILE }}
        run: |
          echo "APPROVED"
          echo "VTID=$VTID"
          echo "PROFILE=$PROFILE"
          echo "Evidence=docs/validation/$VTID/"
