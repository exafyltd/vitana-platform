# VTID-ALLOCATE — one-step VTID allocation for Claude Code sessions.
#
# A session starts this workflow with a title. CI holds the gateway service token, so the session never needs it.
# The job calls the existing gateway route POST /api/v1/vtid/allocate and prints the result as one log line:
#   VTID_RESULT=VTID-NNNNN
# It fails visibly on any response other than HTTP 201 with ok:true and a vtid, and writes the gateway's error
# body to the step summary.
#
# Gateway: vars.PLAN_SPAR_GATEWAY_URL (same variable PLAN-SPAR uses; default staging). Staging shares the
# production database, so every run writes one real ledger row. Run it for real work only.
# Secret: GATEWAY_SERVICE_TOKEN (the same repository secret PLAN-SPAR uses).

name: VTID-ALLOCATE

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Title for the new VTID (what the work is)'
        required: true
        type: string
      module:
        description: 'Module the VTID belongs to'
        required: false
        default: 'community-app'
        type: string

permissions:
  contents: read

jobs:
  allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GATEWAY_URL: ${{ vars.PLAN_SPAR_GATEWAY_URL || 'https://preview-aws-gateway.vitanaland.com' }}
      GATEWAY_SERVICE_TOKEN: ${{ secrets.GATEWAY_SERVICE_TOKEN }}
      TITLE: ${{ inputs.title }}
      MODULE: ${{ inputs.module }}
    steps:
      - name: Allocate VTID
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${GATEWAY_SERVICE_TOKEN:-}" ]; then
            echo "::error::GATEWAY_SERVICE_TOKEN secret is not set" >&2
            exit 1
          fi
          if [ -z "${TITLE// /}" ]; then
            echo "::error::title is required" >&2
            exit 1
          fi
          echo "::add-mask::${GATEWAY_SERVICE_TOKEN}"

          body=$(jq -n --arg title "$TITLE" --arg module "$MODULE" \
            '{source: "claude-code", layer: "DEV", module: $module, title: $title}')

          status=$(curl -sS -o resp.json -w '%{http_code}' -X POST "${GATEWAY_URL}/api/v1/vtid/allocate" \
            -H "Authorization: Bearer ${GATEWAY_SERVICE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body") || status=000

          vtid=$(jq -r '.vtid // empty' resp.json 2>/dev/null || true)
          ok=$(jq -r '.ok // false' resp.json 2>/dev/null || echo false)

          if [ "$status" = "201" ] && [ "$ok" = "true" ] && [ -n "$vtid" ]; then
            echo "VTID_RESULT=${vtid}"
            {
              echo "### VTID allocated"
              echo ""
              echo "- VTID: \`${vtid}\`"
              echo "- Module: \`${MODULE}\`"
              echo "- Title: ${TITLE}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::VTID allocation failed (HTTP ${status})" >&2
          {
            echo "### VTID allocation failed"
            echo ""
            echo "HTTP status: \`${status}\`"
            echo ""
            echo '```json'
            head -c 4000 resp.json 2>/dev/null || echo "(no response body)"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
