name: Run SQL Migration
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration file path (relative to repo root)'
        required: true
        default: 'supabase/migrations/20260321000000_community_user_analyzer.sql'

# VTID-03174: hardened so a psql ERROR fails the step.
# Prior to this commit, the workflow ran `psql ... -f file.sql` without
# `-v ON_ERROR_STOP=1`, so psql exited 0 after any SQL error and the shell
# unconditionally echoed "Migration applied successfully" — producing a
# green workflow even when the entire transaction had rolled back. See the
# VTID-03165 incident on 2026-05-28 where the in-migration drift guard
# RAISEd, the BEGIN..COMMIT rolled back, no DDL applied, and the workflow
# reported success. A green migration workflow that rolled back is worse
# than a red one.

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # VTID-03492: was `psql -v ON_ERROR_STOP=1 -f ... "$SUPABASE_DB_URL"`.
      # That transport is dead from GitHub Actions — the Supabase project has a
      # network allow-list and runner IPs are not on it, so this workflow could
      # not apply anything. (This is a strong candidate for WHY 103 migration
      # files declare tables that do not exist in production — see VTID-03486.)
      #
      # Now applied over the Supabase Management API, which accepts arbitrary
      # SQL over HTTPS. The VTID-03174 hardening is preserved inside the
      # script: it requires a 2xx AND no error payload before returning 0, so a
      # rolled-back migration still fails the step rather than reporting green.
      #
      # Requires the SUPABASE_ACCESS_TOKEN repo secret (see the script header).
      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MIGRATION_FILE: ${{ inputs.migration_file }}
        run: |
          set -euo pipefail
          scripts/ci/apply-sql-via-management-api.sh --file "${MIGRATION_FILE}"
          echo "Migration applied successfully"

      - name: Reload PostgREST schema cache
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          echo "Reloading PostgREST schema cache..."
          scripts/ci/apply-sql-via-management-api.sh --sql "NOTIFY pgrst, 'reload schema';"
          echo "Schema cache reload signal sent"
