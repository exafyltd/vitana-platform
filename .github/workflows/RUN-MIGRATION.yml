name: Run SQL Migration
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration file path (relative to repo root)'
        required: true
        default: 'supabase/migrations/20260321000000_community_user_analyzer.sql'
      # VTID-05023 part 8: which database. 'default' follows the repo variable
      # MIGRATION_TARGET (unset = supabase, today's path unchanged).
      target:
        description: 'Target database (default = repo variable MIGRATION_TARGET, unset = supabase)'
        required: false
        type: choice
        options: [default, supabase, aurora]
        default: default
      allow_non_transactional:
        description: 'Aurora only: run a file with CREATE INDEX CONCURRENTLY etc. statement by statement, without a transaction'
        required: false
        type: boolean
        default: false

# VTID-03174: hardened so a psql ERROR fails the step.
# Prior to this commit, the workflow ran `psql ... -f file.sql` without
# `-v ON_ERROR_STOP=1`, so psql exited 0 after any SQL error and the shell
# unconditionally echoed "Migration applied successfully" — producing a
# green workflow even when the entire transaction had rolled back. See the
# VTID-03165 incident on 2026-05-28 where the in-migration drift guard
# RAISEd, the BEGIN..COMMIT rolled back, no DDL applied, and the workflow
# reported success. A green migration workflow that rolled back is worse
# than a red one.

# VTID-05023 part 8 (Supabase -> Aurora cutover): the target comes from the
# `target` input, else the repo variable MIGRATION_TARGET, else supabase. The
# supabase job below is unchanged; the aurora job applies the file over the RDS
# Data API (scripts/aws/aurora-apply-migration.sh) with the same guarantee: a
# failed migration rolls back and fails the run. While the repo variable
# MIGRATION_FREEZE is 'true' (cutover window: final load -> flip, runbook
# "Part 8 — migrations") nothing is applied to either database.

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - name: Resolve target and enforce the schema freeze
        id: target
        env:
          TARGET_INPUT: ${{ inputs.target }}
          TARGET_VAR: ${{ vars.MIGRATION_TARGET }}
          MIGRATION_FREEZE: ${{ vars.MIGRATION_FREEZE }}
        run: |
          set -euo pipefail
          if [ "${MIGRATION_FREEZE:-}" = "true" ]; then
            echo "::error::MIGRATION_FREEZE=true — schema freeze for the Aurora cutover window (from the start of the final load to the flip). No migration may be applied until the repo variable is cleared."
            exit 1
          fi
          case "${TARGET_INPUT:-default}" in
            supabase|aurora) TARGET="$TARGET_INPUT" ;;
            default|'') TARGET="${TARGET_VAR:-supabase}" ;;
            *) echo "::error::unknown target input '$TARGET_INPUT'"; exit 1 ;;
          esac
          case "$TARGET" in
            supabase|aurora) ;;
            *) echo "::error::repo variable MIGRATION_TARGET='$TARGET' — must be supabase or aurora"; exit 1 ;;
          esac
          echo "Migration target: $TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

  migrate:
    needs: resolve
    if: needs.resolve.outputs.target == 'supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # VTID-03492: was `psql -v ON_ERROR_STOP=1 -f ... "$SUPABASE_DB_URL"`.
      # That transport is dead from GitHub Actions — the Supabase project has a
      # network allow-list and runner IPs are not on it, so this workflow could
      # not apply anything. (This is a strong candidate for WHY 103 migration
      # files declare tables that do not exist in production — see VTID-03486.)
      #
      # Now applied over the Supabase Management API, which accepts arbitrary
      # SQL over HTTPS. The VTID-03174 hardening is preserved inside the
      # script: it requires a 2xx AND no error payload before returning 0, so a
      # rolled-back migration still fails the step rather than reporting green.
      #
      # Requires the SUPABASE_ACCESS_TOKEN repo secret (see the script header).
      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MIGRATION_FILE: ${{ inputs.migration_file }}
        run: |
          set -euo pipefail
          scripts/ci/apply-sql-via-management-api.sh --file "${MIGRATION_FILE}"
          echo "Migration applied successfully"

      - name: Reload PostgREST schema cache
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          echo "Reloading PostgREST schema cache..."
          scripts/ci/apply-sql-via-management-api.sh --sql "NOTIFY pgrst, 'reload schema';"
          echo "Schema cache reload signal sent"

  migrate-aurora:
    needs: resolve
    if: needs.resolve.outputs.target == 'aurora'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # aws-actions/configure-aws-credentials OIDC
    concurrency:
      group: aurora-migration
      cancel-in-progress: false
    env:
      AWS_REGION: eu-central-1
      AWS_ACCOUNT_ID: '472838866351'
      AWS_PAGER: ''
      MIGRATION_FILE: ${{ inputs.migration_file }}
      ALLOW_NON_TX: ${{ inputs.allow_non_transactional }}
      MIGRATION_FREEZE: ${{ vars.MIGRATION_FREEZE }}
    steps:
      - uses: actions/checkout@v4

      # Splits the file and prints the statement plan before any credential
      # exists: a psql meta-command, a top-level ROLLBACK or unflagged
      # CREATE INDEX CONCURRENTLY fails here.
      - name: Plan (dry run, no AWS call)
        run: |
          set -euo pipefail
          FLAGS=()
          [ "$ALLOW_NON_TX" = "true" ] && FLAGS+=(--allow-non-transactional)
          scripts/aws/aurora-apply-migration.sh --file "$MIGRATION_FILE" --dry-run "${FLAGS[@]}"

      - name: Configure AWS credentials (GitHub OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Account/region guard (472838866351 / eu-central-1)
        run: |
          set -euo pipefail
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          [ "$ACCT" = "$AWS_ACCOUNT_ID" ] || { echo "::error::Assumed role is in account $ACCT, expected $AWS_ACCOUNT_ID"; exit 1; }

      # One Data API transaction for the whole file; any failure rolls back and
      # exits 1 naming the statement (VTID-03174). Sends NOTIFY pgrst,
      # 'reload schema' afterwards (aurora-pgrst-ddl-watch.sql does too).
      - name: Apply migration to Aurora (RDS Data API)
        run: |
          set -euo pipefail
          FLAGS=()
          [ "$ALLOW_NON_TX" = "true" ] && FLAGS+=(--allow-non-transactional)
          scripts/aws/aurora-apply-migration.sh --file "$MIGRATION_FILE" "${FLAGS[@]}"
          echo "Migration applied successfully"
