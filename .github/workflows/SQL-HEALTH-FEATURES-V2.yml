name: SQL-HEALTH-FEATURES-V2
run-name: 'health_features_daily_v2 against a throwaway Postgres [VTID: VTID-05162] (${{ github.ref_name }})'

# VTID-05162 — the Aurora-only health_features_daily_v2 /
# health_features_daily_legacy_shadow / health_features_derivation_pending
# migration against a disposable Postgres service container: columns, unique
# keys, checks, service-role-only access, idempotency, erase_user_data()
# discovery of B's four tables (with B1's health_sources), and the placement
# guard that refuses a Supabase-shaped database. Never runs against Supabase or
# Aurora.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*health_features*.sql'
      - 'supabase/migrations/*health_sources*.sql'
      - 'supabase/migrations/*erase_user_data*.sql'
      - 'supabase/migrations/20260417000000_vtid_02100_connector_framework.sql'
      - 'supabase/migrations/20260417000100_vtid_02100_connector_registry_seed.sql'
      - 'supabase/migrations/20260417010000_vtid_02100_connector_registry_update.sql'
      - 'supabase/migrations/20260423200000_vitana_integrations_v1.sql'
      - 'scripts/ci/sql-tests/**'
      - '.github/workflows/SQL-HEALTH-FEATURES-V2.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the health_features_daily_v2 test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-health-features-v2-test.sh 2>&1 | tee /tmp/health-features-v2.log
      - name: Assert the test ran to the end
        run: |
          grep -q '^PASS vtid-05162 health features v2' /tmp/health-features-v2.log
          grep -q '^PASS vtid-05162 placement guard' /tmp/health-features-v2.log
