name: SQL-INDEX-MOVEMENTS
run-name: 'Vitana Index movements against a throwaway Postgres [VTID: VTID-05168] (${{ github.ref_name }})'

# VTID-05168 — runs the Life Timeline P2 migration (vitana_index_movements,
# the renamed canonical compute behind the per-member advisory-locked
# recording function, the wrappers for every SQL-side recompute path,
# privileges, idempotency) and a two-connection concurrency check against a
# disposable Postgres service container. Never runs against Supabase or Aurora.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*index_movements*.sql'
      - 'scripts/ci/sql-tests/**'
      - '.github/workflows/SQL-INDEX-MOVEMENTS.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the index movements test (incl. two-connection concurrency)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-index-movements-test.sh 2>&1 | tee /tmp/index-movements.log
      - name: Assert the test ran to the end
        run: grep -q '^PASS vtid-05168 index movements$' /tmp/index-movements.log
