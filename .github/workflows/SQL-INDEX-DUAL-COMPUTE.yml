name: SQL-INDEX-DUAL-COMPUTE
run-name: 'Vitana Index dual-compute drift guard against a throwaway Postgres [VTID: VTID-05163] (${{ github.ref_name }})'

# VTID-05163 — the functional drift guard of the Health Hub Index projection
# (plan Change 10): the LIVE health_compute_vitana_index_for_user and
# vitana_pillar_streak_days, extracted verbatim from the newest migration that
# defines each, against the read-only projection over identical rows in
# health_features_daily and health_features_daily_v2, for every
# (p_device_from, p_self_from). Also the key-class routing, STABLE, grants,
# vitana_index_dual_compute, erase_user_data() discovery, the rollback data
# fix-up (Change 14) and the placement guard. Never runs against Supabase or
# Aurora.
#
# A Jest test (test/health-features/index-dual-compute-workflow.test.ts) fails
# when a migration that defines either live function is not matched by these
# path triggers — so a change to the live formula always runs this guard.

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260423130000_vitana_index_compute_v3.sql'
      - 'supabase/migrations/20260423140000_vitana_index_compute_for_user.sql'
      - 'supabase/migrations/20260424120000_pillar_tags_community_engagement.sql'
      - 'supabase/migrations/*vitana_index*.sql'
      # VTID-05168 renamed the live formula to health_compute_vitana_index_core.
      - 'supabase/migrations/20261014140000_vtid_05168_index_movements.sql'
      - 'supabase/migrations/*index_movements*.sql'
      - 'supabase/migrations/*index_dual_compute*.sql'
      - 'supabase/migrations/*health_features*.sql'
      - 'supabase/migrations/*health_sources*.sql'
      - 'supabase/migrations/*erase_user_data*.sql'
      - 'supabase/migrations/data-fixups/*rollback_health_features*.sql'
      - 'scripts/ci/sql-tests/**'
      - '.github/workflows/SQL-INDEX-DUAL-COMPUTE.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the Index dual-compute test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-index-dual-compute-test.sh 2>&1 | tee /tmp/index-dual-compute.log
      - name: Assert the test ran to the end
        run: |
          grep -q '^PASS vtid-05163 drift guard' /tmp/index-dual-compute.log
          grep -q '^PASS vtid-05163 index dual compute' /tmp/index-dual-compute.log
          grep -q '^PASS vtid-05163 rollback fix-up' /tmp/index-dual-compute.log
          grep -q '^PASS vtid-05163 placement guard' /tmp/index-dual-compute.log
