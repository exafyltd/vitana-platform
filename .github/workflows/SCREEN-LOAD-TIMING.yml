name: Screen Load Timing (Basic Test)
run-name: VTID-SCREEN-LOAD-01 — Screen Load Timing

# VTID-SCREEN-LOAD-01 — standard basic test for Command Hub Overview.
#
# Runs the mobile screen-load-timing spec against STAGING on a schedule
# and reports every result to the staging gateway, which turns it into the
# "Screen Load Time" entry in Command Hub's Overview service-health grid
# (see fetchServiceHealth in services/gateway/src/frontend/command-hub/app.js).
#
# VTID-04648: this used to drive a real browser through production as the
# test user. A browser suite is a test, and tests run on staging only (owner
# rule 2026-09-26, CLAUDE.md rule 48); production gets read-only health
# checks. The run is read-only: E2E_READONLY=1 skips the test-user
# provisioning in e2e/global-setup.ts, the service-role key is not passed at
# all, and a production URL given to the dispatch input is refused.

on:
  schedule:
    # Every 30 minutes.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      community_url:
        description: 'Community app URL to test against (staging only; production is refused)'
        required: false
        type: string
        default: 'https://preview-aws.vitanaland.com'

concurrency:
  group: screen-load-timing
  cancel-in-progress: false

jobs:
  screen-load-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run screen load timing (staging, read-only)
        working-directory: e2e
        run: |
          case "$COMMUNITY_URL" in
            https://vitanaland.com*|https://www.vitanaland.com*|https://dr-app.vitanaland.com*)
              echo "::error::Refusing to run a browser suite against production ($COMMUNITY_URL). Tests run on staging only (rule 48)."
              exit 1 ;;
          esac
          npx playwright test --project=mobile-shared screen-load-timing.spec.ts
        env:
          COMMUNITY_URL: ${{ inputs.community_url || 'https://preview-aws.vitanaland.com' }}
          GATEWAY_URL: https://preview-aws-gateway.vitanaland.com
          SCREEN_LOAD_ENV: staging
          E2E_READONLY: '1'
          SCREEN_LOAD_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          GATEWAY_SERVICE_TOKEN: ${{ secrets.GATEWAY_SERVICE_TOKEN }}
