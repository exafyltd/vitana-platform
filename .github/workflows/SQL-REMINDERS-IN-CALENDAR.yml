name: SQL-REMINDERS-IN-CALENDAR
run-name: 'reminders in calendar triggers against a throwaway Postgres [VTID: VTID-04978] (${{ github.ref_name }})'

# VTID-04978 — runs the reminders -> calendar mirror triggers (create, snooze,
# complete, cancel, delete, scope, backfill) against a disposable Postgres
# service container. Never runs against Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*vtid_04978*.sql'
      - 'scripts/ci/sql-tests/*reminders-in-calendar*'
      - '.github/workflows/SQL-REMINDERS-IN-CALENDAR.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the reminders in calendar test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-reminders-in-calendar-test.sh 2>&1 | tee /tmp/remindersincal.log
      - name: Assert the test ran to the end
        run: grep -q "^PASS vtid-04978 reminders in calendar" /tmp/remindersincal.log
