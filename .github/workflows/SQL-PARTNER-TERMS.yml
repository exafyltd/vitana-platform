name: SQL-PARTNER-TERMS
run-name: 'partner terms lifecycle against a throwaway Postgres [VTID: VTID-04895 VTID-04909] (${{ github.ref_name }})'

# VTID-04895 — runs the partner terms lifecycle migration against a disposable
# Postgres service container: published versions immutable, one published at a
# time, publish/supersede, the re-acceptance baseline, append-only acceptances
# with hash/version checks, the delegated-session lookup, privileges; and
# (VTID-04909) German binding + the migration's empty-table guard. Never
# runs against Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*partner_terms*.sql'
      - 'scripts/ci/sql-tests/*partner-terms*'
      - '.github/workflows/SQL-PARTNER-TERMS.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the partner terms test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-partner-terms-test.sh 2>&1 | tee /tmp/terms.log
      - name: Assert every test ran to the end
        run: |
          grep -q "^PASS vtid-04895 partner terms lifecycle" /tmp/terms.log
          grep -q "^PASS vtid-04909 partner terms german binding" /tmp/terms.log
          grep -q "^PASS vtid-04909 migration refuses unless empty" /tmp/terms.log
