name: SQL-SUPPLIER-LISTING-GATE
run-name: 'supplier go-live gate against a throwaway Postgres [VTID: VTID-04939] (${{ github.ref_name }})'

# VTID-04939 — proves the VTID-04769 go-live gate keeps products of allowlisted
# test/service/reviewer accounts (service_bot_accounts, notification_test_actors)
# out of Discover, and does not block a real live supplier. Never runs against Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*vtid_04769*.sql'
      - 'scripts/ci/sql-tests/*supplier-listing-gate*'
      - '.github/workflows/SQL-SUPPLIER-LISTING-GATE.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the supplier listing gate test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-supplier-listing-gate-test.sh 2>&1 | tee /tmp/gate.log
      - name: Assert the test ran to the end
        run: grep -q "^ *PASS vtid-04939 supplier listing gate" /tmp/gate.log
