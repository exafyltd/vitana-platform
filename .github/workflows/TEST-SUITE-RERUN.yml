name: TEST-SUITE-RERUN
# VTID-05272 (plan kiro-autonomy-fallback §5 H): one automatic re-run of a
# failed TEST-SUITE run, only when every failed job died before its tests ran
# (runner / checkout / install) or its test step printed no Jest summary — the
# rule in docs/DEPLOYMENT-PIPELINE.md ("A flake is not a root cause"). A run
# whose tests ran and failed is a real red and is never re-run. Attempt 1 only,
# so there is at most one re-run per run.
#
# Security: workflow_run runs this file from the default branch; the policy
# script is checked out from the default branch too (never from the PR), and
# the token can only read Actions data and re-run the failed jobs.
on:
  workflow_run:
    workflows: [TEST-SUITE]
    types: [completed]
permissions:
  actions: write
  contents: read
concurrency:
  group: test-suite-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  rerun:
    name: Re-run on infra failure
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci/test-suite
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Apply the re-run policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/test-suite/rerun-policy.mjs --repo "${{ github.repository }}" \
            --run-id "${{ github.event.workflow_run.id }}" --summary "$GITHUB_STEP_SUMMARY"
