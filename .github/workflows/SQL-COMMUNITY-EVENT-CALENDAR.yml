name: SQL-COMMUNITY-EVENT-CALENDAR
run-name: 'community event calendar triggers against a throwaway Postgres [VTID: VTID-04915] (${{ github.ref_name }})'

# VTID-04915 — runs the community event calendar triggers (host entry on
# insert, time/place/title sync on update, cancel on delete, host backfill)
# next to the VTID-04321 attendee trigger they share rows with, against a
# disposable Postgres service container. Never runs against Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/*vtid_04915*.sql'
      - 'supabase/migrations/*vtid_04321*.sql'
      - 'scripts/ci/sql-tests/*community-event-calendar*'
      - '.github/workflows/SQL-COMMUNITY-EVENT-CALENDAR.yml'
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the community event calendar test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          scripts/ci/sql-tests/run-community-event-calendar-test.sh 2>&1 | tee /tmp/calendar.log
      - name: Assert the test ran to the end
        run: grep -q "^PASS vtid-04915 community event calendar" /tmp/calendar.log
