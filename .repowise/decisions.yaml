- id: cbfebc6e1bb6ec48907255ee5960b3fb
  title: RepoWise has no Bedrock provider — its LLM synthesis is unconfigured in this environment
  decision: Do not fake a bedrock provider for repowise. Leave get_answer/full_upgrade unconfigured until
    an operator provisions one of repowise's real supported providers — deepseek is the natural pick since
    DEEPSEEK_API_KEY is already an AWS Secrets Manager entry this platform provisions for the gateway.
  reason: CLAUDE.md's own standing rule is Bedrock for THIS codebase's own LLM calls, but that rule cannot
    extend to a third-party tool (repowise) that never implemented a Bedrock adapter — inventing one would
    mean silently routing through some other mechanism, which is exactly the kind of unverified behavior
    this codebase's own §2b/§10a rules exist to prevent.
  scope:
  - docs/codeintel
  currency: active
  source: cli
